<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#000000">
<title>FVA 유입 현황</title>
<link rel="icon" href="/favicon.ico">
<style>
  /* 애플 피트니스 화면의 문법을 가져왔다.
       · 검정 바탕 위에 테두리 없는 둥근 카드
       · 지표마다 고유색을 주고, 그 색은 라벨과 막대에만 쓴다
       · 라벨은 작게, 숫자는 크게
     선을 긋지 않는다. 카드의 면과 색이 구분을 대신한다. */
  :root{
    --bg:#000;
    --card:#1C1C1E;
    --card2:#2C2C2E;
    --ink:#fff;
    --sub:#98989F;
    --dim:#636366;

    --visit:#2CFF05;   /* 브랜드 초록 — 방문 */
    --ads:#FF375F;     /* 광고 */
    --query:#0AFFE7;   /* 검색어 */
    --who:#FFD60A;     /* 누가 보고 있나 */
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Pretendard,
                "Apple SD Gothic Neo",sans-serif;
    font-size:15px; line-height:1.4; letter-spacing:-.015em;
    -webkit-font-smoothing:antialiased;
    padding:max(18px,env(safe-area-inset-top)) 16px 56px;
  }
  .wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
  a{color:inherit;text-decoration:none}

  /* ── 머리 ── */
  .hd{display:flex;flex-direction:column;gap:12px}
  .hd .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  h1{font-size:31px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
  .date{font-size:14px;color:var(--sub);font-weight:600;white-space:nowrap}

  /* 기간 — 애플 세그먼티드 컨트롤 */
  .seg{display:flex;background:var(--card);border-radius:9px;padding:2px;gap:2px}
  .seg button{
    flex:1;font:inherit;font-size:13px;font-weight:600;color:var(--ink);
    background:none;border:0;border-radius:7px;padding:6px 4px;cursor:pointer;
    transition:background .15s;
  }
  .seg button[aria-selected="true"]{background:var(--card2)}

  /* ── 큰 숫자 ── */
  .stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .stat{background:var(--card);border-radius:16px;padding:14px 16px 15px}
  .stat .lb{
    font-size:12px;font-weight:700;letter-spacing:.02em;margin-bottom:3px;
    display:flex;align-items:center;gap:5px;
  }
  .stat .lb i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .stat .vl{
    font-size:30px;font-weight:800;letter-spacing:-.045em;line-height:1.05;
    font-variant-numeric:tabular-nums;
  }
  .stat .vl span{font-size:15px;font-weight:700;color:var(--sub);margin-left:2px}

  /* ── 흐름 그래프 ──
     숫자 하나로는 늘었는지 줄었는지를 알 수 없다. 「오늘」은 시간대별,
     나머지 기간은 날짜별 막대. 눈금선은 긋지 않는다 — 막대 높이만으로 읽는다. */
  .chart{background:var(--card);border-radius:16px;padding:14px 16px 12px}
  .chart .top{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
  .chart .top b{font-size:13px;font-weight:700;color:var(--sub)}
  .chart .top .pk{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  .chart .top .pk em{font-style:normal;color:var(--visit);font-weight:800}
  .bars{display:flex;align-items:flex-end;gap:2px;height:82px}
  .bars .b{
    flex:1;min-width:0;border-radius:3px 3px 1px 1px;
    background:var(--visit);opacity:.85;transition:opacity .12s;
  }
  .bars .b.z{background:rgba(255,255,255,.09)}   /* 값이 0 인 칸도 자리를 남긴다 */
  .bars .b.hi{opacity:1}
  .chart .ax{display:flex;justify-content:space-between;margin-top:7px;
             font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}

  /* 막대에 손을 올리면 그 칸이 언제·몇 명인지 띄운다.
     브라우저 기본 title 풍선은 1초쯤 기다려야 뜨고 손가락으로는 아예 안 뜬다. */
  .chart{position:relative}
  .tip{
    position:absolute;z-index:3;pointer-events:none;opacity:0;transform:translate(-50%,-100%);
    background:rgba(58,58,60,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-radius:9px;padding:6px 9px;white-space:nowrap;
    font-size:12px;font-weight:600;line-height:1.35;color:var(--ink);
    transition:opacity .1s;box-shadow:0 6px 18px rgba(0,0,0,.5);
  }
  .tip.on{opacity:1}
  .tip b{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:1px}
  .tip em{font-style:normal;color:var(--visit);font-weight:800}
  .bars .b{cursor:default}
  .bars .b.sel{opacity:1;box-shadow:0 0 0 1.5px rgba(255,255,255,.5)}

  /* ── 묶음 ── */
  .cat{display:flex;flex-direction:column;gap:11px}
  .cat > .ct{display:flex;flex-direction:column;gap:1px}
  .cat > .ct .k{font-size:12.5px;font-weight:800;letter-spacing:.05em}
  .cat > .ct .t{color:var(--ink);font-size:25px;font-weight:800;letter-spacing:-.04em;line-height:1.15}
  .cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));align-items:start}

  .card{background:var(--card);border-radius:16px;overflow:hidden}
  .card > h3{
    font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.01em;
    padding:13px 16px 8px;display:flex;align-items:center;gap:8px;
  }
  .card > h3 .r{margin-left:auto;font-weight:600;color:var(--dim);font-size:12px;
                display:flex;align-items:center;gap:6px;white-space:nowrap}

  ul{list-style:none}
  li{display:flex;align-items:center;gap:12px;padding:9px 16px}
  li + li{box-shadow:inset 0 .5px 0 rgba(255,255,255,.07)}
  .nm{flex:1;min-width:0;font-size:14.5px;font-weight:600;color:var(--ink);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nm small{display:block;font-size:12px;font-weight:500;color:var(--dim);
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vn{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;
      white-space:nowrap;text-align:right;color:var(--ink)}
  .vn em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--sub);margin-left:3px}

  /* 막대 — 애플의 링 대신 가로 막대. 색은 묶음 색을 그대로 물려받는다. */
  /* 막대 밑에 「그래서 뭘 했나」를 한 줄로. 사람 수만으로는 채널을 비교할 수 없다. */
  .sub{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.35;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sub b{color:var(--sub);font-weight:700}
  .sub .go{color:var(--visit);font-weight:800}
  .track{height:5px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden}
  .track i{display:block;height:100%;border-radius:3px;background:currentColor}
  .rowbar{flex:1;min-width:0}

  .chips{display:flex;flex-wrap:wrap;gap:5px;padding:2px 16px 13px}
  .chip{font-size:12.5px;font-weight:600;background:var(--card2);
        border-radius:7px;padding:4px 9px;white-space:nowrap;color:var(--ink)}
  .chip span{color:var(--dim);font-weight:600;margin-left:3px}
  .chip.off{opacity:.35}
  .chip.wait{opacity:.7}
  .chip b{font-weight:800;font-size:10.5px;color:var(--ads);margin-left:4px}
  .chip.wait b{color:var(--who)}

  /* 채널 배지 — 네이버는 초록, 구글은 파랑. 검색어만 나열하면 어디 것인지 안 보인다. */
  .ch{
    font-size:10.5px;font-weight:800;letter-spacing:.02em;border-radius:4px;
    padding:2px 6px;margin-right:7px;flex:none;
  }
  .ch.nv{background:rgba(3,199,90,.16);color:#03C75A}
  .ch.gg{background:rgba(66,133,244,.18);color:#6BA0F8}
  .card > h3 .ch{margin-right:0}

  .pill{font-size:11px;font-weight:800;border-radius:99px;padding:2px 8px;
        background:rgba(44,255,5,.16);color:var(--visit)}
  .pill.off{background:rgba(255,255,255,.08);color:var(--dim)}

  /* ── 불러오는 중 ──
     피드가 GA4 를 스무 번 넘게 부르는 터라 첫 로딩이 길다. 빈 화면만 보이면
     고장난 줄 안다. 들어올 자리에 회색 덩어리를 깔아 「오는 중」임을 알린다. */
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.7}}
  .sk{background:var(--card);border-radius:16px;animation:pulse 1.3s ease-in-out infinite}
  .sk.h1{height:78px}
  .sk.h2{height:132px}
  .sk.h3{height:210px}
  .loading{
    display:flex;align-items:center;gap:8px;
    font-size:13px;font-weight:600;color:var(--sub);
  }
  .loading i{
    width:13px;height:13px;border-radius:50%;flex:none;
    border:2px solid rgba(255,255,255,.18);border-top-color:var(--visit);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  /* 자동 갱신 때는 화면을 지우지 않는다. 보던 숫자가 사라지면 더 답답하다.
     대신 머리말 옆에 점 하나만 돌려 「지금 새로 받는 중」을 알린다. */
  .date.busy::after{
    content:'';display:inline-block;width:9px;height:9px;margin-left:7px;
    border-radius:50%;border:1.5px solid rgba(255,255,255,.18);border-top-color:var(--visit);
    animation:spin .7s linear infinite;vertical-align:-1px;
  }

  .none{padding:16px;color:var(--dim);font-size:13px}
  .memo{padding:0 16px 13px;color:var(--dim);font-size:12px;line-height:1.5}
  .memo b{color:var(--sub);font-weight:700}

  footer{color:var(--dim);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 12px}

  /* 하단 탭바 — 모바일에서만. 네 묶음을 한 화면씩 갈아끼운다.
     전부 세로로 쌓으면 스크롤이 끝없이 길어진다. */
  .tabbar{display:none}
  @media (max-width:560px){
    body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
    .tabbar{
      display:grid;grid-template-columns:repeat(4,1fr);
      position:fixed;left:0;right:0;bottom:0;z-index:9;
      background:rgba(20,20,22,.86);backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border-top:.5px solid rgba(255,255,255,.12);
      padding:7px 4px calc(7px + env(safe-area-inset-bottom));
    }
    .tabbar button{
      background:none;border:0;font:inherit;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;gap:4px;
      font-size:11px;font-weight:700;color:var(--dim);letter-spacing:-.01em;
    }
    .tabbar button i{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.35}
    .tabbar button[aria-selected="true"]{color:var(--ink)}
    .tabbar button[aria-selected="true"] i{opacity:1}
    .cat{display:none}
    .cat.on{display:flex}
    .cat > .ct{display:none}   /* 탭 이름이 곧 묶음 이름이라 제목을 또 쓸 필요가 없다 */
  }
  @media (max-width:560px){
    body{padding:max(16px,env(safe-area-inset-top)) 14px 48px}
    .wrap{gap:18px}
    h1{font-size:28px}
    .stats{grid-template-columns:1fr 1fr;gap:8px}
    .stat{padding:12px 14px 13px;border-radius:15px}
    .stat .vl{font-size:26px}
    .cards{grid-template-columns:1fr;gap:8px}
    .cat > .ct .t{font-size:23px}
    /* 광고비는 광고 탭에 같은 내용이 또 있다. 맨 위에서는 뺀다 —
       요약 칸이 넷이면 두 줄, 여섯이면 세 줄이라 그만큼 스크롤이 길어진다. */
    .stat.ad{display:none}
    .bars{height:66px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hd">
    <div class="row"><h1>유입 현황</h1><span class="date" id="date"></span></div>
    <div class="seg" id="seg">
      <button data-d="1" aria-selected="true">오늘</button>
      <button data-d="y">어제</button>
      <button data-d="7">7일</button>
      <button data-d="28">28일</button>
      <button data-d="90">90일</button>
    </div>
  </div>

  <div id="stats" class="stats"></div>
  <div id="chart"></div>
  <div id="cats" style="display:flex;flex-direction:column;gap:26px"></div>

  <footer><span id="stamp"></span><span id="foot"></span></footer>
</div>
<nav class="tabbar" id="tabbar" aria-label="분류"></nav>

<script>
/* 서치콘솔 검색어와 GA4 경로는 바깥에서 들어오는 값이다. 그대로 넣으면 안 된다. */
const esc = v => String(v ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => (n ?? 0).toLocaleString('ko-KR');
const won = n => num(Math.round(n ?? 0)) + '원';
const dur = s => { s = Math.round(s||0);
  return s < 60 ? s+'초' : Math.floor(s/60)+'분'+(s%60?' '+(s%60)+'초':''); };

const FEED = 'https://script.google.com/macros/s/AKfycbxX5u3DZXo45__8_7a3XHPjIbD_utCHYeyK7l2lmuvA3b4dENQS_y4ncVgnSHb5RYA/exec';
let DATA = null, ADS = null, DAYS = '1', TAB = 0;
const cur = () => DATA?.ranges?.[DAYS] || null;

/* 카드 하나. 색은 묶음에서 물려받아 막대에만 쓴다. */
const card = (title, rows, none, {right='', chips='', memo=''} = {}) => `
  <div class="card">
    <h3>${title}${right?`<span class="r">${right}</span>`:''}</h3>
    ${chips}
    ${rows.length ? `<ul>${rows.join('')}</ul>` : (none?`<div class="none">${none}</div>`:'')}
    ${memo?`<div class="memo">${memo}</div>`:''}
  </div>`;

const barRow = (name, share, right, sub) => `<li>
  <div class="rowbar">
    <div class="nm">${name}</div>
    <div class="track"><i style="width:${Math.max(share,2)}%"></i></div>
    ${sub ? `<div class="sub">${sub}</div>` : ''}
  </div>
  <div class="vn">${right}</div></li>`;

const plainRow = (name, sub, right) => `<li>
  <div class="nm">${name}${sub?`<small>${sub}</small>`:''}</div>
  <div class="vn">${right}</div></li>`;

const stat = (label, color, value, unit, cls='') => `<div class="stat ${cls}">
  <div class="lb" style="color:${color}"><i></i>${label}</div>
  <div class="vl">${value}${unit?`<span>${unit}</span>`:''}</div></div>`;

/* 흐름 그래프. 막대 높이는 방문자 수 기준이고, 가장 높은 칸만 진하게 둔다.
   막대를 하나하나 라벨링하면 글자가 겹친다. 양 끝과 봉우리만 적는다. */
const chart = (s) => {
  const p = s?.points || [];
  if (p.length < 2) return '';
  const max = Math.max(...p.map(x => x.users), 1);
  const peak = p.reduce((a, b) => (b.users > a.users ? b : a), p[0]);
  const unit = s.unit === 'hour' ? '시간대별' : '날짜별';
  const bars = p.map((x, i) => {
    const h = x.users ? Math.max(Math.round(x.users / max * 100), 5) : 4;
    const hi = x.users === max && max > 0 ? ' hi' : '';
    return `<div class="b${x.users ? hi : ' z'}" style="height:${h}%" data-i="${i}"></div>`;
  }).join('');
  return `<div class="chart" id="chartbox">
    <div class="top"><b>방문자 ${unit}</b>
      <span class="pk">${peak.users ? `가장 많았던 때 ${esc(peak.t)} <em>${num(peak.users)}명</em>` : ''}</span></div>
    <div class="bars">${bars}</div>
    <div class="ax"><span>${esc(p[0].t)}</span><span>${esc(p[p.length-1].t)}</span></div>
    <div class="tip" id="tip"></div>
  </div>`;
};

/* 막대 위 풍선. 막대가 얇아 정확히 짚기 어려우므로, 가로 위치로 가장 가까운
   막대를 골라준다 — 칸 사이 틈에 손이 놓여도 값이 끊기지 않는다. */
function bindChart(points) {
  const box = document.getElementById('chartbox');
  if (!box || !points?.length) return;
  const bars = [...box.querySelectorAll('.bars .b')];
  const tip = document.getElementById('tip');
  const wrap = box.querySelector('.bars');
  let last = -1;

  const show = (clientX) => {
    const r = wrap.getBoundingClientRect();
    const idx = Math.max(0, Math.min(bars.length - 1,
      Math.floor((clientX - r.left) / r.width * bars.length)));
    if (idx !== last) {
      bars.forEach((b, i) => b.classList.toggle('sel', i === idx));
      const p = points[idx];
      tip.innerHTML = `<b>${esc(p.t)}</b>방문 <em>${num(p.users)}명</em> · 조회 ${num(p.views)}회`;
      last = idx;
    }
    // 풍선이 카드 밖으로 삐져나가지 않게 양 끝에서 붙잡는다.
    const bx = bars[idx].getBoundingClientRect();
    const br = box.getBoundingClientRect();
    const half = tip.offsetWidth / 2;
    const x = Math.max(half + 6, Math.min(br.width - half - 6, bx.left + bx.width / 2 - br.left));
    tip.style.left = x + 'px';
    tip.style.top = (bx.top - br.top - 8) + 'px';
    tip.classList.add('on');
  };
  const hide = () => { tip.classList.remove('on'); bars.forEach(b => b.classList.remove('sel')); last = -1; };

  wrap.addEventListener('pointermove', e => show(e.clientX));
  wrap.addEventListener('pointerdown', e => show(e.clientX));
  wrap.addEventListener('pointerleave', hide);
  // 손가락으로 짚었을 때는 떼면 지운다. 마우스와 달리 leave 가 안 온다.
  wrap.addEventListener('pointerup', () => setTimeout(hide, 1600));
}

// ⚠ 「정지」만 뜨면 누가 껐는지 예산을 다 쓴 건지 알 수 없다. 이유를 그대로 적는다.
//   네이버는 확정 과금에 아직 안 잡힌 예상 과금을 더해 일예산과 견주므로,
//   집행액이 예산보다 적어 보이는데도 멈춘다. 그때 「오늘 예산 소진」이 뜬다.
const pill = (on, why) => on ? '<span class="pill">운영 중</span>'
  : `<span class="pill off">${why && why !== '정지' ? why : '정지'}</span>`;

function render(){
  const r = cur();
  document.getElementById('stamp').textContent = DATA?.updated ? DATA.updated + ' 기준' : '';
  document.getElementById('date').textContent = r?.label || '';
  const S = document.getElementById('stats'), C = document.getElementById('cats');
  const G = document.getElementById('chart');
  if(!r){ S.innerHTML=''; G.innerHTML=''; C.innerHTML = `<div class="card"><div class="none">데이터를 불러오지 못했습니다.</div></div>`; return; }

  S.innerHTML =
    stat('방문자','var(--visit)', num(r.users), '명') +
    stat('조회','var(--visit)', num(r.views), '회') +
    stat('머문 시간','var(--visit)', dur(r.avgEngagement)) +
    stat('상담 클릭','var(--query)', num(r.kakaoClicks), '회') +
    stat('온라인 강의','var(--query)', num(r.onlineClicks), '회', 'ad') +
    // ⚠ 요약 칸도 기간을 따라가야 한다. 카드만 고치고 여기를 빠뜨려서
    //   오늘·어제가 같은 금액으로 떴다. 구글은 30일 고정이라 이름에 그렇게 박는다.
    (ADS ? stat('네이버 집행','var(--ads)',
                won((ADS.naver.byPeriod && ADS.naver.byPeriod[DAYS] || ADS.naver).cost), '', 'ad') +
           stat((adsAgeMin(ADS.google?.updated) ?? 0) > 180 ? '구글 30일 ⚠멈춤' : '구글 30일',
                'var(--ads)', won(ADS.google?.cost), '', 'ad') +
           stat('남은 예산','var(--ads)', won(ADS.naver.balance), '', 'ad') : '');

  G.innerHTML = chart(r.series);
  bindChart(r.series?.points);

  const CATS = [
    { k:'TRAFFIC',  t:'방문',           c:'var(--visit)', items:[] },
    { k:'ADS',      t:'광고',           c:'var(--ads)',   items:[] },
    { k:'QUERIES',  t:'검색어',         c:'var(--query)', items:[] },
    { k:'AUDIENCE', t:'누가 보고 있나', c:'var(--who)',   items:[] },
  ];
  const [V, A, Q, W] = CATS.map(c => c.items);

  /* 방문 */
  /* 경로마다 「머문 시간 · 본 페이지 · 누른 것 · 도착지」를 막대 밑에 붙인다.
     싸게 많이 데려와도 3초 만에 나가면 소용이 없고, 적게 와도 상담을 누르면 값어치가 있다. */
  const srcSub = (x) => {
    const bits = [];
    if (x.engage) bits.push(dur(x.engage));
    if (x.pages) bits.push(`${x.pages.toFixed(1)}쪽`);
    const acts = [];
    if (x.kakao) acts.push(`상담 ${num(x.kakao)}`);
    if (x.online) acts.push(`온라인 ${num(x.online)}`);
    if (acts.length) bits.push(`<span class="go">${acts.join(' · ')}</span>`);
    if (x.landing) bits.push(esc(x.landing) + '로 도착');
    return bits.join(' · ');
  };
  V.push(card('어디서 들어왔나',
    (r.sources||[]).slice(0,8).map(s =>
      barRow(esc(s.name), s.share, `${num(s.users)}<em>명 · ${s.share}%</em>`, srcSub(s))),
    '아직 유입이 잡히지 않았습니다.',
    { memo: (r.sources||[]).some(s=>/알 수 없음|경로 불명|not available|not set/i.test(s.name))
        ? '<b>경로 불명</b>은 구글이 아직 출처를 확정 못 한 방문입니다. 하루이틀이면 제자리를 찾습니다.' : '' }));

  // 숫자만 있으면 그게 사람 수인지 조회 수인지 알 수 없다. 단위를 붙인다.
  V.push(card('어떤 페이지',
    (r.pages||[]).slice(0,7).map(p =>
      plainRow(esc(p.name), esc(p.path),
               `${num(p.views)}<em>번 봄 · ${dur(p.avgEngagement)} 머무름</em>`)),
    '아직 조회가 없습니다.',
    { right: '조회 수 · 평균 체류' }));

  V.push(card('어떤 버튼',
    (r.events||[]).map(e =>
      plainRow(esc(e.label), '주로 ' + esc(e.topPage), `${num(e.count)}<em>번 눌림</em>`)),
    '아직 클릭이 없습니다.'));

  /* 광고 */
  if (ADS){
    const n = ADS.naver;
    const G = ADS.google || {};
    /* ⚠ 광고 집행액은 기간 탭을 따라가야 한다. 고정값을 쓰면 오늘·어제·7일이
       모두 같은 숫자로 보여 「왜 같냐」가 된다. 실제로 그랬다.
       네이버는 기간별 수치를 받아 쓰고, 구글은 화면에서 읽는 30일 고정이라 그렇게 밝힌다. */
    const nP = (n.byPeriod && n.byPeriod[DAYS]) || { imp: n.imp, clk: n.clk, cost: n.cost };

    /* 채널을 나란히 놓지 않으면 어디에 돈을 더 넣을지 판단할 수 없다.
       사람 수가 아니라 「클릭 하나에 얼마인가」가 결정을 만든다. */
    const per = (cost, clk) => clk ? Math.round(cost / clk) : null;
    const nCpc = per(nP.cost, nP.clk), gCpc = G.cpc || per(G.cost, G.clk);
    if (nCpc || gCpc) {
      const worst = Math.max(nCpc || 0, gCpc || 0) || 1;
      const line = (name, cpc, cost, clk, note) => `<li>
        <div class="rowbar">
          <div class="nm">${name}</div>
          <div class="track"><i style="width:${Math.max(Math.round((cpc || 0) / worst * 100), 3)}%"></i></div>
          <div class="sub">${num(clk)}클릭 · ${won(cost)}${note ? ' · ' + note : ''}</div>
        </div>
        <div class="vn">${cpc ? won(cpc) : '—'}<em>클릭당</em></div></li>`;
      A.push(card('클릭 하나에 얼마인가', [
        line('<span class="ch gg">구글</span>구글', gCpc, G.cost, G.clk, '최근 30일 고정'),
        line('<span class="ch nv">네이버</span>네이버', nCpc, nP.cost, nP.clk, esc(r.label)),
      ], '', { memo: ((nCpc && gCpc && nCpc > gCpc * 3)
          ? `네이버가 구글보다 <b>${Math.round(nCpc / gCpc)}배</b> 비쌉니다. 같은 돈이면 구글에서 훨씬 많은 사람을 데려옵니다. `
          : '')
        + '네이버는 선택한 기간, <b>구글은 최근 30일 고정</b>입니다 — 구글은 계정 화면에서 읽어오는 값이라 기간을 나눌 수 없습니다.' }));
    }

    /* 하루씩 얼마 나갔는지. 합계만 보면 예산을 올린 날 소진 속도가 어떻게 달라졌는지 안 보인다. */
    if ((n.daily || []).some(d => d.cost)) {
      const days = n.daily.filter(d => d.imp || d.cost);
      const max = Math.max(...days.map(d => d.cost), 1);
      A.push(card('<span class="ch nv">네이버</span>하루에 얼마 나갔나',
        days.slice().reverse().map(d => {
          const md = d.d.slice(5).replace('-', '월 ') + '일';
          return barRow(md, Math.round(d.cost / max * 100),
            `${won(d.cost)}<em>${num(d.clk)}클릭</em>`,
            d.clk ? `클릭당 ${won(Math.round(d.cost / d.clk))} · 노출 ${num(d.imp)}` : `노출 ${num(d.imp)} · 클릭 없음`);
        }),
        '', { right: `하루 최대 ${won(n.dailyBudget)}` }));
    }

    const gStale = adsAgeMin(G.updated) ?? 0;
    A.push(card('집행 현황', [
      plainRow('<span class="ch nv">네이버</span>네이버', `${esc(r.label)} · 하루 최대 ${won(n.dailyBudget)}`,
               `${won(nP.cost)}<em>노출 ${num(nP.imp)} · 클릭 ${num(nP.clk)}</em>`),
      // 구글은 API 를 못 써서 로그인된 크롬 화면을 읽어온다. 언제 읽은 것인지 같이 적는다.
      // 구글은 크롬 화면을 읽는 방식이라 크롬이 최소화돼 있으면 조용히 멈춘다.
      // 파일 전체(updated)는 네이버가 15분마다 갱신하므로 아래쪽 경고에 안 걸린다.
      // 그래서 구글 줄에서 따로 나이를 잰다.
      plainRow('<span class="ch gg">구글</span>구글', G.updated
                                 ? `${esc(G.period || '')} · ${esc(G.updated)} 기준`
                                   + (gStale > 180 ? ` <b style="color:var(--ads)">⚠ ${Math.round(gStale/60)}시간째 멈춤 — 크롬 창을 띄워두세요</b>` : '')
                                 : '<a href="' + esc(G.console) + '" target="_blank" rel="noopener">계정 열기</a>',
               G.cost != null ? `${won(G.cost)}<em>노출 ${num(G.imp)} · 클릭 ${num(G.clk)} · 평균 ${won(G.cpc)}</em>` : ''),
      plainRow('남은 예산', '네이버', won(n.balance)),
    ], '', { right: pill(n.live, n.state),
      memo: n.campaignClk != null && (n.campaignImp !== n.imp)
        ? `위 수치는 <b>새로 짠 세 그룹</b>만 센 것입니다. 같은 캠페인 안에 옛 브랜드 그룹이 남아 있어 `
          + `계정에서는 노출 ${num(n.campaignImp)} · 클릭 ${num(n.campaignClk)} · ${won(n.campaignCost)}로 보입니다.`
        : '' }));

    if ((G.keywords || []).length) {
      A.push(card('<span class="ch gg">구글</span>구글 검색어별 집행',
        G.keywords.map(k => plainRow(
          esc(k.keyword) + (k.note ? ` <b style="color:var(--ads);font-size:11px">${esc(k.note)}</b>` : ''),
          // 광고 관련성이 「평균 미만」이면 입찰을 올려도 노출이 안 는다.
          // 예산 탓을 하다 하루를 버렸던 자리라, 검색어 옆에 바로 보이게 둔다.
          `노출 ${num(k.imp)} · CTR ${k.ctr}%`
            + (k.rel ? ` · 관련성 <b style="color:${k.rel === '평균 미만' ? 'var(--ads)' : 'inherit'}">${esc(k.rel)}</b>` : ''),
          `${won(k.cost)}<em>${num(k.clk)}클릭 · ${won(k.cpc)}</em>`)),
        '', { right: `평균 ${won(G.cpc)}`,
              memo: G.conv === 0
                ? '전환이 0인 건 <b>측정을 8월 16일에 붙였기</b> 때문입니다. 그 전 클릭은 전환으로 안 잡힙니다.'
                : '' }));
    }
    for (const g of n.groups || []) {
      const perf = g.keywords.filter(k => k.imp || k.clk);
      A.push(card('<span class="ch nv">네이버</span>' + esc(g.name),
        perf.map(k => plainRow(esc(k.word), '', `${num(k.imp)}<em>노출 · 클릭 ${num(k.clk)}</em>`)),
        '아직 노출 실적 없음 · 집계는 15분 단위',
        { right: `${pill(g.live, g.state)}<span>입찰 ${num(g.bid)}원</span>`,
          chips: `<div class="chips">${g.keywords.map(k => {
            // 정지와 검토중은 다르다. 검토중은 곧 나갈 것이라 「왜 안 나가지」 하고 헤매지 않게 표시한다.
            const st = k.state || (k.live ? '운영' : '정지');
            const cls = st === '운영' ? '' : st === '검토중' ? ' wait' : ' off';
            const tag = st === '운영' ? '' : `<b>${esc(st)}</b>`;
            return `<span class="chip${cls}">${esc(k.word)}${tag}<span>${num(k.bid)}</span></span>`;
          }).join('')}</div>` }));
    }
  }

  /* 검색어 */
  const gk = r.ads?.google || [], nk = r.ads?.naver || [];
  /* 검색어도 사람 수만 보면 안 된다. 「AI 영상제작」은 4명이 왔지만 전원 13초 만에
     나갔고, 「영상 학원」은 3명 중 1명이 상담을 눌렀다. 머문 시간이 그 차이를 보여준다. */
  const kwSub = (k) => {
    const bits = [];
    if (k.engage) bits.push(dur(k.engage));
    if (k.pages) bits.push(`${k.pages.toFixed(1)}쪽`);
    const acts = [];
    if (k.kakao) acts.push(`상담 ${num(k.kakao)}`);
    if (k.online) acts.push(`온라인 ${num(k.online)}`);
    if (acts.length) bits.push(`<span class="go">${acts.join(' · ')}</span>`);
    return bits.join(' · ') || '아직 행동 없음';
  };
  // 두 채널의 검색어를 나란히 두면 어디 것인지 헷갈린다. 카드 제목과 줄마다 배지를 박는다.
  const kwRow = (k, ch) => barRow(
    `<span class="ch ${ch === '네이버' ? 'nv' : 'gg'}">${ch}</span>${esc(k.keyword)}`,
    100, `${num(k.users)}<em>명</em>`, kwSub(k));
  Q.push(card('<span class="ch gg">구글</span>구글 광고로 들어온 검색어',
    gk.slice(0,8).map(k => kwRow(k, '구글')),
    '광고 유입이 아직 없거나 데이터가 도착 전입니다.'));
  Q.push(card('<span class="ch nv">네이버</span>네이버 광고로 들어온 검색어',
    nk.slice(0,8).map(k => kwRow(k, '네이버')),
    '아직 네이버 광고 유입이 없습니다.'));
  Q.push(card('자연 검색',
    (r.queries||[]).slice(0,7).map(q =>
      plainRow(esc(q.query), '', `${num(q.clicks)}<em>클릭 · 노출 ${num(q.impressions)}</em>`)),
    '서치콘솔은 등록 직후 며칠간 비어 있습니다.'));

  /* 누가 보고 있나 */
  const w = r.who || {};
  const demo = (t, rows) => rows?.length ? card(t,
    rows.slice(0,5).map(x => barRow(esc(x.name), x.share, `${num(x.users)}<em>명 ${x.share}%</em>`)), '') : '';
  W.push(demo('성별', w.gender)); W.push(demo('연령대', w.age));
  W.push(demo('국가', w.country)); W.push(demo('도시', w.city));
  // 빈 칸만 보이면 「방문자가 없어서」인지 「설정이 꺼져서」인지 알 수 없다.
  // 피드가 사유를 같이 보내주므로 그걸 그대로 적는다.
  const off = !(w.gender||[]).length && !(w.age||[]).length && (w.genderNote || w.ageNote);
  if (off) W.push(card('성별 · 연령', [], '',
    { memo: '<b>2026년 8월 17일</b>에 GA4 「Google 신호 데이터」를 켰습니다. '
          + '켠 시점부터 쌓이므로 며칠 지나야 값이 보입니다. 그전까지는 비어 있는 게 정상입니다.' }));

  const live = CATS.filter(c => c.items.filter(Boolean).length);
  C.innerHTML = live.map((c, i) => `<section class="cat${i===TAB?' on':''}" style="color:${c.c}">
      <div class="ct"><span class="k">${c.k}</span><span class="t">${c.t}</span></div>
      <div class="cards">${c.items.filter(Boolean).join('')}</div></section>`).join('');

  document.getElementById('tabbar').innerHTML = live.map((c, i) =>
    `<button data-i="${i}" aria-selected="${i===TAB}" style="--c:${c.c}">
       <i style="color:${c.c}"></i>${c.t}</button>`).join('');
}

/* 탭 전환 — 화면을 갈아끼우고 맨 위로 올린다. */
document.getElementById('tabbar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  TAB = +b.dataset.i;
  document.querySelectorAll('.cat').forEach((s, i) => s.classList.toggle('on', i === TAB));
  [...e.currentTarget.children].forEach((x, i) => x.setAttribute('aria-selected', i === TAB));
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* 광고 수치는 사이트가 아니라 저장소의 data 브랜치에서 읽는다.
   main 에 올리면 15분마다 사이트 전체가 다시 지어져서(하루 96번) 깃허브가
   429 를 내며 배포를 거른다 — 2026-08-17 에 실제로 났다.
   data 브랜치는 Pages 가 안 보므로 올려도 사이트를 다시 짓지 않는다.
   raw 가 막히거나 늦을 때를 대비해 사이트 안의 옛 파일로 물러선다. */
const ADS_RAW = 'https://raw.githubusercontent.com/bowiestudioskr-hub/fva-site/data/data/ads-9c4e17.json';

/* 「2026. 8. 17. PM 11:50:12」 형식이라 Date 가 그냥은 못 읽는다. 손으로 뜯는다.
   못 읽으면 null 을 주고, 그때는 낡았다고 단정하지 않는다. */
const adsAgeMin = (txt) => {
  const m = String(txt || '').match(/(\d+)\.\s*(\d+)\.\s*(\d+)\.\s*(AM|PM)\s*(\d+):(\d+)/);
  if (!m) return null;
  let h = +m[5] % 12; if (m[4] === 'PM') h += 12;
  const t = new Date(+m[1], +m[2] - 1, +m[3], h, +m[6]);
  return (Date.now() - t.getTime()) / 60000;
};
const fetchAds = () =>
  fetch(ADS_RAW + '?t=' + Date.now())
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .catch(() => fetch('data/ads-9c4e17.json?t=' + Date.now())
      .then(r => r.json()).catch(() => null));

/* 첫 로딩용 자리 채우기. 들어올 카드와 같은 모양으로 깔아둔다. */
function skeleton(){
  document.getElementById('date').innerHTML = '<span class="loading"><i></i>불러오는 중</span>';
  document.getElementById('stats').innerHTML = '<div class="sk h1"></div>'.repeat(4);
  document.getElementById('chart').innerHTML = '<div class="sk h2"></div>';
  document.getElementById('cats').innerHTML =
    '<div class="cards">' + '<div class="sk h3"></div>'.repeat(2) + '</div>';
  document.getElementById('foot').textContent = '';
}

function load(){
  const first = !DATA;
  if (first) skeleton();
  else document.getElementById('date').classList.add('busy');

  return Promise.all([
    fetch(FEED + '?t=' + Date.now()).then(r => r.json()).catch(() => null),
    fetchAds(),
  ]).then(([feed, adsData]) => {
    if (feed) DATA = feed;
    if (adsData) ADS = adsData;
    // 광고 수치가 멈춰도 화면은 멀쩡해 보인다. 그러면 옛 숫자를 오늘 숫자로 읽는다.
    // 한 시간 넘게 안 들어왔으면 그 사실을 적어둔다 — 틀린 숫자를 조용히 보여주느니
    // 「멈춰 있다」고 말하는 편이 낫다. (맥이 꺼졌거나 깃허브가 아플 때 그렇게 된다.)
    const foot = document.getElementById('foot');
    const stale = adsAgeMin(ADS?.updated);
    foot.textContent =
      (ADS?.updated ? '광고 ' + ADS.updated + ' 기준 · ' : '') + '수치는 15분마다 새로 집계';
    if (stale != null && stale > 60) {
      foot.textContent += ` · ⚠ 광고 수치가 ${Math.round(stale / 60)}시간째 멈춰 있음`;
      foot.style.color = 'var(--ads)';
    } else {
      foot.style.color = '';
    }
    render();
  }).catch(() => {
    if (first) document.getElementById('cats').innerHTML =
      '<div class="card"><div class="none">데이터를 불러오지 못했습니다. 잠시 후 다시 시도합니다.</div></div>';
  }).finally(() => {
    document.getElementById('date').classList.remove('busy');
  });
}
load();

/* 화면을 켜둔 채 두는 일이 많다. 3분마다 스스로 읽고, 탭이 뒤에 있으면 쉰다. */
setInterval(() => { if (!document.hidden) load(); }, 180000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });

document.getElementById('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  // 「어제」는 숫자가 아니라 'y' 다. 숫자로 바꾸면 NaN 이 되어 화면이 빈다.
  DAYS = b.dataset.d;
  [...e.currentTarget.children].forEach(x => x.setAttribute('aria-selected', x === b));
  render();
});
</script>
</body>
