<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>FVA 유입 현황</title>
<link rel="icon" href="/favicon.ico">
<style>
  /* 흰 종이에 검정 글씨. 색은 브랜드 초록만, 문서 뒤에 흐리게 깔아 은은하게 쓴다. */
  :root{
    --ink:#000; --sub:#6E6E6E; --line:#E7E7E7; --hair:#F2F2F2; --bg:#fff;
    --green:#2CFF05; --cyan:#08FFD0;
    --pad:clamp(16px,4vw,40px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:Pretendard,"Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg); color:var(--ink);
    font-size:15px; line-height:1.55; letter-spacing:-.01em;
    padding:var(--pad) var(--pad) 90px; position:relative; overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* 네온 블러 — 글자는 건드리지 않고 뒤에서만 빛난다 */
  body::before,body::after{
    content:"";position:fixed;border-radius:50%;z-index:-1;pointer-events:none;
    filter:blur(90px);opacity:.17;
  }
  body::before{width:46vmax;height:46vmax;top:-15vmax;right:-13vmax;background:var(--green)}
  body::after {width:38vmax;height:38vmax;bottom:-15vmax;left:-13vmax;background:var(--cyan)}

  a{color:inherit}
  .wrap{max-width:920px;margin:0 auto}

  header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h1{font-size:clamp(21px,5vw,28px);font-weight:800;letter-spacing:-.035em}
  .stamp{font-size:12px;color:var(--sub)}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 8px}
  .tabs button{
    font:inherit;font-size:13.5px;font-weight:600;color:var(--sub);
    background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:7px 15px;cursor:pointer;transition:.15s;
  }
  .tabs button:hover{border-color:#bbb;color:var(--ink)}
  .tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

  .period{font-size:13.5px;color:var(--sub);margin-bottom:6px}
  .period b{color:var(--ink);font-weight:700}

  h2{font-size:11.5px;font-weight:700;letter-spacing:.07em;color:var(--sub);
     margin:34px 0 11px;text-transform:uppercase}

  .kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
  .kpi{border:1px solid var(--line);border-radius:14px;padding:15px 17px;background:#fff}
  .kpi .t{font-size:12.5px;color:var(--sub);margin-bottom:4px}
  .kpi .v{font-size:clamp(24px,5.5vw,32px);font-weight:800;letter-spacing:-.035em;line-height:1.12}
  .kpi .u{font-size:14px;font-weight:600;color:var(--sub);margin-left:3px}
  .kpi.hi{box-shadow:0 0 0 1.5px rgba(44,255,5,.55),0 8px 26px -14px rgba(44,255,5,.9)}

  .card{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;margin-bottom:10px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:11px 16px;text-align:left;vertical-align:middle}
  thead th{font-size:11.5px;font-weight:600;color:var(--sub);letter-spacing:.03em;
           border-bottom:1px solid var(--line);white-space:nowrap}
  tbody tr+tr td{border-top:1px solid var(--hair)}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .name{font-weight:600}
  .sub{display:block;font-size:12px;color:var(--sub);font-weight:400;margin-top:1px}

  .bar{height:5px;border-radius:3px;background:#F1F1F1;margin-top:6px;overflow:hidden;max-width:420px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan))}

  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12.5px;border:1px solid var(--line);border-radius:8px;
        padding:5px 10px;background:#FAFAFA;white-space:nowrap}
  .chip b{font-weight:700}
  .chip .w{color:var(--sub);margin-left:3px}
  .chip.off{opacity:.42}

  .live{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
        border-radius:999px;padding:3px 9px;background:#EDFFE8;color:#1C7A00;vertical-align:middle}
  .live.off{background:#F3F3F3;color:#8A8A8A}
  .live i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}

  .empty{padding:24px 18px;color:var(--sub);font-size:13.5px;text-align:center}
  .note{font-size:12.5px;color:var(--sub);line-height:1.65;margin-top:8px}
  .note b{color:var(--ink);font-weight:600}

  footer{margin-top:46px;font-size:12px;color:var(--sub);line-height:1.75}

  @media (max-width:620px){
    th.opt,td.opt{display:none}
    th,td{padding:10px 12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>FVA 유입 현황</h1>
    <span class="stamp" id="stamp"></span>
  </header>

  <div class="tabs" id="tabs">
    <button data-d="1" aria-selected="true">오늘</button>
    <button data-d="7">최근 7일</button>
    <button data-d="28">최근 28일</button>
    <button data-d="90">최근 90일</button>
  </div>
  <div class="period" id="period"></div>

  <div id="body"></div>

  <footer>
    <div>검색에 잡히지 않는 페이지입니다. 주소를 아는 사람만 볼 수 있습니다.</div>
    <div id="foot"></div>
  </footer>
</div>

<script>
/* 서치콘솔 검색어와 GA4 경로는 바깥에서 들어오는 값이다. 그대로 넣으면 안 된다. */
const esc = v => String(v ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => (n ?? 0).toLocaleString('ko-KR');
const won = n => num(Math.round(n ?? 0)) + '원';
const dur = s => { s = Math.round(s||0);
  return s < 60 ? s+'초' : Math.floor(s/60)+'분 '+(s%60)+'초'; };

const FEED = 'https://script.google.com/macros/s/AKfycbxX5u3DZXo45__8_7a3XHPjIbD_utCHYeyK7l2lmuvA3b4dENQS_y4ncVgnSHb5RYA/exec';
let DATA = null, ADS = null, DAYS = 1;
const cur = () => DATA?.ranges?.[String(DAYS)] || null;

const kpi = (t,v,u,hi) => `<div class="kpi${hi?' hi':''}"><div class="t">${t}</div>
  <div class="v">${v}${u?`<span class="u">${u}</span>`:''}</div></div>`;

const tbl = (head,rows,empty) => rows.length
  ? `<div class="card"><table><thead><tr>${head}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`
  : `<div class="card"><div class="empty">${empty}</div></div>`;

const badge = on => on
  ? '<span class="live"><i></i>운영 중</span>'
  : '<span class="live off"><i></i>정지</span>';

function render(){
  const r = cur(), el = document.getElementById('body');
  document.getElementById('stamp').textContent = DATA?.updated ? DATA.updated + ' 기준' : '';
  document.getElementById('period').innerHTML = r?.label
    ? `<b>${esc(r.label)}</b>` + (r.from && r.to && r.from !== r.to ? ` &nbsp;${esc(r.from)} ~ ${esc(r.to)}` : '')
    : '';
  if(!r){ el.innerHTML = `<div class="card"><div class="empty">데이터를 불러오지 못했습니다.</div></div>`; return; }

  let h = '';

  h += `<h2>한눈에</h2><div class="kpis">
    ${kpi('방문자', num(r.users), '명')}
    ${kpi('페이지 조회', num(r.views), '회')}
    ${kpi('머문 시간', dur(r.avgEngagement))}
    ${kpi('온라인 강의 클릭', num(r.onlineClicks), '회', r.onlineClicks>0)}
    ${kpi('상담 클릭', num(r.kakaoClicks), '회', r.kakaoClicks>0)}
  </div>`;

  if (ADS) h += ads(r);

  h += `<h2>어디서 들어왔나</h2>` + tbl(
    `<th>유입 경로</th><th class="n">방문자</th>`,
    (r.sources||[]).map(s => `<tr>
      <td><span class="name">${esc(s.name)}</span><div class="bar"><i style="width:${s.share}%"></i></div></td>
      <td class="n">${num(s.users)}명<span class="sub">${s.share}%</span></td></tr>`),
    '아직 유입 경로가 잡히지 않았습니다.');
  if ((r.sources||[]).some(s => /알 수 없음|경로 불명|not available|not set/i.test(s.name)))
    h += `<div class="note">※ <b>경로 불명</b>은 구글이 아직 출처를 확정하지 못한 방문입니다.
          당일 데이터에서 특히 많이 잡히고, 하루이틀 지나면 대부분 제자리를 찾습니다.</div>`;

  h += `<h2>어떤 페이지를 봤나</h2>` + tbl(
    `<th>페이지</th><th class="n">조회</th><th class="n opt">머문 시간</th>`,
    (r.pages||[]).map(p => `<tr>
      <td><span class="name">${esc(p.name)}</span><span class="sub">${esc(p.path)}</span></td>
      <td class="n">${num(p.views)}<span class="sub">${dur(p.avgEngagement)}</span></td>
      <td class="n opt">${dur(p.avgEngagement)}</td></tr>`),
    '아직 조회된 페이지가 없습니다.');

  if (r.who) h += who(r.who);

  h += `<h2>어떤 버튼을 눌렀나</h2>` + tbl(
    `<th>버튼</th><th class="n">클릭</th>`,
    (r.events||[]).map(e => `<tr>
      <td><span class="name">${esc(e.label)}</span><span class="sub">주로 ${esc(e.topPage)}</span></td>
      <td class="n">${num(e.count)}회</td></tr>`),
    '아직 클릭이 없습니다.');

  h += `<h2>자연 검색 유입 (구글 서치콘솔)</h2>` + tbl(
    `<th>검색어</th><th class="n">클릭</th><th class="n opt">노출</th>`,
    (r.queries||[]).map(q => `<tr>
      <td><span class="name">${esc(q.query)}</span></td>
      <td class="n">${num(q.clicks)}<span class="sub">노출 ${num(q.impressions)}</span></td>
      <td class="n opt">${num(q.impressions)}</td></tr>`),
    '서치콘솔은 등록 직후 며칠간 비어 있습니다.');

  el.innerHTML = h;
}

/* ── 광고 ─────────────────────────────────────────── */
function ads(r){
  const n = ADS.naver;
  let h = `<h2>광고 집행 현황</h2><div class="kpis">
    ${kpi('네이버 집행액', won(n.cost), '', n.cost>0)}
    ${kpi('네이버 클릭', num(n.clk), '회')}
    ${kpi('네이버 노출', num(n.imp), '회')}
    ${kpi('남은 예산', won(n.balance))}
  </div>
  <div class="note">
    네이버 <b>${esc(n.start)}</b>부터 · 하루 최대 <b>${won(n.dailyBudget)}</b> · ${badge(n.live)}<br>
    구글 <b>${esc(ADS.google.start)}</b>부터 ·
    <a href="${esc(ADS.google.console)}" target="_blank" rel="noopener">구글애즈에서 집행액 확인</a>
  </div>`;

  h += `<h2>네이버 — 등록한 키워드</h2>`;
  h += (n.groups||[]).map(g => {
    const perf = g.keywords.filter(k => k.imp || k.clk);
    return `<div class="card">
      <table><thead><tr>
        <th>${esc(g.name)} ${badge(g.live)}</th>
        <th class="n">노출</th><th class="n">클릭</th><th class="n opt">평균순위</th>
      </tr></thead><tbody>
        <tr><td colspan="4">
          <div class="chips">${g.keywords.map(k =>
            `<span class="chip${k.live?'':' off'}"><b>${esc(k.word)}</b><span class="w">${num(k.bid)}원</span></span>`).join('')}</div>
          <span class="sub">클릭당 최대 ${num(g.bid)}원 · 도착 ${esc((g.landing||'').replace(/^https?:\/\/[^/]+/,'').split('?')[0] || '/')}</span>
        </td></tr>
        ${perf.length ? perf.map(k => `<tr>
          <td><span class="name">${esc(k.word)}</span></td>
          <td class="n">${num(k.imp)}</td><td class="n">${num(k.clk)}</td>
          <td class="n opt">${k.rank ?? '-'}</td></tr>`).join('')
        : `<tr><td colspan="4" class="empty" style="padding:14px">아직 노출 실적이 없습니다. 네이버 집계는 15분 단위입니다.</td></tr>`}
      </tbody></table></div>`;
  }).join('');

  const gk = r?.ads?.google || [];
  h += `<h2>구글 — 실제로 들어온 검색어</h2>` + tbl(
    `<th>검색어</th><th class="n">방문자</th>`,
    gk.map(k => `<tr><td><span class="name">${esc(k.keyword)}</span></td>
      <td class="n">${num(k.users)}명</td></tr>`),
    '아직 광고 유입이 없거나, 구글애즈–GA4 데이터가 도착하지 않았습니다.');

  const nk = r?.ads?.naver || [];
  if (nk.length) h += `<h2>네이버 — 실제로 들어온 검색어</h2>` + tbl(
    `<th>검색어</th><th class="n">방문자</th>`,
    nk.map(k => `<tr><td><span class="name">${esc(k.keyword)}</span></td>
      <td class="n">${num(k.users)}명</td></tr>`), '');

  return h;
}

/* ── 누가 보고 있나 ───────────────────────────────── */
function who(w){
  const box = (title, rows) => !rows?.length ? '' : `<div class="card"><table>
    <thead><tr><th>${title}</th><th class="n">방문자</th></tr></thead><tbody>
    ${rows.map(x => `<tr>
      <td><span class="name">${esc(x.name)}</span><div class="bar"><i style="width:${x.share}%"></i></div></td>
      <td class="n">${num(x.users)}명<span class="sub">${x.share}%</span></td></tr>`).join('')}
    </tbody></table></div>`;

  if (!['gender','age','country','city'].some(k => (w[k]||[]).length)) return '';
  const blind = [...(w.gender||[]), ...(w.age||[])].every(x => x.name === '알 수 없음');

  return `<h2>누가 보고 있나</h2>`
    + box('성별', w.gender) + box('연령대', w.age)
    + box('국가', w.country) + box('도시', w.city)
    + (blind ? `<div class="note">※ 성별·연령이 「알 수 없음」뿐이면 GA4에서
        <b>관리 → 데이터 수집 및 수정 → Google 신호 데이터</b>를 켜야 합니다.
        켠 뒤 며칠부터 값이 들어옵니다.</div>` : '');
}

function load(){
  return Promise.all([
    fetch(FEED + '?t=' + Date.now()).then(r => r.json()).catch(() => null),
    fetch('data/ads-9c4e17.json?t=' + Date.now()).then(r => r.json()).catch(() => null),
  ]).then(([feed, adsData]) => {
    if (feed) DATA = feed;
    if (adsData) ADS = adsData;
    document.getElementById('foot').textContent =
      (ADS?.updated ? '광고 수치 ' + ADS.updated + ' 기준 · ' : '') +
      '3분마다 자동 갱신';
    render();
  });
}
load();

/* GA4 는 열 때마다 새로 묻고, 광고 수치는 맥에서 15분마다 갱신된다.
   화면을 켜둔 채로 두는 일이 많아 3분마다 스스로 다시 읽는다.
   탭이 뒤에 있을 때는 쉬고, 돌아오면 바로 한 번 읽는다. */
setInterval(() => { if (!document.hidden) load(); }, 180000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  DAYS = +b.dataset.d;
  [...e.currentTarget.children].forEach(x => x.setAttribute('aria-selected', x === b));
  render();
});
</script>
</body>
</html>
