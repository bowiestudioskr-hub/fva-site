<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>FVA 유입 현황</title>
<link rel="icon" href="/favicon.ico">
<style>
  /* 한 화면에 다 들어오는 게 목표다. 스크롤이 길면 아무도 안 본다.
     흰 종이에 검정 글씨, 색은 브랜드 초록만 뒤에 흐리게. */
  :root{
    --ink:#000; --sub:#70707A; --line:#E8E8EA; --hair:#F4F4F5; --bg:#fff;
    --green:#2CFF05; --cyan:#08FFD0;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:Pretendard,"Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg); color:var(--ink);
    font-size:14px; line-height:1.5; letter-spacing:-.01em;
    padding:14px 16px 40px; position:relative; overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body::before,body::after{
    content:"";position:fixed;border-radius:50%;z-index:-1;pointer-events:none;
    filter:blur(90px);opacity:.15;
  }
  body::before{width:40vmax;height:40vmax;top:-14vmax;right:-12vmax;background:var(--green)}
  body::after {width:32vmax;height:32vmax;bottom:-13vmax;left:-11vmax;background:var(--cyan)}
  a{color:inherit}
  .wrap{max-width:1400px;margin:0 auto}

  /* ── 머리 ── */
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  h1{font-size:17px;font-weight:800;letter-spacing:-.035em;white-space:nowrap}
  .period{font-size:12px;color:var(--sub)}
  .period b{color:var(--ink);font-weight:700}
  .tabs{display:flex;gap:4px;margin-left:auto}
  .tabs button{
    font:inherit;font-size:12px;font-weight:600;color:var(--sub);
    background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:4px 11px;cursor:pointer;transition:.12s;
  }
  .tabs button:hover{border-color:#bbb;color:var(--ink)}
  .tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

  /* ── 큰 숫자 한 줄 ── */
  .kpis{display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));margin-bottom:10px}
  .kpi{border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:#fff}
  .kpi .t{font-size:12px;color:var(--sub);margin-bottom:1px;white-space:nowrap;
          overflow:hidden;text-overflow:ellipsis}
  .kpi .v{font-size:22px;font-weight:800;letter-spacing:-.04em;line-height:1.15}
  .kpi .u{font-size:12px;font-weight:600;color:var(--sub);margin-left:2px}
  .kpi.hi{box-shadow:0 0 0 1.4px rgba(44,255,5,.6),0 6px 18px -12px rgba(44,255,5,.9)}

  /* ── 카테고리 ── 판이 그냥 나열되면 어디까지가 한 덩어리인지 안 보인다.
     묶음마다 제목 줄을 세우고, 그 아래 판들만 격자로 흐르게 한다. */
  .cat{margin-bottom:26px}
  .cat > .ct{
    font-size:20px;font-weight:800;letter-spacing:-.035em;
    color:var(--ink);margin:0 0 10px;line-height:1.2;
  }
  .grid{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));align-items:start}
  .panel{border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden;
         display:flex;flex-direction:column}
  .panel.wide{grid-column:span 2}
  @media (max-width:700px){ .panel.wide{grid-column:span 1} }
  /* 판 제목. 대문자 변환·자간 확장 같은 장식을 걷어내고 굵기만으로 구분한다. */
  .ph{display:flex;align-items:baseline;gap:8px;padding:10px 12px 8px}
  .ph h2{font-size:14px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
  .ph .more{margin-left:auto;font-size:12px;color:var(--sub)}
  .pb{overflow:auto;max-height:232px}
  .pb::-webkit-scrollbar{width:5px;height:5px}
  .pb::-webkit-scrollbar-thumb{background:#DDD;border-radius:3px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  td{padding:4px 12px;vertical-align:middle}
  td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--sub)}
  td.n b{color:var(--ink);font-weight:800}
  .nm{font-weight:400;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .sm{font-size:12px;color:var(--sub);font-weight:400}
  .bar{height:3px;border-radius:2px;background:#F0F0F1;margin-top:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan))}

  .chips{display:flex;flex-wrap:wrap;gap:4px;padding:8px 11px}
  .chip{font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;
        background:#FAFAFA;white-space:nowrap}
  .chip b{font-weight:700}
  .chip .w{color:var(--sub);margin-left:2px}
  .chip.off{opacity:.4}

  .live{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;
        border-radius:999px;padding:1px 7px;background:#EDFFE8;color:#1C7A00}
  .live.off{background:#F3F3F4;color:#8A8A90}
  .live i{width:5px;height:5px;border-radius:50%;background:currentColor;display:block}

  .empty{padding:16px 12px;color:var(--sub);font-size:12.5px;text-align:center}
  .note{padding:8px 12px 10px;font-size:12px;color:var(--sub);line-height:1.5}
  .note b{color:var(--ink);font-weight:600}
  footer{margin-top:14px;font-size:11px;color:var(--sub);display:flex;gap:10px;flex-wrap:wrap}

  @media (max-width:520px){
    body{padding:12px 12px 32px}
    /* 모바일은 한 줄로 쌓이니 묶음 사이를 벌리고 제목을 키워야 구분이 된다 */
    .cat{margin-bottom:30px}
    .cat > .ct{font-size:19px;margin-bottom:11px}
    .kpis{grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
    .kpi .v{font-size:20px}
    .pb{max-height:200px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>FVA 유입 현황</h1>
    <span class="period" id="period"></span>
    <div class="tabs" id="tabs">
      <button data-d="1" aria-selected="true">오늘</button>
      <button data-d="7">7일</button>
      <button data-d="28">28일</button>
      <button data-d="90">90일</button>
    </div>
  </div>

  <div id="kpis" class="kpis"></div>
  <div id="cats"></div>

  <footer>
    <span id="stamp"></span><span id="foot"></span>
    <span>검색에 안 잡히는 페이지입니다</span>
  </footer>
</div>

<script>
/* 서치콘솔 검색어와 GA4 경로는 바깥에서 들어오는 값이다. 그대로 넣으면 안 된다. */
const esc = v => String(v ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => (n ?? 0).toLocaleString('ko-KR');
const won = n => num(Math.round(n ?? 0)) + '원';
const dur = s => { s = Math.round(s||0);
  return s < 60 ? s+'초' : Math.floor(s/60)+'분'+(s%60?' '+(s%60)+'초':''); };

const FEED = 'https://script.google.com/macros/s/AKfycbxX5u3DZXo45__8_7a3XHPjIbD_utCHYeyK7l2lmuvA3b4dENQS_y4ncVgnSHb5RYA/exec';
let DATA = null, ADS = null, DAYS = 1;
const cur = () => DATA?.ranges?.[String(DAYS)] || null;

const kpi = (t,v,u,hi) => `<div class="kpi${hi?' hi':''}"><div class="t">${t}</div>
  <div class="v">${v}${u?`<span class="u">${u}</span>`:''}</div></div>`;

/* 판 하나. 넘치면 판 안에서만 스크롤한다 — 페이지 전체가 길어지지 않게. */
const panel = (title, rows, empty, {more='', wide=false, note=''} = {}) => `
  <section class="panel${wide?' wide':''}">
    <div class="ph"><h2>${title}</h2>${more?`<span class="more">${more}</span>`:''}</div>
    <div class="pb">${rows.length
      ? `<table><tbody>${rows.join('')}</tbody></table>`
      : `<div class="empty">${empty}</div>`}</div>
    ${note?`<div class="note">${note}</div>`:''}
  </section>`;

const badge = on => on ? '<span class="live"><i></i>운영</span>'
                       : '<span class="live off"><i></i>정지</span>';

function render(){
  const r = cur();
  document.getElementById('stamp').textContent = DATA?.updated ? DATA.updated + ' 기준' : '';
  document.getElementById('period').innerHTML = r?.label ? `<b>${esc(r.label)}</b>` : '';
  const K = document.getElementById('kpis'), G = document.getElementById('cats');
  if(!r){ K.innerHTML=''; G.innerHTML = `<section class="panel"><div class="empty">데이터를 불러오지 못했습니다.</div></section>`; return; }

  K.innerHTML =
    kpi('방문자', num(r.users), '명') +
    kpi('조회', num(r.views), '회') +
    kpi('머문 시간', dur(r.avgEngagement)) +
    kpi('온라인 강의', num(r.onlineClicks), '회', r.onlineClicks>0) +
    kpi('상담 클릭', num(r.kakaoClicks), '회', r.kakaoClicks>0) +
    (ADS ? kpi('네이버 집행', won(ADS.naver.cost), '', ADS.naver.cost>0) +
           kpi('남은 예산', won(ADS.naver.balance)) : '');

  const CATS = [
    {name:'방문', items:[]}, {name:'광고', items:[]},
    {name:'검색어', items:[]}, {name:'누가 보고 있나', items:[]},
  ];
  const P = CATS[0].items;

  /* 유입 경로 */
  P.push(panel('어디서 들어왔나',
    (r.sources||[]).slice(0,8).map(s => `<tr>
      <td><span class="nm">${esc(s.name)}</span><div class="bar"><i style="width:${s.share}%"></i></div></td>
      <td class="n"><b>${num(s.users)}</b>명<span class="sm"> ${s.share}%</span></td></tr>`),
    '아직 유입이 잡히지 않았습니다.',
    { note: (r.sources||[]).some(s=>/알 수 없음|경로 불명|not available|not set/i.test(s.name))
        ? '「경로 불명」은 구글이 아직 출처를 확정 못 한 방문입니다. 하루이틀이면 대부분 제자리를 찾습니다.' : '' }));

  /* 페이지 */
  P.push(panel('어떤 페이지',
    (r.pages||[]).slice(0,8).map(p => `<tr>
      <td><span class="nm">${esc(p.name)}</span><span class="sm">${esc(p.path)}</span></td>
      <td class="n"><b>${num(p.views)}</b><span class="sm"> ${dur(p.avgEngagement)}</span></td></tr>`),
    '아직 조회가 없습니다.'));

  /* 버튼 */
  P.push(panel('어떤 버튼',
    (r.events||[]).map(e => `<tr>
      <td><span class="nm">${esc(e.label)}</span><span class="sm">주로 ${esc(e.topPage)}</span></td>
      <td class="n"><b>${num(e.count)}</b>회</td></tr>`),
    '아직 클릭이 없습니다.'));

  /* 광고 */
  const A = CATS[1].items;
  if (ADS) A.push(adsPanel(r));

  /* 네이버 등록 키워드 — 그룹별로 한 판씩 */
  if (ADS) for (const g of ADS.naver.groups || []) {
    const perf = g.keywords.filter(k => k.imp || k.clk);
    A.push(`<section class="panel">
      <div class="ph"><h2>${esc(g.name)}</h2><span class="more">${badge(g.live)} 입찰 ${num(g.bid)}원</span></div>
      <div class="chips">${g.keywords.map(k =>
        `<span class="chip${k.live?'':' off'}"><b>${esc(k.word)}</b><span class="w">${num(k.bid)}</span></span>`).join('')}</div>
      <div class="pb">${perf.length ? `<table><tbody>${perf.map(k=>`<tr>
        <td><span class="nm">${esc(k.word)}</span></td>
        <td class="n">노출 <b>${num(k.imp)}</b> · 클릭 <b>${num(k.clk)}</b></td></tr>`).join('')}</tbody></table>`
        : `<div class="empty">아직 노출 실적 없음 · 집계는 15분 단위</div>`}</div>
    </section>`);
  }

  /* 광고 검색어 */
  const gk = r.ads?.google || [], nk = r.ads?.naver || [];
  const S = CATS[2].items;
  S.push(panel('구글 — 실제 검색어',
    gk.slice(0,8).map(k => `<tr><td><span class="nm">${esc(k.keyword)}</span></td>
      <td class="n"><b>${num(k.users)}</b>명</td></tr>`),
    '광고 유입이 아직 없거나 데이터가 도착 전입니다.'));
  if (nk.length) S.push(panel('네이버 — 실제 검색어',
    nk.slice(0,8).map(k => `<tr><td><span class="nm">${esc(k.keyword)}</span></td>
      <td class="n"><b>${num(k.users)}</b>명</td></tr>`), ''));

  /* 누가 보고 있나 */
  const w = r.who || {};
  const demo = (t, rows) => rows?.length ? panel(t,
    rows.slice(0,6).map(x => `<tr>
      <td><span class="nm">${esc(x.name)}</span><div class="bar"><i style="width:${x.share}%"></i></div></td>
      <td class="n"><b>${num(x.users)}</b>명<span class="sm"> ${x.share}%</span></td></tr>`), '') : '';
  const blind = [...(w.gender||[]), ...(w.age||[])].every(x => x.name === '알 수 없음');
  const W = CATS[3].items;
  W.push(demo('성별', w.gender)); W.push(demo('연령대', w.age));
  W.push(demo('국가', w.country)); W.push(demo('도시', w.city));
  if (blind && (w.gender||[]).length)
    W.push(`<section class="panel"><div class="ph"><h2>성별·연령이 비어 있다면</h2></div>
      <div class="note" style="border-top:0">GA4 <b>관리 → 데이터 수집 및 수정 → Google 신호 데이터</b>를
      켜야 값이 들어옵니다. 켠 뒤 며칠 걸립니다.</div></section>`);

  /* 자연 검색 */
  S.push(panel('자연 검색 유입 (서치콘솔)',
    (r.queries||[]).slice(0,8).map(q => `<tr><td><span class="nm">${esc(q.query)}</span></td>
      <td class="n">클릭 <b>${num(q.clicks)}</b> · 노출 ${num(q.impressions)}</td></tr>`),
    '서치콘솔은 등록 직후 며칠간 비어 있습니다.'));

  G.innerHTML = CATS.map(c => {
    const body = c.items.filter(Boolean).join('');
    return body ? `<div class="cat"><div class="ct">${c.name}</div>
      <div class="grid">${body}</div></div>` : '';
  }).join('');
}

function adsPanel(r){
  const n = ADS.naver;
  return `<section class="panel">
    <div class="ph"><h2>광고 집행</h2><span class="more">${badge(n.live)}</span></div>
    <div class="pb"><table><tbody>
      <tr><td><span class="nm">네이버</span><span class="sm">${esc(n.start)}부터 · 하루 최대 ${won(n.dailyBudget)}</span></td>
          <td class="n">노출 <b>${num(n.imp)}</b> · 클릭 <b>${num(n.clk)}</b><span class="sm">${won(n.cost)}</span></td></tr>
      <tr><td><span class="nm">구글</span><span class="sm">${esc(ADS.google.start)}부터</span></td>
          <td class="n"><a href="${esc(ADS.google.console)}" target="_blank" rel="noopener">계정에서 확인</a></td></tr>
      <tr><td><span class="nm">남은 예산</span></td><td class="n"><b>${won(n.balance)}</b></td></tr>
    </tbody></table></div>
  </section>`;
}

function load(){
  return Promise.all([
    fetch(FEED + '?t=' + Date.now()).then(r => r.json()).catch(() => null),
    fetch('data/ads-9c4e17.json?t=' + Date.now()).then(r => r.json()).catch(() => null),
  ]).then(([feed, adsData]) => {
    if (feed) DATA = feed;
    if (adsData) ADS = adsData;
    document.getElementById('foot').textContent =
      (ADS?.updated ? '광고 ' + ADS.updated + ' 기준 · ' : '') + '3분마다 자동 갱신';
    render();
  });
}
load();

/* 화면을 켜둔 채 두는 일이 많다. 3분마다 스스로 읽고, 탭이 뒤에 있으면 쉰다. */
setInterval(() => { if (!document.hidden) load(); }, 180000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  DAYS = +b.dataset.d;
  [...e.currentTarget.children].forEach(x => x.setAttribute('aria-selected', x === b));
  render();
});
</script>
</body>
</html>
