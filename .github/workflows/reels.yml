# 「현업 감독의 영상 분석」 릴스를 유튜브 채널에서 매일 새로 받아온다.
# API 키가 필요 없다 — 공개 RSS 를 읽고, 세로 영상만 썸네일로 걸러낸다.
name: 릴스 갱신

on:
  schedule:
    - cron: "17 19 * * *"     # 매일 04:17 KST (UTC 19:17)
  workflow_dispatch:           # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/yt_reels.py
      - name: 바뀐 게 있으면 커밋
        run: |
          if [ -n "$(git status --porcelain assets/data/reels.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data/reels.json
            git commit -m "릴스 목록 자동 갱신"
            git push
          else
            echo "바뀐 것 없음"
          fi
