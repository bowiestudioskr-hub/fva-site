<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<!-- ⚠ 손가락으로 확대한 배율이 남으면 화면이 통째로 어긋난다 — 바가 떴다 안 떴다 했다.
     줌아웃하면 멀쩡해지던 것이 그 증거다. 앱 화면이라 확대를 막는다. -->
<!-- ⚠ height=device-height 가 없으면 홈화면 앱에서 **배치 높이(innerHeight)가 짧게 굳는다**.
     16 Pro 실측: 화면 874 인데 innerHeight 812 — 상태바(62)만큼 모자라 바가 62px 떠 보였다.
     손가락으로 줌아웃하면 멀쩡해지던 것이 그 증거다(줌이 높이를 다시 재게 한다).
     그래도 굳으면 아래 「뷰포트다시」가 메타를 흔들어 다시 재게 한다. -->
<meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>오공일501 예약 현황</title>
<link rel="icon" href="img/icon-192.png?v=5gong1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- ⚠ black 으로 바꿔 봤지만 아무 변화가 없었다(2026-08-27, 진단에 안전영역위 62 그대로).
     iOS 는 이 값을 **설치 시점에 기억**해서 새로고침으로는 안 바뀐다. 되돌린다.
     진짜 원인은 아래 viewport 의 height=device-height 쪽이다. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오공일501">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="img/icon-180.png?v=5gong1">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* ⚠ 이 화면은 **오공일501(공간대여)** 것이다. 피바아카데미와 다른 사업이니
     아카데미 화면·링크·말투를 섞지 말 것. 아카데미 쪽은 fva.co.kr 에 따로 있다.
     ⚠ 검색에 안 뜬다(noindex). robots.txt 에는 적지 말 것 —
     적는 순간 주소를 광고하는 셈이고, 크롤러가 noindex 를 읽지도 못한다.

     디자인 얼개는 손님 화면과 같은 집안이다. 검은 바탕에 큰 숫자,
     선을 긋지 않고 카드의 면으로 구분한다. 색은 뜻을 하나씩만 지고 간다.

     ⚠ 이 화면은 「안내가 실제로 나갔나」를 눈으로 확인하려고 만든 것이다.
       손님 연락처는 서버에서 이미 가려서 온다. 원본이 필요하면 호스트센터에서 본다. */
  :root{
    --bg:#000; --card:#1C1C1E; --card2:#2C2C2E; --card3:#242427;
    --ink:#fff; --sub:#98989F; --dim:#636366; --line:#2C2C2E;

    /* ⚠ 색은 스페이스클라우드 캘린더와 같은 뜻으로 맞춰 뒀다.
       두 화면을 오가며 보는 사람이 색을 다시 배우지 않아도 되게. (검은 바탕용으로 밝기만 올림) */
    --rsv:#A78BFA;     /* 예약확정   — 스클 보라 */
    --hold:#34D399;    /* 승인대기   — 스클 초록 */
    --paywt:#F472B6;   /* 결제대기   — 스클 자주 */
    --add:#38BDF8;     /* 추가한예약 — 스클 파랑 (감독님 수업·청소가 여기 들어온다) */
    --done:#8E8E93;    /* 이용완료   — 스클 회색 */
    --clean:#FBBF24;   /* 청소만 따로 — 스클엔 없지만 자주 보는 것이라 갈라 뒀다 */
    --wait:#FFD60A;
    --warn:#FF375F;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',Pretendard,system-ui,sans-serif;
    font-size:15px; line-height:1.5; padding:calc(22px + env(safe-area-inset-top)) 16px calc(82px + env(safe-area-inset-bottom));
    font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
  .hd .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  h1{font-size:24px;letter-spacing:-.03em;font-weight:800}
  .date{color:var(--dim);font-size:13px}
  .lede{color:var(--sub);font-size:13px;margin-top:5px}
  .lede a{color:inherit}

  /* ── 달력 ───────────────────────────────────────────── */
  .cal{background:var(--card);border-radius:16px;padding:14px 12px 12px;position:relative}
  /* 달을 넘길 때 — 격자를 흐리게 하고 가운데 고리를 돌린다 */
  .cal.loading #grid{opacity:.3;filter:saturate(.6);transition:opacity .2s}
  .cal.loading::after{content:'';position:absolute;left:50%;top:46%;width:26px;height:26px;
    margin:-13px 0 0 -13px;border-radius:50%;border:3px solid rgba(255,255,255,.15);
    border-top-color:#E4574A;animation:calspin .7s linear infinite;z-index:5}
  @keyframes calspin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ .cal.loading::after{animation-duration:1.6s} }
  .calhd{display:flex;align-items:center;gap:10px;padding:0 4px 12px}
  .calhd b{font-size:16px;font-weight:800;letter-spacing:-.02em}
  .calhd .nav{margin-left:auto;display:flex;gap:6px}
  .calhd button{background:var(--card2);color:var(--ink);border:0;border-radius:9px;
                width:32px;height:30px;font-size:15px;cursor:pointer;font-family:inherit}
  .calhd button:active{opacity:.6}
  .calhd .today{width:auto;padding:0 11px;font-size:12.5px;font-weight:700}

  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dow{text-align:center;font-size:11px;font-weight:700;color:var(--dim);padding:2px 0 5px}
  .dow.s{color:#FF6B7E} .dow.t{color:#6BA8FF}
  .go a::before{content:'🔗 ';opacity:.75;font-size:.92em}
  .cell{background:var(--card3);border-radius:9px;min-height:104px;padding:4px 3px 4px;
        display:flex;flex-direction:column;gap:2px;cursor:pointer;border:1.5px solid transparent;
        overflow:hidden}
  .cell.off{background:transparent;cursor:default}
  /* ⚠ 오늘과 「고른 날」이 둘 다 흰 테두리였다. 구분이 안 갔다.
     오늘 = 날짜 숫자에 동그란 표시, 고른 날 = 테두리. 서로 다른 자리에 표시한다. */
  .cell.now .d{background:var(--ink);color:#000;border-radius:99px;
               width:19px;height:19px;line-height:19px;margin:0 auto;font-weight:800}
  .cell.now.sun .d,.cell.now.sat .d{color:#000}
  /* 오늘은 칸 전체도 한눈에 — 호박색 테두리 + 살짝 밝은 바탕 (고른 날의 흰 테두리와 구분) */
  .cell.now{border-color:#B82C21;background:#221214;position:relative;
            box-shadow:0 0 0 1px rgba(184,44,33,.3) inset}
  .cell.now::after{content:'TODAY';position:absolute;top:5px;right:6px;
            font-size:8px;font-weight:800;color:#E4574A;letter-spacing:0;pointer-events:none}
  /* ⚠ 폰에서는 칸이 좁아 모서리 라벨이 날짜 동그라미와 겹친다 — 숫자 아래로 내린다 */
  @media (max-width:560px){
    .hd .row{flex-direction:column;align-items:center;gap:2px}
    .hd .date{position:static;margin-top:2px}
    .brandlogo{height:30px}
    .cell.now::after{position:static;display:block;text-align:center;margin-top:2px;line-height:1} }
  .cell.sel{border-color:#fff;background:#2E2E33}
  .cell .d{font-size:11.5px;font-weight:700;color:var(--sub);text-align:center;line-height:1.25}
  .cell.sun .d,.cell.hol .d{color:#FF6B7E} .cell.sat .d{color:#6BA8FF}
  .cell.hol.sat .d{color:#FF6B7E}
  .hname{font-size:8.5px;font-weight:700;color:#FF6B7E;text-align:center;line-height:1.1;margin-top:1px}

  /* ⚠ 칸 안에 글자를 직접 넣는다. 색 막대만으로는 「누가 몇 시에」가 안 보여서
     결국 하나하나 눌러봐야 했다. 스페이스클라우드 캘린더가 이렇게 보여준다. */
  /* ⚠ 한 줄로 자르면 정작 보고 싶은 이름이 잘려 나간다(「13~15, 정…」).
     두 줄까지 흐르게 두고, 이름을 앞에 세운다. */
  .ev{display:flex;align-items:flex-start;gap:3px;font-size:9.5px;line-height:1.3;
      color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
  /* ⚠ 시간은 줄 끝에서 「13~1 / 5」로 쪼개지면 안 읽힌다. 제 줄에 통째로 둔다. */
  .ev .tm{display:block;white-space:nowrap;color:var(--sub);font-variant-numeric:tabular-nums;
          font-size:9px}
  /* ⚠ 이름·시간은 왼쪽인데 번호만 오른쪽이면 줄기가 둘로 갈려 어수선하다. 같이 왼쪽. */
  .rid{display:block;white-space:nowrap;color:var(--dim);font-size:8.5px;line-height:1.3;
       font-variant-numeric:tabular-nums;letter-spacing:-.04em;
       margin:-1px 0 4px 15px}
  .ev b{flex:none;width:12px;height:12px;border-radius:3px;font-size:8.5px;font-weight:800;
        display:grid;place-items:center;color:#101014;margin-top:.5px}
  .ev.void{color:#5A5A60;text-decoration:line-through}
  .ev.rsv b{background:var(--rsv)} .ev.hold b{background:var(--hold)}
  .ev.paywt b{background:var(--paywt)} .ev.add b{background:var(--add)}
  .ev.done b{background:var(--done)} .ev.clean b{background:var(--clean)}
  .ev.void b{background:#3A3A3E;color:#7A7A80}
  .more{font-size:9px;color:var(--dim);text-align:center}

  .legend{display:flex;flex-wrap:wrap;gap:5px 12px;padding:11px 5px 2px;font-size:11.5px;color:var(--sub)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2.5px;margin-right:5px;vertical-align:-1px}

  .day{background:var(--card2);border-radius:12px;margin-top:10px;padding:12px 13px;display:none}
  .day.on{display:block}
  .day h4{font-size:13.5px;font-weight:800;margin-bottom:8px}
  .day ol{list-style:none;display:flex;flex-direction:column;gap:7px}
  .day li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px}
  .day .who2{flex:1;min-width:0}
  .day .who2 b{font-weight:700}
  .day .t{color:var(--sub);font-size:12.5px;min-width:74px;white-space:nowrap}
  .day .k{font-weight:700}
  .day .none{color:var(--dim);font-size:13px}

  /* ── 타일·목록 ───────────────────────────────────────── */
  .stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .stat{background:var(--card);border-radius:16px;padding:14px 16px 15px}
  .stat .lb{font-size:12px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:5px}
  .stat .lb i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .stat .vl{font-size:29px;font-weight:800;letter-spacing:-.045em;line-height:1.05}
  .stat .vl span{font-size:14px;font-weight:600;color:var(--sub);margin-left:3px}

  .card{background:var(--card);border-radius:16px;overflow:hidden}
  .card>h3{font-size:14px;font-weight:700;padding:15px 16px 11px;display:flex;align-items:center;gap:8px}
  .card>h3 .r{margin-left:auto;font-weight:600;color:var(--dim);font-size:12px}
  ul{list-style:none}
  li.row{display:flex;align-items:center;gap:12px;padding:11px 16px}
  li.row+li.row{box-shadow:inset 0 .5px 0 rgba(255,255,255,.07)}
  .nm{flex:1;min-width:0}
  .nm b{font-size:15px;font-weight:700}
  .nm small{display:block;font-size:12px;color:var(--dim);margin-top:2px}
  /* 예약번호는 손님이 불러주는 값이라 눈에 걸려야 한다. 이름·전화와 같은 무게로. */
  b.rno{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
  /* 전화번호는 누르는 것이다. 누를 수 있게 보여야 하고, 손가락이 닿을 만해야 한다. */
  .telrow{display:block;margin-top:4px}   /* ⚠ inline 이면 앞 글자에 붙어 「30,000원번호 없음」이 된다 */
  a.tel{display:inline-block;color:var(--ink);font-size:13.5px;font-weight:700;
        text-decoration:none;background:var(--card2);border-radius:8px;
        padding:5px 10px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
  a.tel::before{content:'📞 ';font-size:11px}
  a.tel:active{opacity:.6}
  .notel{color:var(--dim);font-size:12px}
  .vn{text-align:right;white-space:nowrap;font-size:14px;font-weight:700}
  .vn em{display:block;font-style:normal;font-size:11.5px;font-weight:600;color:var(--sub);margin-top:2px}

  .pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap}
  .dday{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap;
        background:#2B2B30;color:var(--sub);border:1px solid #3A3A40}
  .dday.hot{background:#B82C21;color:#fff;border-color:#B82C21}
  .whenrow{display:block;margin-top:2px}
  .whenrow .wdate{color:#fff;font-size:14.5px;font-weight:800;letter-spacing:0}
  .whenrow .wtime{color:var(--sub);font-size:13px}
  .pill.ok{background:#0C3B1E;color:var(--rsv)}
  .pill.wait{background:#3A3210;color:var(--wait)}
  .pill.done{background:var(--card2);color:var(--done)}

  .hd{text-align:center}
  .hd .row{justify-content:center;position:relative;flex-direction:column;align-items:center;gap:3px}
  .hd .date{position:static}
  /* 넓은 화면에서만 날짜를 오른쪽 구석으로 — 폰에서는 제목 아래 제 줄 */
  @media (min-width:561px){
    .hd .row{flex-direction:row;align-items:flex-end}
    .hd .date{position:absolute;right:0;bottom:2px} }
  h1.brand{display:flex;align-items:center;justify-content:center;gap:12px}
  .brandlogo{height:38px;width:auto;display:block}
  .mkbtn{display:inline-block;margin:9px 0 9px;padding:11px 18px;border-radius:10px;
         background:#B82C21;color:#fff;font-weight:800;font-size:13.5px;text-decoration:none}
  .mkbtn:hover{filter:brightness(1.06)}
  .master .mk{display:block;margin-top:1px}
  .master .mk2{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;
    align-items:baseline;margin:2px 0 4px}
  .master .mk2 em{font-style:normal;color:var(--dim);font-size:12.5px}
  .master .mk2 b{color:#E4574A;font-size:17px;letter-spacing:0;font-variant-numeric:tabular-nums}
  .master .warn2{display:block;margin-top:3px}
  .master{margin:0 16px 12px;padding:16px;border-radius:12px;
          background:#221214;border:1.5px solid #B82C21;
          font-size:12.5px;color:var(--sub);line-height:1.6}
  .master>b:first-child{display:block;font-size:15px;color:#E4574A;margin-bottom:3px}
  .master>b{color:var(--ink);font-size:13.5px}
  .master .mk{display:block;margin-top:6px;font-size:15px;color:var(--ink);
              font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .master .mk b{font-weight:800}
  .master .warn2{display:block;margin-top:5px;font-size:11.5px;color:var(--warn)}

  .memo{font-size:12px;color:var(--dim);padding:0 16px 14px;line-height:1.5}
  .memo b{color:var(--sub)}
  .none{color:var(--dim);font-size:13.5px;padding:16px}

  /* 손님 화면 관리 */
  .kv{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
  .kv+.kv{box-shadow:inset 0 .5px 0 rgba(255,255,255,.07)}
  .kv label{font-size:13px;color:var(--sub);font-weight:700;min-width:104px}
  .kv input,.kv textarea{flex:1;min-width:150px;background:#0F0F11;color:var(--ink);
            border:1px solid var(--line);border-radius:9px;padding:9px 11px;
            font:inherit;font-size:14px;line-height:1.55}
  .kv textarea{resize:vertical;min-height:66px}
  /* 여러 줄 칸은 이름을 위로 올린다. 옆에 두면 칸이 좁아진다. */
  .kv.tall{align-items:flex-start}
  .kv.tall label{min-width:100%;margin-bottom:-4px}
  .kv.tall button{align-self:flex-start;margin-top:2px}
  .kv button{background:var(--card2);color:var(--ink);border:0;border-radius:9px;
             padding:9px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .kv button:active{opacity:.6}
  .kv .said{font-size:12px;color:var(--rsv)}
  .go{display:flex;gap:8px;padding:13px 16px 4px;flex-wrap:wrap}
  .go a{flex:1;min-width:140px;text-align:center;text-decoration:none;
        background:var(--card2);color:var(--ink);border-radius:11px;padding:12px;
        font-size:13.5px;font-weight:700}
  .go a.hi{background:#fff;color:#000}
  details{padding:0}
  summary{font-size:13px;color:var(--sub);cursor:pointer;padding:12px 16px;list-style:none;
          display:flex;align-items:center;gap:8px}
  summary::-webkit-details-marker{display:none}
  summary::after{content:'＋';margin-left:auto;color:var(--dim)}
  details[open] summary::after{content:'－'}
  summary.sum{font-size:14px;font-weight:700;color:var(--ink);padding:15px 16px 11px}
  details>.kv:first-of-type{padding-top:2px}
  details pre{white-space:pre-wrap;word-break:keep-all;font:inherit;font-size:12.5px;
              line-height:1.7;color:var(--sub);background:#141416;border-radius:11px;
              padding:13px;margin-top:10px}

  /* ⚠ 토큰이 죽으면 자동 안내가 통째로 멈춘다. 그래서 남은 날을 늘 맨 위에 띄운다.
     예전엔 7일 전에야 알려줬는데, 그러면 「그날이 언제였지」를 기억해야 한다. */
  .tok{display:flex;align-items:center;gap:9px;background:var(--card);border-radius:14px;
       padding:11px 15px;font-size:13px;color:var(--sub);line-height:1.5}
  .tok i{font-style:normal;font-size:15px;flex:none}
  .tok b{color:var(--ink)}
  .tok.warn{border-left:3px solid var(--warn)}
  .tok.warn b{color:var(--warn)}

  .warnbox{background:var(--card);border-radius:14px;border-left:3px solid var(--warn);
           padding:13px 16px;font-size:13px;color:var(--sub);line-height:1.55}
  .warnbox b{color:var(--ink)}
  footer{color:var(--dim);font-size:12px;padding-top:6px;line-height:1.7}

  /* ── 하단 바 ─────────────────────────────────────
     ⚠ body 아래 여백(padding-bottom)을 바 높이만큼 줘야 마지막 줄이 가려지지 않는다. */
  /* ⚠ 브라우저 아래쪽 UI(주소창·뒤로가기)가 이 바를 덮는다. iOS 는 주소창이 아래에
     있을 때 「문서가 깔리는 높이」가 「실제로 보이는 높이」보다 커서 bottom:0 이
     화면 밖으로 내려간다. 그 차이를 맨 아래 스크립트가 재서 --lift 로 넣어준다.
     ⚠ CSS 로는 알 수 없는 값이다. env(safe-area-inset-bottom) 은 이 경우 0 이다. */
  /* ⚠ 예전에는 브라우저 UI 높이를 재서 바를 들어올렸다(--lift). 그게 바를 떠 보이게 한
       장본인이다. 검증된 다른 앱들처럼 그냥 화면 바닥에 붙박는다. */
  /* ⚠ 바 색이 배경(#0B0B0C)과 거의 같으면 **바가 안 보이고 아이콘만 검은 허공에 떠 보인다.**
       진단으로 재 보니 위치는 정확한데(아래틈 0) 그렇게 읽히고 있었다.
       배경보다 한 단 밝게 하고 윗선을 또렷이 그어 「바」로 보이게 한다. */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
       background:#17171A;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
       border-top:1px solid rgba(255,255,255,.13);
       /* ⚠ 안전영역(홈 인디케이터 34px)을 그대로 다 주면 글자가 너무 떠 보인다.
            아이폰 기본 탭바도 그 자리를 다 비우지는 않는다. 절반쯤만 남긴다. */
       /* ⚠ 안전영역(홈 인디케이터 자리)을 **남기지 않는다.** 사용자 지시다.
            env(safe-area-inset-bottom) 을 쓰면 기종마다 34px 씩 떠서 「밑에 많이 남는다」가 된다.
            바닥까지 내리고, 글자 숨통만 버튼 여백으로 준다. */
       padding-bottom:0}
  /* 키보드가 올라오면 감춘다. 안 그러면 입력칸 위에 올라타 앉는다. */
  body.kb .bar{display:none}
  /* ⚠ 키보드가 화면 절반을 먹는다. 머리글(로고·날짜·설명)을 접어 그만큼을 대화에 준다 —
       무엇을 치고 있는지 보이지 않으면 대화가 아니다. */
  body.appmode.kb .hd{display:none}
  body.appmode.kb .wrap{gap:0}
  .bar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
         padding:9px 3px 6px;border:0;border-bottom:2px solid transparent;background:none;
         cursor:pointer;color:var(--dim);
         font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:-.02em}
  .bar button.on{color:var(--ink);border-bottom-color:transparent}
  .bar button:focus{outline:none}
  .bar button:focus-visible{outline:2px solid var(--ink);outline-offset:-4px;border-radius:8px}
  .bar button.on i{filter:none}
  .bar i{font-style:normal;font-size:18px;line-height:1;filter:grayscale(1) opacity(.55)}
  .bar button:active{background:rgba(255,255,255,.06)}

  /* ── 예약 비서(채팅) ──────────────────────────────
     ⚠ 폰에서 쓰는 화면이다. 입력칸은 아래 바에 가리지 않게 여백을 둔다.
     ⚠ iOS 는 글꼴이 16px 보다 작으면 입력할 때 화면을 확대한다. 16px 아래로 내리지 말 것. */
  .chatcard{display:flex;flex-direction:column;padding:0;flex:1;min-height:0}
  /* 머리 — 늘 같은 자리에 붙어 있다 */
  .chatcard .chathd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
    padding:13px 16px 11px;border-bottom:1px solid rgba(255,255,255,.09)}
  .chatcard .chathd b{font-size:15px;font-weight:800;letter-spacing:-.02em}
  .chatcard .chathd .tip{font-size:12.5px;color:#8A8A8A;letter-spacing:-.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .chatcard .chathd .r{font-size:12px;color:#6E6E6E;margin-left:auto}
  .chatlog{display:flex;flex-direction:column;gap:9px;padding:14px 14px 12px;
    flex:1;min-height:120px;max-height:none;
    overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .chatlog .cme,.chatlog .cbot{max-width:86%;padding:10px 13px;border-radius:14px;
    font-size:15px;line-height:1.62;white-space:pre-wrap;word-break:break-word}
  .chatlog .cme{align-self:flex-end;background:var(--brand,#E7352B);color:#fff;border-bottom-right-radius:5px}
  .chatlog .cbot{align-self:flex-start;background:rgba(255,255,255,.07);color:var(--tx,#EDEDED);border-bottom-left-radius:5px}
  .chatlog .cerr{align-self:flex-start;background:rgba(224,27,0,.16);color:#FFC9C2;
    padding:10px 13px;border-radius:14px;font-size:14px}
  .chatlog img.cshot{max-width:190px;border-radius:11px;display:block}
  /* 확인 카드 — 여기서 손이 한 번 멈춘다. 그래서 무슨 일이 일어나는지 다 적는다. */
  .cask{align-self:stretch;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);
    border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:10px}
  .cask b{font-size:14.5px;line-height:1.55;font-weight:700;color:#fff}
  .cask .btns{display:flex;gap:8px}
  .cask button{flex:1;min-height:42px;border:0;border-radius:11px;font-size:15px;font-weight:700;
    font-family:inherit;cursor:pointer}
  .cask .yes{background:#2CFF05;color:#06150A}
  .cask .no{background:rgba(255,255,255,.10);color:var(--tx,#EDEDED)}
  .cask.done .btns{display:none}
  /* 날짜 구분선 — 카톡처럼 하루가 바뀌는 자리에만 */
  .chatlog .cday{align-self:center;font-size:12px;color:#7A7A7A;background:rgba(255,255,255,.06);
    padding:3px 11px;border-radius:999px;margin:4px 0}
  /* ⚠ 이름표는 「보낸 쪽」에 붙어야 한다. 내 말풍선은 오른쪽이니 이름표도 오른쪽이다.
       왼쪽에 두면 비서가 한 말처럼 읽힌다. */
  .chatlog .cwho{align-self:flex-end;font-size:11.5px;color:#7EB6FF;
    margin:3px 3px -5px 0;font-weight:700}
  .chatpics{display:flex;gap:7px;flex-wrap:wrap;padding:0 14px 10px}
  .chatpics span{position:relative}
  .chatpics img{height:56px;border-radius:9px;display:block}
  .chatpics b{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
    background:#000;color:#fff;font-size:13px;line-height:20px;text-align:center;cursor:pointer}
  .chatbar{display:flex;gap:8px;align-items:flex-end;padding:11px 12px;
    border-top:1px solid rgba(255,255,255,.09)}
  .chatbar textarea{flex:1;min-height:44px;max-height:132px;resize:none;padding:11px 13px;
    border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);
    color:var(--tx,#EDEDED);font-family:inherit;font-size:16px;line-height:1.5}
  .chatbar textarea:focus{outline:none;border-color:rgba(255,255,255,.32)}
  .chatbar button{min-height:44px;padding:0 15px;border:0;border-radius:12px;font-family:inherit;
    font-size:15px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.10);color:var(--tx,#EDEDED)}
  .chatbar #chatsend{background:#2CFF05;color:#06150A}
  .chatbar button:disabled{opacity:.45}

  /* ⚠ [hidden] 은 display 를 주는 규칙에 진다. 이 집에서 두 번 당했다. 못 이기게 못 박는다. */
  /* ⚠ 탭마다 내용 길이가 달라서 바닥 여백이 96~788px 까지 벌어졌다.
       그러면 폰에서는 어떤 탭은 스크롤이 생기고 어떤 탭은 안 생겨,
       사파리 하단 UI 가 접혔다 펴졌다 하면서 **하단 바가 탭마다 다른 자리에 앉는다.**
       모든 탭이 같은 높이를 차지하게 못 박아 그 차이를 없앤다. */
  .tabpane{display:flex;flex-direction:column;gap:20px}
  .tabpane[hidden]{display:none !important}

  /* ── 화면 하나로 고정한다(모든 탭) ─────────────────────
     ⚠ 페이지가 통째로 스크롤되면 두 가지가 나빠진다.
       ① 채팅은 글을 쓰려고 매번 맨 아래까지 내려가야 한다.
       ② 폰에서는 탭마다 스크롤 여부가 달라 사파리 하단 UI 가 접혔다 펴지고,
          그때마다 **하단 바가 다른 자리에 앉는다.**
     그래서 문서는 아예 안 움직이게 잠그고, 가운데 내용만 안에서 움직인다. */
  /* ⚠ 높이는 100dvh 가 아니라 **실제로 보이는 높이**를 쓴다.
       100dvh 는 키보드가 올라와도 줄지 않아서, 문서를 잠근 상태에서는
       입력칸이 키보드 뒤에 깔려 글을 못 쓴다. 맨 아래 스크립트가 재서 --appvh 로 넣는다. */
  /* ⚠ 아이폰 홈화면 앱은 입력칸에 손을 대면 **웹뷰를 통째로 위로 밀어 올린다.**
       그리고 키보드를 닫아도 제자리로 안 돌아온다(머리가 잘리고 아래가 빈다).
       문서 스크롤을 막는 것만으로는 안 되고, 몸을 화면에 **못 박아야(position:fixed)** 밀리지 않는다. */
  html.appmode{height:100%;overflow:hidden}
  /* ⚠ 높이를 「재서」 쓰면 앱을 들락날락할 때마다 값이 달라져 바가 떴다 안 떴다 한다.
       그래서 재지 않는다. 몸을 화면 네 귀에 붙박고, 바도 바닥에 직접 붙박는다.
       기기가 무슨 높이를 알려주든 상관없어진다. */
  body.appmode{position:fixed;top:0;left:0;right:0;bottom:0;height:auto;
    overflow:hidden;overscroll-behavior:none;display:flex;flex-direction:column;
    padding-left:0;padding-right:0;padding-bottom:0}
  /* ⚠ 키보드가 올라올 때만 화면에 못 박는다.
       아이폰 홈화면 앱이 웹뷰를 통째로 밀어 올리는 것을 이때만 막으면 된다.
       바닥을 놓고 「보이는 높이」만큼만 차지해 입력칸이 키보드 위에 남는다. */
  body.appmode.kb{position:fixed;top:0;left:0;right:0;bottom:auto;height:var(--appvh,100dvh)}
  body.appmode .wrap{flex:1;min-height:0;padding-left:16px;padding-right:16px}
  /* ⚠ 바를 띄워 두지(fixed) 않는다. 문서가 안 움직이니 그냥 마지막 칸으로 두면
       **언제나 화면 맨 아래**에 정확히 붙는다. 브라우저 UI 높이를 재서 들어올리던
       --lift 도 더는 필요 없다(그게 바를 애매하게 띄우던 원인이다). */
  body.appmode .bar{position:fixed;left:0;right:0;bottom:0;transform:none;flex:none}
  body.appmode .wrap{padding-bottom:var(--barh,64px)}
  body.appmode .hd{flex:none}
  body.appmode .tabpane{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding-bottom:0;overscroll-behavior:contain}
  /* ⚠ 탭은 세로 flex 다. 그대로 두면 자식 카드들이 **눌려서 잘린다** —
       내용이 넘치는데도 스크롤이 안 생겨 아랫부분이 통째로 사라진다(관리 탭 사고).
       각 카드는 제 높이를 지키게 못 박고, 넘치는 만큼 탭이 스크롤하게 둔다. */
  body.appmode .tabpane > *{flex:none}
  body.appmode .tabpane{min-height:0}
  /* 채팅만은 안쪽 대화창이 스크롤한다(입력칸은 늘 바닥에 붙어 있어야 한다) */
  body.appmode #pane-chat{overflow:hidden}
  body.appmode .chatcard{flex:1;min-height:0}

  /* ── 위·아래에 더 있다는 신호 ────────────────────────
     ⚠ 색을 덧대면 카드 위에서는 색이 안 맞아 「띠」로 보인다(실제로 그랬다).
       그래서 덧대지 않고 **내용 자체를 투명하게 흐린다(mask).**
       배경이 무엇이든 자연스럽고, 그라데이션이 스크롤 칸 안에서만 일어난다. */
  .scr-t{-webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 44px);
         mask-image:linear-gradient(to bottom, transparent 0, #000 44px)}
  .scr-b{-webkit-mask-image:linear-gradient(to top, transparent 0, #000 44px);
         mask-image:linear-gradient(to top, transparent 0, #000 44px)}
  .scr-tb{-webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 44px,
            #000 calc(100% - 44px), transparent 100%);
          mask-image:linear-gradient(to bottom, transparent 0, #000 44px,
            #000 calc(100% - 44px), transparent 100%)}

  @media (max-width:560px){
    body{padding:calc(18px + env(safe-area-inset-top)) 12px calc(96px + env(safe-area-inset-bottom))}
    body.appmode .wrap{padding-left:12px;padding-right:12px}
    h1{font-size:20px}
    .stat .vl{font-size:25px}
    .stats{grid-template-columns:1fr 1fr;gap:8px}
    .cal{padding:11px 7px 9px}
    .grid{gap:3px}
    .cell{min-height:74px;border-radius:8px;padding:3px 2px}
    .ev{font-size:9px;line-height:1.25;gap:2px}
    .ev b{width:11px;height:11px;font-size:8px}
    .ev .tm{font-size:8.5px}
    /* ⚠ 폰에서는 들여쓰기까지 주면 8자리가 안 들어가 잘린다. 칸 폭이 43px 남짓뿐이다. */
    .rid{font-size:8px;margin:0 0 3px 1px;letter-spacing:-.06em}
    .more{font-size:8.5px}
    .legend{gap:4px 9px;font-size:10.5px}
    .lede{font-size:12.5px}
    .card>h3,.sum{padding:13px 14px 10px}
    li.row{padding:10px 14px}
  }

  /* ── 데스크탑 ─────────────────────────────────────────
     ⚠ 이 묶음은 **반드시 .bar 기본 규칙보다 아래**에 있어야 한다.
       위에 두면 우선순위가 같아 나중에 나오는 left:0;right:0 에 덮이고,
       transform:translateX(-50%) 만 살아남아 바가 화면 왼쪽으로 밀려 잘린다.
       (2026-08-23 실제로 그렇게 났다. right:auto 를 넣어도 소용없었던 이유다.) */
  @media (min-width:900px){
    .wrap{max-width:1080px;gap:24px}
    .cell{min-height:118px}
    .ev{font-size:10.5px}
    .rid{font-size:9.5px;margin-left:15px}
    body{padding:30px 24px 90px}
    /* 데스크탑에서는 화면 폭을 가로지르는 띠 대신 가운데 뜬 알약으로. */
    .bar{left:50%;right:auto;width:min(560px,92vw);border-radius:16px;
         transform:translateX(-50%) translateY(-18px);
         box-shadow:0 8px 30px rgba(0,0,0,.6)}
  }
</style>

    const dow = new Date(curY, curM - 1, d).getDay();
    /* 자정을 넘긴 예약은 다음 날에도 조각으로 한 번 더 들어온다(8/18 21~24 → 8/19 0~1).
       스페이스클라우드도 그렇게 보여준다. 그대로 둔다. */
    const evs = [...day.예약.map(r => evOf(r, false)), ...day.일정.map(s => evOf(s, true))]
      .sort((a, b) => a.sort - b.sort);
    const shown = evs.slice(0, MAX).map(e =>
      `<div class="ev ${e.cls}"><b>${e.badge}</b><span>${esc(e.who)}` +
      `<span class="tm">${esc(e.t)}</span></span></div>` +
      /* ⚠ 예약번호는 조각 안에 넣으면 폭이 모자라 「10377…」로 잘린다.
         뱃지·여백을 빼고 나면 30px 남짓뿐이다. 칸 전체를 쓰도록 제 줄로 뺀다. */
      (e.id ? `<div class="rid">${esc(e.id)}</div>` : '')).join('');
    const rest = evs.length > MAX ? `<div class="more">+${evs.length - MAX}</div>` : '';
    h += `<div class="cell${dow === 0 ? ' sun' : dow === 6 ? ' sat' : ''}${day.공휴일 ? ' hol' : ''}` +
         `${Number(ymd) === TODAY ? ' now' : ''}${ymd === sel ? ' sel' : ''}" data-ymd="${ymd}">` +
         `<div class="d">${d}</div>` +
         (day.공휴일 ? `<div class="hname">${esc(휴일명(ymd))}</div>` : '') +
         `${shown}${rest}</div>`;
  }
  $('grid').innerHTML = h;
  renderDay();
}

/* 발송 결과 배지 — 알림톡·문자 **각각의** 성패를 보여준다(투트랙).
   ✓=나감, ✗=실패(올려보면 사유), — 표시는 아직 안 켠 단계(알림톡 심사 전).
   기록이 없는 옛 예약은 그냥 「안내 나감」. */
function 발송배지(r) {
  if (!r.안내발송) return '';
  const b = r.발송;
  if (!b) return '<span class="pill ok">안내 나감</span>';
  if (b.어떻게)   // 투트랙 전(옛) 기록
    return `<span class="pill ok">${b.어떻게 === 'alimtalk' ? '알림톡' : '문자'} 나감 · ${esc(b.시각)}</span>`;
  const 칸 = [];
  const 사유 = [];
  for (const k of ['알림톡', '문자']) {
    if (b[k] === 'ok') 칸.push(k + ' ✓');
    else if (b[k]) { 칸.push(k + ' ✗'); 사유.push(k + ': ' + b[k]); }
    else if (k === '문자') 칸.push('문자 —');   // 알림톡 미시도는 심사 전이라 표시 생략
  }
  const 하나라도 = b.알림톡 === 'ok' || b.문자 === 'ok';
  const tip = 사유.length ? ` title="${esc(사유.join(' / '))}"` : '';
  if (!하나라도) return `<span class="pill wait"${tip}>자동 발송 실패 · 메일 확인 후 직접 보내주세요</span>`;
  return `<span class="pill ok"${tip}>${esc(칸.join(' · '))} · ${esc(b.시각)}</span>`;
}

function renderDay() {
  const box = $('day');
  if (!sel || !cal) { box.classList.remove('on'); return; }
  const day = cal.날들.find(d => d.날짜 === sel);
  const items = [];
  for (const r of (day?.예약 || [])) items.push({
    t: `${r.시작}시 ~ ${r.끝}시`, k: r.이름 || '손님',
    s: `예약 <b class="rno">${esc(r.id)}</b> · ${esc(r.상태)}` +
       `${r.인원 ? ' · ' + esc(r.인원) + '명' : ''}` +
       `${r.금액 ? ' · ' + num(r.금액) + '원' : ''}` +
       (r.설치전 ? ' <span class="pill done">설치 전 · 직접 안내</span>' : ' ' + 발송배지(r)),
    tel: r.연락처 || '',
    c: kindOf(r)[0] === 'void' ? 'var(--done)' : `var(--${kindOf(r)[0]})`,
  });
  for (const s of (day?.일정 || [])) items.push({
    t: `${s.시작}시 ~ ${s.끝}시`, k: isClean(s) ? '청소' : (s.이름 || '일정'),
    /* ⚠ 메모는 호스트센터에서 손으로 적는 값이다. 통째로 innerHTML 에 들어가므로 반드시 막는다. */
    s: esc(s.메모 && !/청소/.test(s.메모) ? s.메모 : (isClean(s) ? '' : '직접 넣은 일정')),
    c: isClean(s) ? 'var(--clean)' : 'var(--add)',
  });
  items.sort((a, b) => parseInt(a.t) - parseInt(b.t));

  const ymd = sel;
  const 휴일 = day && day.공휴일 ? ` <span style="color:#FF6B7E;font-size:.85em">· ${esc(휴일명(ymd))}</span>` : '';
  box.innerHTML = `<h4>${ymd.slice(4,6)}월 ${ymd.slice(6,8)}일${휴일}</h4>` +
    (items.length
      ? `<ol>${items.map(i => `<li><span class="t">${esc(i.t)}</span>` +
          `<span class="who2"><b style="color:${esc(i.c)}">${esc(i.k)}</b>` +
          /* i.s 는 위에서 조각마다 esc 를 씌워 만든 것이다. 태그(<b class=rno>)를 살려야 해서
             여기서 또 씌우지 않는다. ⚠ i.s 를 만드는 자리를 고칠 땐 esc 를 빼먹지 말 것. */
          `<span style="color:var(--sub);font-size:12.5px"> ${i.s}</span>` +
          (i.tel !== undefined ? `<span class="telrow">${전화(i.tel)}</span>` : '') +
          `</span></li>`).join('')}</ol>`
      : `<div class="none">이날은 비어 있습니다.</div>`);
  box.classList.add('on');
}

async function loadCal(y, m) {
  curY = y; curM = m; sel = '';
  $('calmon').textContent = `${y}년 ${m}월 · 불러오는 중`;
  const 판 = document.querySelector('.cal');
  if (판) 판.classList.add('loading');
  try {
    const d = await (await fetch(feed(`cal=${y}-${String(m).padStart(2, '0')}`))).json();
    cal = d.ok ? d : { 날들: [] };
    if (!d.ok) $('calmon').textContent = `${y}년 ${m}월 · 못 불러옴`;
  } catch { cal = { 날들: [] }; }
  if (판) 판.classList.remove('loading');
  renderCal();
}
const shift = n => { let y = curY, m = curM + n;
  if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } loadCal(y, m); };
$('prev').onclick = () => shift(-1);
$('next').onclick = () => shift(1);
$('now').onclick = () => loadCal(Math.floor(TODAY / 10000), Math.floor(TODAY / 100) % 100);

function render(d) {
  $('date').textContent = d.updated + ' 기준';

  /* 토큰 만료일 — 늘 보이게. 이게 지나면 자동 안내가 멈춘다. */
  if (d.ok && d.토큰만료일) {
    const 급함 = (d.토큰남은날 ?? 99) <= 7;
    $('token').innerHTML = `<div class="tok${급함 ? ' warn' : ''}"><i>🔑</i><span>` +
      `스페이스클라우드 토큰 <b>D-${d.토큰남은날}</b> (${esc(d.토큰만료일)} 만료)` +
      `<br>${esc(d.갱신시점 || '만료 한 주 전')}에 「토큰 갱신」이라고 말해주세요 — 안 하면 자동 안내가 멈춥니다.</span></div>`;
  }

  /* 손봐야 하는 것부터 맨 위에. 화면을 열자마자 눈에 들어와야 하는 건 이것뿐이다. */
  const A = [];
  if (!d.ok) {
    A.push(`<div class="warnbox"><b>수치를 못 불러왔습니다.</b><br>${esc(d.오류 || '')}
      <br>토큰이 만료됐다면 크롬에서 <b>partner.spacecloud.kr</b> 에 로그인한 뒤 갱신 토큰을 다시 심어야 합니다.</div>`);
  } else {
    if (/미연결/.test(d.알림톡 || ''))
      A.push(`<div class="warnbox"><b>지금은 문자(LMS)로 안내가 나갑니다.</b>
        알림톡은 <b>심사중</b>(8/24 접수) — 승인되면 알림톡·문자 두 갈래로 같이 나갑니다.</div>`);
  }
  $('alarm').innerHTML = A.join('');

  const rs = d.예약 || [];
  const 앞으로 = rs.filter(r => !r.지남 && r.상태 === '예약확정');
  const 대기 = 앞으로.filter(r => !r.안내발송 && !r.설치전);
  const 이번달 = rs.filter(r => r.상태 !== '취소환불' &&
    String(r.날짜).slice(0, 7) === `${curY}.${String(curM).padStart(2, '0')}`);

  $('stats').innerHTML =
    stat('다가오는 예약', 'var(--rsv)', num(앞으로.length), '건') +
    stat('안내 안 나간 것', 대기.length ? 'var(--warn)' : 'var(--dim)', num(대기.length), '건') +
    stat(`${curM}월 매출`, 'var(--sub)', num(이번달.reduce((a, r) => a + r.금액, 0)), '원') +
    stat('토큰', (d.토큰남은날 ?? 99) <= 7 ? 'var(--warn)' : 'var(--dim)',
         d.토큰남은날 == null ? '—' : d.토큰남은날, '일 남음');

  /* ⚠ 「설치 전부터 있던 예약」과 「이 시스템이 보낸 예약」은 다르다.
     둘 다 발송 대상에서 빠지지만, 앞의 것은 사람이 직접 챙겨야 한다. */
  const row = r => {
    const pill = r.상태 === '취소환불' ? '<span class="pill done">취소</span>'
      : r.지남 ? '<span class="pill done">이용완료</span>'
      : r.설치전 ? '<span class="pill done">설치 전 · 직접 안내</span>'
      : r.안내발송 ? (발송배지(r) || '<span class="pill ok">안내 나감</span>')
      : '<span class="pill wait">안내 대기</span>';
    /* 날짜를 크게(요일 포함), 다가오는 확정 예약에는 D-day 뱃지 */
    const m = String(r.날짜).match(/^(\d{4})\.(\d{2})\.(\d{2}) (.+)$/);
    let 디데이 = '', 날짜칸 = esc(r.날짜);
    if (m) {
      const dt = new Date(+m[1], +m[2] - 1, +m[3]);
      const 영 = new Date(); 영.setHours(0, 0, 0, 0);
      const 일 = Math.round((dt - 영) / 864e5);
      const 요일 = '일월화수목금토'[dt.getDay()];
      const 해 = +m[1] === 영.getFullYear() ? '' : `${m[1]}. `;
      날짜칸 = `<b class="wdate">${esc(해)}${+m[2]}. ${+m[3]} (${요일})</b> <span class="wtime">${esc(m[4])}</span>`;
      const 끝남 = r.지남 || r.상태 === '이용완료' || r.상태 === '취소환불';
      if (!끝남 && r.상태 === '예약확정' && 일 >= 0)
        디데이 = `<span class="dday${일 <= 3 ? ' hot' : ''}">${일 === 0 ? 'D-DAY' : 'D-' + 일}</span>`;
    }
    return `<li class="row">
      <div class="nm"><b>${esc(r.이름)}</b> ${디데이} ${pill}
        <small class="whenrow">${날짜칸} · 예약 <b class="rno">${esc(r.id)}</b></small>
        <small class="telrow">${전화(r.연락처)}</small></div>
      <div class="vn">${num(r.금액)}<em>원</em></div></li>`;
  };

  /* ⚠ 날짜만 보면 「오늘 끝난 예약」이 계속 다가오는 칸에 남는다.
     이용이 끝났거나 취소된 것은 날짜와 상관없이 지난 쪽으로 보낸다.
     (안 그러면 위 타일의 3건과 아래 목록의 4건이 어긋나 보인다.) */
  const 끝난 = r => r.지남 || r.상태 === '이용완료' || r.상태 === '취소환불';
  const 앞 = rs.filter(r => !끝난(r));
  const 뒤 = rs.filter(끝난).reverse();
  $('list').innerHTML =
    `<div class="card"><h3>다가오는 예약<span class="r">${앞.length}건</span></h3>
       ${앞.length ? `<ul>${앞.map(row).join('')}</ul>` : '<div class="none">예정된 예약이 없습니다.</div>'}
       <div class="memo">「안내 나감」은 <b>이 시스템이 보냈다</b>는 뜻입니다.
         「설치 전」은 자동화를 켜기 전부터 잡혀 있던 예약이라 <b>직접 안내</b>하셔야 합니다.</div></div>

    var 글 = 입력.value.trim();
    if (!글 && !붙인사진.length) return;

    /* 화면에 내 말 — 누가 보냈는지 이름표를 위에 붙인다(세 사람이 같이 쓴다) */
    var 이름 = (typeof 누구 === 'function' ? 누구() : '');
    if (이름) { var w = document.createElement('div'); w.className = 'cwho'; w.textContent = 이름; 붙이기(w); }
    var html = 붙인사진.map(function (p) { return '<img class="cshot" src="' + p.url + '">'; }).join('') +
               (글 ? esc(글) : '');
    말풍선('cme', html);

    /* 서버로 보낼 내용 */
    var 내용 = [];
    붙인사진.forEach(function (p) {
      내용.push({ type: 'image', source: { type: 'base64', media_type: p.media_type, data: p.data } });
    });
    내용.push({ type: 'text', text: 글 || '이 사진을 보고 무엇을 하면 될지 알려줘.' });
    대화.push({ role: 'user', content: 내용 });

    입력.value = ''; 입력.style.height = 'auto';
    붙인사진 = []; 사진그리기();
    보내는중 = true; 보냄.disabled = true;
    var 기다림 = 말풍선('cbot', '<span style="opacity:.6">…</span>');

    try {
      var d = await 서버({ messages: 대화 });
      기다림.remove();
      if (!d || !d.ok) { 말풍선('cerr', esc((d && d.오류) || '서버가 답하지 않았습니다')); return; }
      말풍선('cbot', esc(d.답));
      대화.push({ role: 'assistant', content: d.답 });
      (d.대기 || []).forEach(확인카드);
      대화저장();
      if (d.쓴토큰) {
        var 원 = (d.쓴토큰.input_tokens * (d.모델 && d.모델.indexOf('haiku') >= 0 ? 1 : 2) +
                  d.쓴토큰.output_tokens * (d.모델 && d.모델.indexOf('haiku') >= 0 ? 5 : 10)) / 1e6 * 1450;
        $('chatcost').textContent = '약 ' + Math.max(1, Math.round(원)) + '원';
      }
    } catch (e) {
      기다림.remove();
      말풍선('cerr', '연결에 실패했습니다. 잠시 뒤 다시 시도해 주세요.');
    } finally {
      보내는중 = false; 보냄.disabled = false;
    }
  }
  보냄.onclick = 보내기;
  대화복원();
})();

/* ── 위·아래에 더 있다는 신호 ──────────────────────────────
   ⚠ 색을 덧대지 않는다. 스크롤 칸 자체에 mask 를 씌워 **내용이 흐려지게** 한다.
     그래야 카드 위든 배경 위든 색이 어긋나지 않고, 그라데이션이 스크롤 칸 안에 있다.
   ⚠ 바 높이는 기기마다 다르다(안전영역). 재서 --barh 로 넘겨 내용이 그만큼 비켜 앉게 한다. */
(function () {
  function 칸들() {
    var out = [];
    document.querySelectorAll('.tabpane').forEach(function (p) {
      out.push(p.id === 'pane-chat' ? document.getElementById('chatlog') : p);
    });
    return out.filter(Boolean);
  }
  function 표시(칸) {
    if (!칸 || !칸.classList) return;
    var 위 = 칸.scrollTop > 8;
    var 아래 = 칸.scrollHeight - 칸.clientHeight - 칸.scrollTop > 8;
    칸.classList.remove('scr-t', 'scr-b', 'scr-tb');
    if (위 && 아래) 칸.classList.add('scr-tb');
    else if (위) 칸.classList.add('scr-t');
    else if (아래) 칸.classList.add('scr-b');
  }
  function 바높이() {
    var bar = document.querySelector('.bar');
    if (!bar) return;
    var h = Math.round(bar.getBoundingClientRect().height);
    if (h > 0) document.documentElement.style.setProperty('--barh', h + 'px');
  }
  function 다시() { 바높이(); 칸들().forEach(표시); }
  document.addEventListener('scroll', function (e) { 표시(e.target); }, true);
  window.addEventListener('resize', 다시);
  /* ⚠ class 를 감시하면 안 된다. 그라데이션을 켜려고 class 를 바꾸는 순간 그게 다시 감시에 걸려
       **끝없이 돌고 화면이 멎는다.** (자동 점검에서 렌더러가 통째로 얼어붙어 잡았다.)
       그래서 감시는 hidden(탭 전환)과 내용 추가에만 걸고, 자기 자신이 부른 것은 건너뛴다. */
  var 도는중 = false;
  function 다시안전() {
    if (도는중) return;
    도는중 = true;
    다시();
    setTimeout(function () { 도는중 = false; }, 0);
  }
  new MutationObserver(다시안전).observe(document.body,
    { subtree: true, childList: true, attributes: true, attributeFilter: ['hidden'] });
  [0, 200, 600, 1200].forEach(function (t) { setTimeout(다시, t); });
})();

/* ── 진단 창 (관리 탭 「화면 진단 켜기」) ────────────────────
   ⚠ 폰에서만 나는 문제를 여기서 추측하면 끝이 없다. 실제 값을 화면에 띄워 보고 고친다.
   ⚠ env() 값은 getPropertyValue 로 못 읽는다(글자 그대로 돌려준다).
     그 값을 높이로 준 자를 하나 만들어 **직접 잰다.** */
(function () {
  if (typeof 진단켜짐 !== 'function' || !진단켜짐()) return;
  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:6px;right:6px;top:6px;z-index:99;padding:8px 10px;' +
    'background:rgba(0,0,0,.9);border:1px solid #2CFF05;border-radius:9px;color:#2CFF05;' +
    'font:600 11px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;pointer-events:none';
  document.body.appendChild(box);
  var 자 = document.createElement('div');
  자.style.cssText = 'position:fixed;left:-99px;bottom:0;width:1px;height:env(safe-area-inset-bottom)';
  document.body.appendChild(자);
  var 자위 = document.createElement('div');
  자위.style.cssText = 'position:fixed;left:-99px;top:0;width:1px;height:env(safe-area-inset-top)';
  document.body.appendChild(자위);
  /* ⚠ 결정적 표식 — 화면(웹뷰) 맨 아래에 자홍색 선을 긋는다.
       이 선이 폰 화면 진짜 바닥에 있으면 우리 CSS 문제이고,
       선 아래로 검은 띠가 더 있으면 **웹뷰 자체가 화면을 다 못 덮는 것**이라 CSS 로는 못 고친다. */
  var 표식 = document.createElement('div');
  표식.style.cssText = 'position:fixed;left:0;right:0;bottom:0;height:3px;background:#FF00AA;z-index:100;pointer-events:none';
  document.body.appendChild(표식);
  /* ⚠ 탐침 — 「모자란 자리」에 청록색을 칠해 본다. 이게 화면에 보이면
       웹뷰는 화면을 다 덮고 있고 배치 높이만 짧게 굳은 것이라 CSS 로 고칠 수 있다.
       안 보이면 웹뷰 자체가 짧은 것이라 메타·매니페스트로만 고칠 수 있다. */
  var 탐침 = document.createElement('div');
  탐침.style.cssText = 'position:fixed;left:0;right:0;bottom:0;height:0;background:#00E5FF;z-index:99;pointer-events:none';
  document.body.appendChild(탐침);
  var vv = window.visualViewport;
  function 재기() {
    var bar = document.querySelector('.bar');
    var r = bar ? bar.getBoundingClientRect() : { top: 0, bottom: 0, height: 0 };
    var 라벨 = document.querySelector('.bar button.on span') || document.querySelector('.bar button span');
    var lr = 라벨 ? 라벨.getBoundingClientRect() : null;
    var b = document.body;
    var 모자람 = Math.max(0, (screen.height || 0) - window.innerHeight);
    탐침.style.height = 모자람 + 'px';
    탐침.style.bottom = (-모자람) + 'px';
    box.textContent = [
      '버전 ' + (window.__BUILD || '?') + '   dpr ' + (window.devicePixelRatio || '?'),
      'inner ' + window.innerHeight + '  vv ' + (vv ? Math.round(vv.height) : '-') +
        '  offTop ' + (vv ? Math.round(vv.offsetTop) : '-') + '  scrollY ' + Math.round(window.scrollY),
      'body ' + Math.round(b.getBoundingClientRect().height) + '  pos ' + getComputedStyle(b).position +
        '  kb ' + (b.classList.contains('kb') ? 'Y' : 'N') + '  app ' + (b.classList.contains('appmode') ? 'Y' : 'N'),
      '바 top ' + Math.round(r.top) + '  h ' + Math.round(r.height) +
        '  아래틈 ' + Math.round(window.innerHeight - r.bottom) +
        '  글자아래 ' + (lr ? Math.round(window.innerHeight - lr.bottom) : '-'),
      '안전영역아래 ' + Math.round(자.getBoundingClientRect().height) +
        '  위 ' + Math.round(자위.getBoundingClientRect().height) +
        '  바패딩 ' + (bar ? getComputedStyle(bar).paddingBottom : '-'),
      /* ⚠ 이 줄이 핵심이다. screen 과 inner 가 다르면 **웹뷰가 화면을 다 못 덮는 것**이고
           그건 CSS 가 아니라 메타/매니페스트 문제다. 모자란 값(모자람)이 0 이어야 정상. */
      'screen ' + screen.width + 'x' + screen.height +
        '  inner ' + window.innerWidth + 'x' + window.innerHeight +
        '  모자람 ' + 모자람,
      '홈앱 ' + (window.navigator.standalone ? 'Y' : 'N') +
        '  모드 ' + (window.matchMedia('(display-mode: standalone)').matches ? 'standalone'
                  : window.matchMedia('(display-mode: fullscreen)').matches ? 'fullscreen' : 'browser'),
    ].join('\n');
  }
  if (vv) { vv.addEventListener('resize', 재기); vv.addEventListener('scroll', 재기); }
  window.addEventListener('resize', 재기);
  setInterval(재기, 700); 재기();
})();
</script>
