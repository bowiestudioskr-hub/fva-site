<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>오공일501 예약 현황</title>
<link rel="icon" href="/favicon.ico">
<style>
  /* ⚠ 이 화면은 **오공일501(공간대여)** 것이다. 피바아카데미와 다른 사업이니
     아카데미 화면·링크·말투를 섞지 말 것. 아카데미 쪽은 fva.co.kr 에 따로 있다.
     ⚠ 검색에 안 뜬다(noindex). robots.txt 에는 적지 말 것 —
     적는 순간 주소를 광고하는 셈이고, 크롤러가 noindex 를 읽지도 못한다.

     디자인 얼개는 손님 화면과 같은 집안이다. 검은 바탕에 큰 숫자,
     선을 긋지 않고 카드의 면으로 구분한다. 색은 뜻을 하나씩만 지고 간다.

     ⚠ 이 화면은 「안내가 실제로 나갔나」를 눈으로 확인하려고 만든 것이다.
       손님 연락처는 서버에서 이미 가려서 온다. 원본이 필요하면 호스트센터에서 본다. */
  :root{
    --bg:#000; --card:#1C1C1E; --card2:#2C2C2E; --card3:#242427;
    --ink:#fff; --sub:#98989F; --dim:#636366; --line:#2C2C2E;

    /* ⚠ 색은 스페이스클라우드 캘린더와 같은 뜻으로 맞춰 뒀다.
       두 화면을 오가며 보는 사람이 색을 다시 배우지 않아도 되게. (검은 바탕용으로 밝기만 올림) */
    --rsv:#A78BFA;     /* 예약확정   — 스클 보라 */
    --hold:#34D399;    /* 승인대기   — 스클 초록 */
    --paywt:#F472B6;   /* 결제대기   — 스클 자주 */
    --add:#38BDF8;     /* 추가한예약 — 스클 파랑 (감독님 수업·청소가 여기 들어온다) */
    --done:#8E8E93;    /* 이용완료   — 스클 회색 */
    --clean:#FBBF24;   /* 청소만 따로 — 스클엔 없지만 자주 보는 것이라 갈라 뒀다 */
    --wait:#FFD60A;
    --warn:#FF375F;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',Pretendard,system-ui,sans-serif;
    font-size:15px; line-height:1.5; padding:22px 16px calc(82px + var(--lift,0px));
    font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
  .hd .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  h1{font-size:24px;letter-spacing:-.03em;font-weight:800}
  .date{color:var(--dim);font-size:13px}
  .lede{color:var(--sub);font-size:13px;margin-top:5px}
  .lede a{color:inherit}

  /* ── 달력 ───────────────────────────────────────────── */
  .cal{background:var(--card);border-radius:16px;padding:14px 12px 12px}
  .calhd{display:flex;align-items:center;gap:10px;padding:0 4px 12px}
  .calhd b{font-size:16px;font-weight:800;letter-spacing:-.02em}
  .calhd .nav{margin-left:auto;display:flex;gap:6px}
  .calhd button{background:var(--card2);color:var(--ink);border:0;border-radius:9px;
                width:32px;height:30px;font-size:15px;cursor:pointer;font-family:inherit}
  .calhd button:active{opacity:.6}
  .calhd .today{width:auto;padding:0 11px;font-size:12.5px;font-weight:700}

  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dow{text-align:center;font-size:11px;font-weight:700;color:var(--dim);padding:2px 0 5px}
  .dow.s{color:#FF6B7E} .dow.t{color:#6BA8FF}
  .go a::before{content:'🔗 ';opacity:.75;font-size:.92em}
  .cell{background:var(--card3);border-radius:9px;min-height:104px;padding:4px 3px 4px;
        display:flex;flex-direction:column;gap:2px;cursor:pointer;border:1.5px solid transparent;
        overflow:hidden}
  .cell.off{background:transparent;cursor:default}
  /* ⚠ 오늘과 「고른 날」이 둘 다 흰 테두리였다. 구분이 안 갔다.
     오늘 = 날짜 숫자에 동그란 표시, 고른 날 = 테두리. 서로 다른 자리에 표시한다. */
  .cell.now .d{background:var(--ink);color:#000;border-radius:99px;
               width:19px;height:19px;line-height:19px;margin:0 auto;font-weight:800}
  .cell.now.sun .d,.cell.now.sat .d{color:#000}
  /* 오늘은 칸 전체도 한눈에 — 호박색 테두리 + 살짝 밝은 바탕 (고른 날의 흰 테두리와 구분) */
  .cell.now{border-color:#FFC24B;background:#26241B;position:relative;
            box-shadow:0 0 0 1px rgba(255,194,75,.25) inset}
  .cell.now::after{content:'TODAY';position:absolute;top:5px;right:6px;
            font-size:8px;font-weight:800;color:#FFC24B;letter-spacing:0;pointer-events:none}
  .cell.sel{border-color:#fff;background:#2E2E33}
  .cell .d{font-size:11.5px;font-weight:700;color:var(--sub);text-align:center;line-height:1.25}
  .cell.sun .d{color:#FF6B7E} .cell.sat .d{color:#6BA8FF}

  /* ⚠ 칸 안에 글자를 직접 넣는다. 색 막대만으로는 「누가 몇 시에」가 안 보여서
     결국 하나하나 눌러봐야 했다. 스페이스클라우드 캘린더가 이렇게 보여준다. */
  /* ⚠ 한 줄로 자르면 정작 보고 싶은 이름이 잘려 나간다(「13~15, 정…」).
     두 줄까지 흐르게 두고, 이름을 앞에 세운다. */
  .ev{display:flex;align-items:flex-start;gap:3px;font-size:9.5px;line-height:1.3;
      color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
  /* ⚠ 시간은 줄 끝에서 「13~1 / 5」로 쪼개지면 안 읽힌다. 제 줄에 통째로 둔다. */
  .ev .tm{display:block;white-space:nowrap;color:var(--sub);font-variant-numeric:tabular-nums;
          font-size:9px}
  /* ⚠ 이름·시간은 왼쪽인데 번호만 오른쪽이면 줄기가 둘로 갈려 어수선하다. 같이 왼쪽. */
  .rid{display:block;white-space:nowrap;color:var(--dim);font-size:8.5px;line-height:1.3;
       font-variant-numeric:tabular-nums;letter-spacing:-.04em;
       margin:-1px 0 4px 15px}
  .ev b{flex:none;width:12px;height:12px;border-radius:3px;font-size:8.5px;font-weight:800;
        display:grid;place-items:center;color:#101014;margin-top:.5px}
  .ev.void{color:#5A5A60;text-decoration:line-through}
  .ev.rsv b{background:var(--rsv)} .ev.hold b{background:var(--hold)}
  .ev.paywt b{background:var(--paywt)} .ev.add b{background:var(--add)}
  .ev.done b{background:var(--done)} .ev.clean b{background:var(--clean)}
  .ev.void b{background:#3A3A3E;color:#7A7A80}
  .more{font-size:9px;color:var(--dim);text-align:center}

  .legend{display:flex;flex-wrap:wrap;gap:5px 12px;padding:11px 5px 2px;font-size:11.5px;color:var(--sub)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2.5px;margin-right:5px;vertical-align:-1px}

  .day{background:var(--card2);border-radius:12px;margin-top:10px;padding:12px 13px;display:none}
  .day.on{display:block}
  .day h4{font-size:13.5px;font-weight:800;margin-bottom:8px}
  .day ol{list-style:none;display:flex;flex-direction:column;gap:7px}
  .day li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px}
  .day .who2{flex:1;min-width:0}
  .day .who2 b{font-weight:700}
  .day .t{color:var(--sub);font-size:12.5px;min-width:74px;white-space:nowrap}
  .day .k{font-weight:700}
  .day .none{color:var(--dim);font-size:13px}

  /* ── 타일·목록 ───────────────────────────────────────── */
  .stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .stat{background:var(--card);border-radius:16px;padding:14px 16px 15px}
  .stat .lb{font-size:12px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:5px}
  .stat .lb i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .stat .vl{font-size:29px;font-weight:800;letter-spacing:-.045em;line-height:1.05}
  .stat .vl span{font-size:14px;font-weight:600;color:var(--sub);margin-left:3px}

  .card{background:var(--card);border-radius:16px;overflow:hidden}
  .card>h3{font-size:14px;font-weight:700;padding:15px 16px 11px;display:flex;align-items:center;gap:8px}
  .card>h3 .r{margin-left:auto;font-weight:600;color:var(--dim);font-size:12px}
  ul{list-style:none}
  li.row{display:flex;align-items:center;gap:12px;padding:11px 16px}
  li.row+li.row{box-shadow:inset 0 .5px 0 rgba(255,255,255,.07)}
  .nm{flex:1;min-width:0}
  .nm b{font-size:15px;font-weight:700}
  .nm small{display:block;font-size:12px;color:var(--dim);margin-top:2px}
  /* 예약번호는 손님이 불러주는 값이라 눈에 걸려야 한다. 이름·전화와 같은 무게로. */
  b.rno{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
  /* 전화번호는 누르는 것이다. 누를 수 있게 보여야 하고, 손가락이 닿을 만해야 한다. */
  .telrow{display:block;margin-top:4px}   /* ⚠ inline 이면 앞 글자에 붙어 「30,000원번호 없음」이 된다 */
  a.tel{display:inline-block;color:var(--ink);font-size:13.5px;font-weight:700;
        text-decoration:none;background:var(--card2);border-radius:8px;
        padding:5px 10px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
  a.tel::before{content:'📞 ';font-size:11px}
  a.tel:active{opacity:.6}
  .notel{color:var(--dim);font-size:12px}
  .vn{text-align:right;white-space:nowrap;font-size:14px;font-weight:700}
  .vn em{display:block;font-style:normal;font-size:11.5px;font-weight:600;color:var(--sub);margin-top:2px}

  .pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap}
  .pill.ok{background:#0C3B1E;color:var(--rsv)}
  .pill.wait{background:#3A3210;color:var(--wait)}
  .pill.done{background:var(--card2);color:var(--done)}

  .hd{text-align:center}
  .hd .row{justify-content:center;position:relative}
  .hd .date{position:absolute;right:0;bottom:2px}
  h1.brand{display:flex;align-items:center;justify-content:center;gap:12px}
  .brandlogo{height:38px;width:auto;display:block}
  .mkbtn{display:inline-block;margin:8px 0 2px;padding:9px 16px;border-radius:10px;
         background:#FFC24B;color:#1E1B10;font-weight:800;font-size:13px;text-decoration:none}
  .mkbtn:hover{filter:brightness(1.06)}
  .master{margin:0 16px 12px;padding:14px 16px;border-radius:12px;
          background:#26241B;border:1.5px dashed #FFC24B;
          box-shadow:0 0 0 1px rgba(255,194,75,.15) inset;
          font-size:12.5px;color:var(--sub);line-height:1.6}
  .master>b:first-child{display:block;font-size:14.5px;color:#FFC24B;margin-bottom:4px}
  .master>b{color:var(--ink);font-size:13.5px}
  .master .mk{display:block;margin-top:6px;font-size:15px;color:var(--ink);
              font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .master .mk b{font-weight:800}
  .master .warn2{display:block;margin-top:5px;font-size:11.5px;color:var(--warn)}

  .memo{font-size:12px;color:var(--dim);padding:0 16px 14px;line-height:1.5}
  .memo b{color:var(--sub)}
  .none{color:var(--dim);font-size:13.5px;padding:16px}

  /* 손님 화면 관리 */
  .kv{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
  .kv+.kv{box-shadow:inset 0 .5px 0 rgba(255,255,255,.07)}
  .kv label{font-size:13px;color:var(--sub);font-weight:700;min-width:104px}
  .kv input,.kv textarea{flex:1;min-width:150px;background:#0F0F11;color:var(--ink);
            border:1px solid var(--line);border-radius:9px;padding:9px 11px;
            font:inherit;font-size:14px;line-height:1.55}
  .kv textarea{resize:vertical;min-height:66px}
  /* 여러 줄 칸은 이름을 위로 올린다. 옆에 두면 칸이 좁아진다. */
  .kv.tall{align-items:flex-start}
  .kv.tall label{min-width:100%;margin-bottom:-4px}
  .kv.tall button{align-self:flex-start;margin-top:2px}
  .kv button{background:var(--card2);color:var(--ink);border:0;border-radius:9px;
             padding:9px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .kv button:active{opacity:.6}
  .kv .said{font-size:12px;color:var(--rsv)}
  .go{display:flex;gap:8px;padding:13px 16px 4px;flex-wrap:wrap}
  .go a{flex:1;min-width:140px;text-align:center;text-decoration:none;
        background:var(--card2);color:var(--ink);border-radius:11px;padding:12px;
        font-size:13.5px;font-weight:700}
  .go a.hi{background:#fff;color:#000}
  details{padding:0}
  summary{font-size:13px;color:var(--sub);cursor:pointer;padding:12px 16px;list-style:none;
          display:flex;align-items:center;gap:8px}
  summary::-webkit-details-marker{display:none}
  summary::after{content:'＋';margin-left:auto;color:var(--dim)}
  details[open] summary::after{content:'－'}
  summary.sum{font-size:14px;font-weight:700;color:var(--ink);padding:15px 16px 11px}
  details>.kv:first-of-type{padding-top:2px}
  details pre{white-space:pre-wrap;word-break:keep-all;font:inherit;font-size:12.5px;
              line-height:1.7;color:var(--sub);background:#141416;border-radius:11px;
              padding:13px;margin-top:10px}

  /* ⚠ 토큰이 죽으면 자동 안내가 통째로 멈춘다. 그래서 남은 날을 늘 맨 위에 띄운다.
     예전엔 7일 전에야 알려줬는데, 그러면 「그날이 언제였지」를 기억해야 한다. */
  .tok{display:flex;align-items:center;gap:9px;background:var(--card);border-radius:14px;
       padding:11px 15px;font-size:13px;color:var(--sub);line-height:1.5}
  .tok i{font-style:normal;font-size:15px;flex:none}
  .tok b{color:var(--ink)}
  .tok.warn{border-left:3px solid var(--warn)}
  .tok.warn b{color:var(--warn)}

  .warnbox{background:var(--card);border-radius:14px;border-left:3px solid var(--warn);
           padding:13px 16px;font-size:13px;color:var(--sub);line-height:1.55}
  .warnbox b{color:var(--ink)}
  footer{color:var(--dim);font-size:12px;padding-top:6px;line-height:1.7}

  /* ── 하단 바 ─────────────────────────────────────
     ⚠ body 아래 여백(padding-bottom)을 바 높이만큼 줘야 마지막 줄이 가려지지 않는다. */
  /* ⚠ 브라우저 아래쪽 UI(주소창·뒤로가기)가 이 바를 덮는다. iOS 는 주소창이 아래에
     있을 때 「문서가 깔리는 높이」가 「실제로 보이는 높이」보다 커서 bottom:0 이
     화면 밖으로 내려간다. 그 차이를 맨 아래 스크립트가 재서 --lift 로 넣어준다.
     ⚠ CSS 로는 알 수 없는 값이다. env(safe-area-inset-bottom) 은 이 경우 0 이다. */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
       transform:translateY(calc(-1 * var(--lift,0px)));
       background:rgba(20,20,22,.94);backdrop-filter:blur(14px);
       box-shadow:inset 0 .5px 0 rgba(255,255,255,.1);
       padding-bottom:env(safe-area-inset-bottom)}
  /* 키보드가 올라오면 감춘다. 안 그러면 입력칸 위에 올라타 앉는다. */
  body.kb .bar{display:none}
  .bar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
         padding:10px 3px 9px;border:0;border-bottom:2px solid transparent;background:none;
         cursor:pointer;color:var(--dim);
         font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:-.02em}
  .bar button.on{color:var(--ink);border-bottom-color:transparent}
  .bar button:focus{outline:none}
  .bar button:focus-visible{outline:2px solid var(--ink);outline-offset:-4px;border-radius:8px}
  .bar button.on i{filter:none}
  .bar i{font-style:normal;font-size:18px;line-height:1;filter:grayscale(1) opacity(.55)}
  .bar button:active{background:rgba(255,255,255,.06)}

  /* ⚠ [hidden] 은 display 를 주는 규칙에 진다. 이 집에서 두 번 당했다. 못 이기게 못 박는다. */
  .tabpane{display:flex;flex-direction:column;gap:20px}
  .tabpane[hidden]{display:none !important}
  @media (max-width:560px){
    body{padding:18px 12px calc(74px + var(--lift,0px))}
    h1{font-size:20px}
    .stat .vl{font-size:25px}
    .stats{grid-template-columns:1fr 1fr;gap:8px}
    .cal{padding:11px 7px 9px}
    .grid{gap:3px}
    .cell{min-height:74px;border-radius:8px;padding:3px 2px}
    .ev{font-size:9px;line-height:1.25;gap:2px}
    .ev b{width:11px;height:11px;font-size:8px}
    .ev .tm{font-size:8.5px}
    /* ⚠ 폰에서는 들여쓰기까지 주면 8자리가 안 들어가 잘린다. 칸 폭이 43px 남짓뿐이다. */
    .rid{font-size:8px;margin:0 0 3px 1px;letter-spacing:-.06em}
    .more{font-size:8.5px}
    .legend{gap:4px 9px;font-size:10.5px}
    .lede{font-size:12.5px}
    .card>h3,.sum{padding:13px 14px 10px}
    li.row{padding:10px 14px}
  }

  /* ── 데스크탑 ─────────────────────────────────────────
     ⚠ 이 묶음은 **반드시 .bar 기본 규칙보다 아래**에 있어야 한다.
       위에 두면 우선순위가 같아 나중에 나오는 left:0;right:0 에 덮이고,
       transform:translateX(-50%) 만 살아남아 바가 화면 왼쪽으로 밀려 잘린다.
       (2026-08-23 실제로 그렇게 났다. right:auto 를 넣어도 소용없었던 이유다.) */
  @media (min-width:900px){
    .wrap{max-width:1080px;gap:24px}
    .cell{min-height:118px}
    .ev{font-size:10.5px}
    .rid{font-size:9.5px;margin-left:15px}
    body{padding:30px 24px calc(90px + var(--lift,0px))}
    /* 데스크탑에서는 화면 폭을 가로지르는 띠 대신 가운데 뜬 알약으로. */
    .bar{left:50%;right:auto;width:min(560px,92vw);border-radius:16px;
         transform:translateX(-50%) translateY(calc(-18px - var(--lift,0px)));
         box-shadow:0 8px 30px rgba(0,0,0,.6)}
  }
</style>
</head>

<!-- ⚠ 이 바는 「링크 모음」이 아니라 **화면 전환**이다.
     한 화면에 달력·예약·관리를 다 쌓으니 폰에서 두 화면 넘게 긁어야 했다.
     셋으로 갈라 한 번에 하나만 보여준다. 바깥 링크는 관리 탭 안으로 넣었다. -->


<nav class="bar">
  <button type="button" data-tab="cal"><i>📅</i><span>달력</span></button>
  <button type="button" data-tab="book"><i>📖</i><span>예약</span></button>
  <button type="button" data-tab="set"><i>⚙️</i><span>관리</span></button>

<!-- ⚠ 바는 position:fixed 라 화면에서는 맨 아래에 뜬다. 그래도 마크업은
     **스크립트보다 위**에 있어야 한다 — 아래로 내리면 탭 핸들러를 걸 때
     아직 없는 노드라 버튼이 죽는다(2026-08-23 실제로 그랬다). -->

<script>
/* Apps Script 웹앱이 예약과 달력을 내준다.
   ⚠ 연락처는 서버에서 이미 가려서 온다. 여기서 원본을 다루지 않는다. */
const FEED = 'https://script.google.com/macros/s/AKfycbxWKkz5rS112O8ePWYgFqEl9S5Cb-gZjLcxS3eTpnhzloGA2dtr3rN00rOso-0Mwo0/exec';

const $ = id => document.getElementById(id);

/* ── 비밀번호 ────────────────────────────────────────────
   사이트 저장소가 공개라 파일에 비밀번호를 박을 수 없다. 대신 주소 뒤에 붙여 오거나
   화면에서 한 번 친다.   https://fva.co.kr/singleroom501/#k=비밀번호
   ⚠ 주소는 피바 도메인이지만 **내용은 오공일501 것**이다. 아카데미 화면·링크·말투를 섞지 말 것.
   ⚠ 손님 화면은 여전히 oh501.surge.sh 다. 여기서 '/' 로 걸면 아카데미 첫 화면으로 간다 —
     반드시 전체 주소로 걸 것.
   ⚠ # 뒤는 서버로 전송되지 않는다. 그래서 GitHub·서버 로그 어디에도 안 남는다.
   한 번 열면 이 기기에 저장해 두고, 다음부터는 안 물어본다.
   ⚠ 남의 컴퓨터에서 열었다면 브라우저 데이터를 지울 것. 손님 연락처가 그대로 보인다. */
const KEYNAME = 'oh501key';
function getKey() {
  const m = (location.hash || '').match(/k=([^&\s]+)/);   /* ⚠ ! 같은 글자도 받는다 */
  if (m) {
    try { localStorage.setItem(KEYNAME, m[1]); } catch {}
    history.replaceState(null, '', location.pathname);   // 주소창에서 지운다
    return m[1];
  }
  try { return localStorage.getItem(KEYNAME) || ''; } catch { return ''; }
}
let KEY = getKey();
const feed = q => `${FEED}?${q}&key=${encodeURIComponent(KEY)}`;

function askKey() {
  document.querySelector('.wrap').innerHTML =
    `<div class="hd"><h1 class="brand"><img src="img/logo.svg" alt="오공일501" class="brandlogo"><span>관리페이지</span></h1>
       <p class="lede">이 화면은 비밀번호가 있어야 열립니다.</p></div>
     <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:11px">
       <input id="kin" type="text" placeholder="비밀번호" autocomplete="off"
         autocapitalize="off" autocorrect="off" spellcheck="false"
         style="background:#0F0F11;color:#fff;border:1px solid var(--line);border-radius:11px;
                padding:13px 14px;font:inherit;font-size:15px">
       <button id="kgo" style="background:#fff;color:#000;border:0;border-radius:11px;
         padding:13px;font:inherit;font-size:15px;font-weight:800;cursor:pointer">열기</button>
       <p style="font-size:12.5px;color:var(--dim);line-height:1.6">
         비밀번호는 주소 뒤에 <b style="color:var(--sub)">#k=…</b> 로 붙여 두면 다음부터 안 물어봅니다.
         손님용 <a href="https://oh501.surge.sh/" style="color:var(--sub)">입실 안내 화면</a>은 비밀번호 없이 열립니다.</p>
     </div>`;
  /* ⚠ 폰처럼 「방금 친 글자만 잠깐 보이고 곧 가려지는」 칸.
     type=password 는 처음부터 다 가려서 오타를 못 잡고,
     type=text 는 어깨너머로 다 보인다. 그 사이를 손으로 만든다.
     진짜 값은 real 에만 두고, 칸에는 가린 글자를 그린다. */
  const inp = document.getElementById('kin');
  const MASK = '•';
  let real = '', timer = 0;

  const draw = (peek) => {
    const n = real.length;
    inp.value = n ? MASK.repeat(peek ? n - 1 : n) + (peek ? real[n - 1] : '') : '';
    clearTimeout(timer);
    if (peek && n) timer = setTimeout(() => draw(false), 900);
  };

  inp.addEventListener('input', () => {
    /* 칸에 남은 •는 옛 글자, 그 밖의 글자는 방금 들어온 것이다.
       자리별로 맞춰 real 을 다시 만든다(끝에서 치고 지우는 보통의 경우를 본다). */
    const v = inp.value;
    let out = '';
    for (let i = 0; i < v.length; i++) out += (v[i] === MASK) ? (real[i] || '') : v[i];
    real = out;
    draw(true);
  });

  const go = () => {
    const v = real.trim();
    if (v) { try { localStorage.setItem(KEYNAME, v); } catch {} location.reload(); }
  };
  document.getElementById('kgo').onclick = go;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  inp.focus();
}
const esc = v => String(v ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => (n ?? 0).toLocaleString('ko-KR');

/* 010-1234-5678 꼴로 끊어 보여주고, 누르면 바로 전화가 걸리게 한다.
   ⚠ 폰이 아니면 tel: 이 아무 일도 안 하지만 해로울 것도 없다. 링크를 그대로 둔다.
   ⚠ 이용이 끝난 예약은 스클이 연락처를 안 준다. 그때는 「번호 없음」으로 적는다. */
const 전화 = t => {
  const d = String(t || '').replace(/\D/g, '');
  if (d.length < 9) return '<span class="notel">번호 없음</span>';
  const p = d.length === 11 ? `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`
                            : `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;
  return `<a class="tel" href="tel:${d}">${p}</a>`;
};

/* 「오늘」은 한국 시각으로 센다. 브라우저가 어디에 있든 같은 날을 가리켜야 한다. */
const kstNow = () => new Date(Date.now() + (new Date().getTimezoneOffset() * 60000) + 9 * 3600e3);
const TODAY = (() => { const d = kstNow();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); })();

/* ── 달력 ───────────────────────────────────────────────
   ⚠ 「청소」와 「수업」은 둘 다 감독님이 직접 넣은 일정이라 API 로는 구분이 없다.
     이름·메모에 청소가 들어 있으면 청소로 본다. 그 외는 감독님 일정. */
const isClean = s => /청소/.test((s.이름 || '') + ' ' + (s.메모 || ''));
const KIND = { 예약확정:['rsv','예'], 승인대기:['hold','대'], 결제대기:['paywt','결'],
               이용완료:['done','완'], 취소환불:['void','취'] };
const kindOf = r => KIND[r.상태] || ['done', '·'];

/* 한 칸에 들어갈 조각. 스클처럼 「12~16, 정주영」 꼴로 적는다. */
function evOf(x, isSched) {
  /* ⚠ 예약번호를 칸에 바로 띄운다. 손님이 「예약번호 몇 번인데요」 하고 물어올 때
     달력을 눌러 들어가지 않고 그 자리에서 읽을 수 있어야 한다. */
  /* 감독님이 직접 넣은 일정은 스클에선 전부 「추가한예약」 한 덩어리다.
     실제로는 수업이 대부분이고 가끔 청소·시공이 섞인다. 메모를 보고 갈라 준다. */
  const [cls, badge] = isSched ? (isClean(x) ? ['clean', '청'] : ['add', '수']) : kindOf(x);
  const who = isSched
    ? (isClean(x) ? '청소' : (x.메모 && !/^정주영$/.test(x.메모) ? x.메모 : '수업'))
    : (x.이름 || '손님');
  return { cls, badge, t: `${x.시작}~${x.끝}`, who,
           id: isSched ? '' : (x.id || ''), sort: Number(x.시작) || 0 };
}

let cal = null, curY = 0, curM = 0, sel = '';

/* ⚠ 한 줄의 키는 그 줄에서 가장 많은 칸에 맞춰 늘어난다. 폰에서 세 개를 다 보이면
   그 주만 키가 두 배로 뛰어 달력이 들쭉날쭉해진다. 좁을 땐 두 개까지만 보이고
   나머지는 「+N」으로 접는다(눌러서 그날 전체를 본다). */
const MAX = matchMedia('(max-width:560px)').matches ? 2 : 3;

function renderCal() {
  if (!cal) return;
  $('calmon').textContent = `${curY}년 ${curM}월`;
  const byYmd = {};
  for (const d of cal.날들) byYmd[d.날짜] = d;

  const first = new Date(curY, curM - 1, 1);
  const lead = first.getDay();                       // 일요일 시작
  const last = new Date(curY, curM, 0).getDate();

  let h = ['일','월','화','수','목','금','토']
    .map((w, i) => `<div class="dow${i === 0 ? ' s' : i === 6 ? ' t' : ''}">${w}</div>`).join('');
  for (let i = 0; i < lead; i++) h += '<div class="cell off"></div>';

  for (let d = 1; d <= last; d++) {
    const ymd = String(curY * 10000 + curM * 100 + d);
    const day = byYmd[ymd] || { 예약: [], 일정: [] };
    const dow = new Date(curY, curM - 1, d).getDay();
    /* 자정을 넘긴 예약은 다음 날에도 조각으로 한 번 더 들어온다(8/18 21~24 → 8/19 0~1).
       스페이스클라우드도 그렇게 보여준다. 그대로 둔다. */
    const evs = [...day.예약.map(r => evOf(r, false)), ...day.일정.map(s => evOf(s, true))]
      .sort((a, b) => a.sort - b.sort);
    const shown = evs.slice(0, MAX).map(e =>
      `<div class="ev ${e.cls}"><b>${e.badge}</b><span>${esc(e.who)}` +
      `<span class="tm">${esc(e.t)}</span></span></div>` +
      /* ⚠ 예약번호는 조각 안에 넣으면 폭이 모자라 「10377…」로 잘린다.
         뱃지·여백을 빼고 나면 30px 남짓뿐이다. 칸 전체를 쓰도록 제 줄로 뺀다. */
      (e.id ? `<div class="rid">${esc(e.id)}</div>` : '')).join('');
    const rest = evs.length > MAX ? `<div class="more">+${evs.length - MAX}</div>` : '';
    h += `<div class="cell${dow === 0 ? ' sun' : dow === 6 ? ' sat' : ''}` +
         `${Number(ymd) === TODAY ? ' now' : ''}${ymd === sel ? ' sel' : ''}" data-ymd="${ymd}">` +
         `<div class="d">${d}</div>${shown}${rest}</div>`;
  }
  $('grid').innerHTML = h;
  renderDay();
}

/* 발송 결과 배지 — 알림톡·문자 **각각의** 성패를 보여준다(투트랙).
   ✓=나감, ✗=실패(올려보면 사유), — 표시는 아직 안 켠 단계(알림톡 심사 전).
   기록이 없는 옛 예약은 그냥 「안내 나감」. */
function 발송배지(r) {
  if (!r.안내발송) return '';
  const b = r.발송;
  if (!b) return '<span class="pill ok">안내 나감</span>';
  if (b.어떻게)   // 투트랙 전(옛) 기록
    return `<span class="pill ok">${b.어떻게 === 'alimtalk' ? '알림톡' : '문자'} 나감 · ${esc(b.시각)}</span>`;
  const 칸 = [];
  const 사유 = [];
  for (const k of ['알림톡', '문자']) {
    if (b[k] === 'ok') 칸.push(k + ' ✓');
    else if (b[k]) { 칸.push(k + ' ✗'); 사유.push(k + ': ' + b[k]); }
    else if (k === '문자') 칸.push('문자 —');   // 알림톡 미시도는 심사 전이라 표시 생략
  }
  const 하나라도 = b.알림톡 === 'ok' || b.문자 === 'ok';
  const tip = 사유.length ? ` title="${esc(사유.join(' / '))}"` : '';
  if (!하나라도) return `<span class="pill wait"${tip}>자동 발송 실패 · 메일 확인 후 직접 보내주세요</span>`;
  return `<span class="pill ok"${tip}>${esc(칸.join(' · '))} · ${esc(b.시각)}</span>`;
}

function renderDay() {
  const box = $('day');
  if (!sel || !cal) { box.classList.remove('on'); return; }
  const day = cal.날들.find(d => d.날짜 === sel);
  const items = [];
  for (const r of (day?.예약 || [])) items.push({
    t: `${r.시작}시 ~ ${r.끝}시`, k: r.이름 || '손님',
    s: `예약 <b class="rno">${esc(r.id)}</b> · ${esc(r.상태)}` +
       `${r.인원 ? ' · ' + esc(r.인원) + '명' : ''}` +
       `${r.금액 ? ' · ' + num(r.금액) + '원' : ''}` +
       (r.설치전 ? ' <span class="pill done">설치 전 · 직접 안내</span>' : ' ' + 발송배지(r)),
    tel: r.연락처 || '',
    c: kindOf(r)[0] === 'void' ? 'var(--done)' : `var(--${kindOf(r)[0]})`,
  });
  for (const s of (day?.일정 || [])) items.push({
    t: `${s.시작}시 ~ ${s.끝}시`, k: isClean(s) ? '청소' : (s.이름 || '일정'),
    /* ⚠ 메모는 호스트센터에서 손으로 적는 값이다. 통째로 innerHTML 에 들어가므로 반드시 막는다. */
    s: esc(s.메모 && !/청소/.test(s.메모) ? s.메모 : (isClean(s) ? '' : '직접 넣은 일정')),
    c: isClean(s) ? 'var(--clean)' : 'var(--add)',
  });
  items.sort((a, b) => parseInt(a.t) - parseInt(b.t));

  const ymd = sel;
  box.innerHTML = `<h4>${ymd.slice(4,6)}월 ${ymd.slice(6,8)}일</h4>` +
    (items.length
      ? `<ol>${items.map(i => `<li><span class="t">${esc(i.t)}</span>` +
          `<span class="who2"><b style="color:${esc(i.c)}">${esc(i.k)}</b>` +
          /* i.s 는 위에서 조각마다 esc 를 씌워 만든 것이다. 태그(<b class=rno>)를 살려야 해서
             여기서 또 씌우지 않는다. ⚠ i.s 를 만드는 자리를 고칠 땐 esc 를 빼먹지 말 것. */
          `<span style="color:var(--sub);font-size:12.5px"> ${i.s}</span>` +
          (i.tel !== undefined ? `<span class="telrow">${전화(i.tel)}</span>` : '') +
          `</span></li>`).join('')}</ol>`
      : `<div class="none">이날은 비어 있습니다.</div>`);
  box.classList.add('on');
}

$('grid').addEventListener('click', ev => {
  const c = ev.target.closest('.cell');
  if (!c || c.classList.contains('off')) return;
  sel = sel === c.dataset.ymd ? '' : c.dataset.ymd;
  renderCal();
});

async function loadCal(y, m) {
  curY = y; curM = m; sel = '';
  $('calmon').textContent = `${y}년 ${m}월 · 불러오는 중`;
  try {
    const d = await (await fetch(feed(`cal=${y}-${String(m).padStart(2, '0')}`))).json();
    cal = d.ok ? d : { 날들: [] };
    if (!d.ok) $('calmon').textContent = `${y}년 ${m}월 · 못 불러옴`;
  } catch { cal = { 날들: [] }; }
  renderCal();
}
const shift = n => { let y = curY, m = curM + n;
  if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } loadCal(y, m); };
$('prev').onclick = () => shift(-1);
$('next').onclick = () => shift(1);
$('now').onclick = () => loadCal(Math.floor(TODAY / 10000), Math.floor(TODAY / 100) % 100);

/* ── 목록 ─────────────────────────────────────────────── */
const stat = (label, color, value, unit) => `<div class="stat">
  <div class="lb" style="color:${color}"><i></i>${label}</div>
  <div class="vl">${value}${unit ? `<span>${unit}</span>` : ''}</div></div>`;

/* ── 화면 전환 ────────────────────────────────────────
   ⚠ 고른 탭을 이 기기에 적어 둔다. 달력을 보려고 열었는데 매번 첫 탭으로 돌아가면
     결국 또 한 번씩 누르게 된다. */
const TABS = ['cal', 'book', 'set'];
function goTab(name) {
  if (!TABS.includes(name)) name = 'cal';
  TABS.forEach(t => $('pane-' + t).hidden = (t !== name));
  document.querySelectorAll('.bar button').forEach(b =>
    b.classList.toggle('on', b.dataset.tab === name));
  try { localStorage.setItem('fva501tab', name); } catch {}
  scrollTo(0, 0);
}
document.querySelectorAll('.bar button').forEach(b =>
  b.onclick = () => goTab(b.dataset.tab));
goTab((() => { try { return localStorage.getItem('fva501tab'); } catch { return 'cal'; } })());

/* ── 손님 화면 관리 ──────────────────────────────────────
   비밀번호가 바뀌면 여기서 고친다. 스크립트도 페이지도 안 건드린다.
   ⚠ 고칠 수 있는 건 세 가지뿐이다(서버에서도 막아 뒀다).
     아무 속성이나 열어두면 갱신 토큰이나 비밀번호까지 화면에서 갈아치울 수 있게 된다. */
const 손님화면 = 'https://oh501.surge.sh/';
/* ⚠ _ediSX 는 채널 고유 코드다. 검색용 아이디(oh501)와 다르다.
   pf.kakao.com/_oh501 은 우리 채널이 아니라 남의 페이지로 간다. */
const 카카오채널 = 'https://pf.kakao.com/_ediSX';

async function renderGuest() {
  let d;
  try { d = await (await fetch(feed('preview=1'))).json(); } catch { return; }
  if (!d.ok) return;
  const v = d.값 || {};
  /* ⚠ 문의 안내는 한 문장이라 한 줄 칸에 넣으면 끝이 안 보인다.
     긴 것은 여러 줄 칸(textarea)으로, 짧은 것은 그대로 한 줄로 둔다. */
  const row = (k, label, val, ph, 긴글) => `<div class="kv${긴글 ? ' tall' : ''}">
    <label for="f_${k}">${label}</label>
    ${긴글
      ? `<textarea id="f_${k}" rows="3" placeholder="${ph}">${esc(val)}</textarea>`
      : `<input id="f_${k}" value="${esc(val)}" placeholder="${ph}" autocomplete="off">`}
    <button type="button" data-k="${k}">저장</button>
    <span class="said" id="s_${k}"></span></div>`;

  $('guestcard').innerHTML = `<div class="card">
    <h3>손님 화면<span class="r">oh501.surge.sh</span></h3>

    <!-- ⚠ 만능키는 실제 예약이 없어도 손님 화면을 여는 번호다. 손님에게 주면 안 된다.
         그래서 접어두지 않고 여기 적어 두되, 무엇인지 한 줄로 못박아 둔다. -->
    <div class="master">
      <b>🗝 만능키 — 이 손님 화면(oh501.surge.sh)을 여는 관리자 열쇠</b>
      <span class="mk">손님에게 어떻게 보이는지 예약 없이 아무 때나 확인할 수 있습니다.
        직접 넣을 땐 예약번호 <b>${esc(v.MASTER_CODE || '없음')}</b>
        · 휴대폰 뒤 4자리 <b>${esc(v.MASTER_TAIL || '없음')}</b></span>
      <a class="mkbtn" target="_blank" rel="noopener"
         href="https://oh501.surge.sh/#k=${esc(v.MASTER_CODE || '')}.${esc(v.MASTER_TAIL || '')}">🗝 만능키로 손님 화면 열어보기</a>
      <span class="warn2">⚠ 진짜 예약이 없어도 열리는 만능 번호입니다 — 손님에게는 절대 알려주지 마세요.</span>
    </div>

    <details><summary>비밀번호·문의 문구 고치기</summary>
      ${row('DOOR_CODE', '출입문 비번', v.DOOR_CODE || '', '3530')}
      ${row('WIFI_PW', '와이파이 비번', v.WIFI_PW || '', '')}
      ${row('CONTACT_LINE', '문의 안내', v.CONTACT_LINE || '', '손님 안내문 맨 아래에 들어갑니다', true)}
      ${row('MASTER_CODE', '만능키 번호', v.MASTER_CODE || '', '')}
      ${row('MASTER_TAIL', '만능키 뒤4', v.MASTER_TAIL || '', '')}</details>
    <details><summary>손님에게 나가는 안내문 그대로 보기</summary>
      <pre>${esc(d.안내 || '')}</pre></details>
  </div>`;

  $('guestcard').querySelectorAll('button[data-k]').forEach(b => {
    b.onclick = async () => {
      const k = b.dataset.k, val = $('f_' + k).value.trim();
      if (!val) return;
      b.disabled = true; $('s_' + k).textContent = '저장 중';
      try {
        const r = await (await fetch(feed(`set=${k}&val=${encodeURIComponent(val)}`))).json();
        $('s_' + k).textContent = r.ok ? '바꿨습니다' : (r.오류 || '실패');
      } catch { $('s_' + k).textContent = '실패'; }
      b.disabled = false;
      setTimeout(() => { $('s_' + k).textContent = ''; }, 4000);
      renderGuest();
    };
  });
}

function render(d) {
  $('date').textContent = d.updated + ' 기준';

  /* 토큰 만료일 — 늘 보이게. 이게 지나면 자동 안내가 멈춘다. */
  if (d.ok && d.토큰만료일) {
    const 급함 = (d.토큰남은날 ?? 99) <= 7;
    $('token').innerHTML = `<div class="tok${급함 ? ' warn' : ''}"><i>🔑</i><span>` +
      `스페이스클라우드 토큰 <b>${esc(d.토큰만료일)} 만료</b> · ${d.토큰남은날}일 남음` +
      `<br>${esc(d.갱신시점 || '만료 한 주 전')}에 크롬에서 <b>partner.spacecloud.kr</b> 에 ` +
      `로그인한 뒤 「토큰 갱신」이라고 알려주세요. 안 하면 자동 안내가 멈춥니다.` +
      `<br><span style="color:var(--dim)">지금 미리 해도 만료일은 그대로입니다 — ` +
      `로그인한 날부터 다시 30일이라, 늦게 할수록 길어집니다.</span></span></div>`;
  }

  /* 손봐야 하는 것부터 맨 위에. 화면을 열자마자 눈에 들어와야 하는 건 이것뿐이다. */
  const A = [];
  if (!d.ok) {
    A.push(`<div class="warnbox"><b>수치를 못 불러왔습니다.</b><br>${esc(d.오류 || '')}
      <br>토큰이 만료됐다면 크롬에서 <b>partner.spacecloud.kr</b> 에 로그인한 뒤 갱신 토큰을 다시 심어야 합니다.</div>`);
  } else {
    if (/미연결/.test(d.알림톡 || ''))
      A.push(`<div class="warnbox"><b>지금은 문자(LMS)로 자동 안내가 나갑니다.</b>
        알림톡 템플릿은 <b>심사중</b>입니다(2026-08-24 접수) — 승인되면 알림톡이 1순위가 되고,
        실패하면 문자로, 그것도 안 되면 메일로 알려드립니다.
        손님 확인 화면은 <a href="https://oh501.surge.sh/" style="color:var(--ink)">oh501.surge.sh</a>,
        문의는 카카오 채널 <b>오공일501</b>(@oh501) 채팅으로 옵니다.</div>`);
  }
  $('alarm').innerHTML = A.join('');

  const rs = d.예약 || [];
  const 앞으로 = rs.filter(r => !r.지남 && r.상태 === '예약확정');
  const 대기 = 앞으로.filter(r => !r.안내발송 && !r.설치전);
  const 이번달 = rs.filter(r => r.상태 !== '취소환불' &&
    String(r.날짜).slice(0, 7) === `${curY}.${String(curM).padStart(2, '0')}`);

  $('stats').innerHTML =
    stat('다가오는 예약', 'var(--rsv)', num(앞으로.length), '건') +
    stat('안내 안 나간 것', 대기.length ? 'var(--warn)' : 'var(--dim)', num(대기.length), '건') +
    stat(`${curM}월 매출`, 'var(--sub)', num(이번달.reduce((a, r) => a + r.금액, 0)), '원') +
    stat('토큰', (d.토큰남은날 ?? 99) <= 7 ? 'var(--warn)' : 'var(--dim)',
         d.토큰남은날 == null ? '—' : d.토큰남은날, '일 남음');

  /* ⚠ 「설치 전부터 있던 예약」과 「이 시스템이 보낸 예약」은 다르다.
     둘 다 발송 대상에서 빠지지만, 앞의 것은 사람이 직접 챙겨야 한다. */
  const row = r => {
    const pill = r.상태 === '취소환불' ? '<span class="pill done">취소</span>'
      : r.지남 ? '<span class="pill done">이용완료</span>'
      : r.설치전 ? '<span class="pill done">설치 전 · 직접 안내</span>'
      : r.안내발송 ? (발송배지(r) || '<span class="pill ok">안내 나감</span>')
      : '<span class="pill wait">안내 대기</span>';
    return `<li class="row">
      <div class="nm"><b>${esc(r.이름)}</b> ${pill}
        <small>${esc(r.날짜)} · 예약 <b class="rno">${esc(r.id)}</b></small>
        <small class="telrow">${전화(r.연락처)}</small></div>
      <div class="vn">${num(r.금액)}<em>원</em></div></li>`;
  };

  /* ⚠ 날짜만 보면 「오늘 끝난 예약」이 계속 다가오는 칸에 남는다.
     이용이 끝났거나 취소된 것은 날짜와 상관없이 지난 쪽으로 보낸다.
     (안 그러면 위 타일의 3건과 아래 목록의 4건이 어긋나 보인다.) */
  const 끝난 = r => r.지남 || r.상태 === '이용완료' || r.상태 === '취소환불';
  const 앞 = rs.filter(r => !끝난(r));
  const 뒤 = rs.filter(끝난).reverse();
  $('list').innerHTML =
    `<div class="card"><h3>다가오는 예약<span class="r">${앞.length}건</span></h3>
       ${앞.length ? `<ul>${앞.map(row).join('')}</ul>` : '<div class="none">예정된 예약이 없습니다.</div>'}
       <div class="memo">「안내 나감」은 <b>이 시스템이 보냈다</b>는 뜻입니다.
         「설치 전」은 자동화를 켜기 전부터 잡혀 있던 예약이라 <b>직접 안내</b>하셔야 합니다.</div></div>
     <div style="height:12px"></div>
     <div class="card"><details><summary class="sum">지난 예약
         <span class="r">${뒤.length}건</span></summary>
       ${뒤.length ? `<ul>${뒤.slice(0, 20).map(row).join('')}</ul>` : '<div class="none">없습니다.</div>'}
       ${뒤.length > 20 ? `<div class="memo">최근 20건만 보여줍니다.</div>` : ''}</details></div>`;

  $('foot').innerHTML =
    '5분마다 스페이스클라우드에서 새로 읽습니다 · 연락처는 가려서 표시합니다<br>' +
    '달력의 「감독님 일정」과 「청소」는 호스트센터에서 직접 넣은 일정입니다.';
}

if (!KEY) askKey();
else {
  loadCal(Math.floor(TODAY / 10000), Math.floor(TODAY / 100) % 100);
  renderGuest();
  fetch(feed('t=' + Date.now()))
  .then(r => r.json())
  .then(d => { if (d.열쇠필요) { try { localStorage.removeItem(KEYNAME); } catch {} return askKey(); } render(d); })
  .catch(() => {
    $('alarm').innerHTML =
      `<div class="warnbox"><b>연결하지 못했습니다.</b><br>
       Apps Script 웹앱이 내려갔거나 인터넷이 끊겼을 수 있습니다.</div>`;
    $('date').textContent = '연결 실패';
  });
}
</script>
<script>
/* ── 하단 바를 브라우저 UI 위로 들어올린다 ──────────────────────────────
   주소창이 화면 아래에 있는 브라우저(iOS 사파리, 카톡·네이버 인앱)에서는
   「문서가 깔리는 높이(innerHeight)」가 「실제로 보이는 높이(visualViewport.height)」
   보다 크다. 그 차이만큼 bottom:0 이 화면 밖으로 내려가 바가 가려진다.
   CSS 로는 알 수 없는 값이라 여기서 재서 --lift 로 넘긴다.
   ⚠ env(safe-area-inset-bottom) 은 이 경우 0 이라 도움이 안 된다.
   ⚠ 키보드가 올라와도 같은 차이가 생기는데 그건 200px 을 넘는다.
      그때는 들어올리는 대신 감춘다 — 입력칸 위에 올라타 앉으면 더 나쁘다. */
(function () {
  var vv = window.visualViewport;
  if (!vv) return;
  var 재기 = function () {
    var 덮임 = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    var 키보드 = 덮임 > 200;
    document.documentElement.style.setProperty('--lift', (키보드 ? 0 : 덮임) + 'px');
    document.body.classList.toggle('kb', 키보드);
  };
  vv.addEventListener('resize', 재기);
  vv.addEventListener('scroll', 재기);
  window.addEventListener('orientationchange', function () { setTimeout(재기, 250); });
  재기();
})();
</script>
