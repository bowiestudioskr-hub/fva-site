<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>FVA 앰버서더</title>
<link rel="icon" href="/favicon.ico">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- ⚠ black-translucent + 매니페스트 display:standalone 은 서로 부딪힌다 —
     내용이 상태바 밑으로 파고든다. black 이 맞다(501 에서 같은 문제를 이렇게 고쳤다).
     ⚠ iOS 는 이 값을 **설치할 때** 캐시한다 — 이미 깔린 앱은 지우고 다시 깔아야 바뀐다. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="FVA 앰버서더">
<meta name="theme-color" content="#0A0A0A">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest-amb.webmanifest">
<style>
  /* ⚠ 검색에 안 뜬다(noindex). robots.txt·sitemap 에는 적지 말 것.
     ⚠ 저장소가 공개다. 이름·연락처·피드백은 **이 파일에 없다** —
       Apps Script 속성에만 두고 비밀번호(#k=)를 지나온 요청에만 내준다.
     오공일501 예약 현황과 같은 디자인 얼개다. 검은 바탕, 큰 숫자, 선 대신 면. */
  :root{
    --bg:#000; --card:#1C1C1E; --card2:#2C2C2E; --card3:#242427;
    --ink:#fff; --sub:#98989F; --dim:#636366; --line:#2C2C2E;
    --ok:#2CFF05; --wait:#FFD60A; --done:#8E8E93; --warn:#FF375F; --acc:#A78BFA;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  /* ⚠ 이 앱은 black-translucent 로 설치돼 있어 **화면 맨 위(상태바 밑)부터** 그린다.
       그래서 스크롤한 내용이 시계·배터리·다이나믹아일랜드 뒤로 비쳐 보인다
       (2026-09-01 사용자 확인 — 501 때와 똑같은 함정이다).
     · 아래 meta 를 black 으로 바꿔 뒀지만 그건 **앱을 다시 깔아야** 먹는다.
     · 그래서 안전지대 높이만큼 불투명한 띠를 덮는다 — 지금 깔린 앱에서도 바로 듣는다.
     · black 으로 다시 깔면 safe-area-inset-top 이 0 이 되어 이 띠는 저절로 사라진다. */
  body::before{content:'';position:fixed;top:0;left:0;right:0;
    height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60;pointer-events:none}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',Pretendard,system-ui,sans-serif;
    font-size:15px;line-height:1.5;padding:22px 16px 84px;font-variant-numeric:tabular-nums}
  .wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

  .hd .row{display:flex;align-items:flex-end;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
  h1{font-size:24px;letter-spacing:-.03em;font-weight:800;white-space:nowrap}
  .date{color:var(--dim);font-size:13px;white-space:nowrap}
  .lede{color:var(--sub);font-size:13px;margin-top:5px}
  .lede a{color:inherit}

  .card{background:var(--card);border-radius:16px;overflow:hidden}
  .card>h3{font-size:15px;font-weight:800;padding:15px 16px 4px;display:flex;align-items:center;gap:8px}
  .card>h3 .r{margin-left:auto;font-weight:600;color:var(--dim);font-size:12px}
  .meta{padding:0 16px 12px;font-size:12.5px;color:var(--sub);line-height:1.6}
  .meta a{color:var(--acc);text-decoration:none}
  .meta .sp{display:block;color:var(--dim);margin-top:3px}
  .meta .sp b{color:var(--wait)}

  .prog{display:flex;gap:4px;padding:0 16px 13px}
  .prog i{flex:1;height:5px;border-radius:3px;background:var(--card3)}
  .prog i.done{background:var(--ok)} .prog i.now{background:var(--wait)}
  /* 색이 무슨 뜻인지 글자로도 적어 준다 */
  .cnt{display:flex;gap:12px;flex-wrap:wrap;padding:0 0 4px;font-size:11.5px;font-weight:700;letter-spacing:-.02em}
  .cnt b{display:inline-flex;align-items:center;gap:5px;font-weight:700}
  .cnt b::before{content:'';width:9px;height:5px;border-radius:3px;background:currentColor}
  .cnt .c-done{color:var(--ok)} .cnt .c-now{color:var(--wait)} .cnt .c-left{color:var(--dim)}

  .vid{padding:12px 16px;box-shadow:inset 0 .5px 0 rgba(255,255,255,.07)}
  /* ⚠ 두 가지를 같이 막아야 한다.
       · word-break 기본값은 「감/독」처럼 낱말을 쪼갠다 → keep-all
       · 단추까지 한 줄에 밀어넣으면 제목 칸이 눌려 **한 줄에 한 낱말씩** 떨어진다
         (2026-09-01 실측) → 제목에 최소 폭을 주고 단추는 모자라면 아랫줄로 내린다. */
  .vid .t{display:flex;align-items:flex-start;gap:6px 9px;font-size:14px;font-weight:700;
    flex-wrap:wrap;word-break:keep-all;line-height:1.4}
  .vid .t .nm{flex:1 1 58%;min-width:0;display:flex;flex-direction:column;gap:3px}
  .vid .t .nm b{font-weight:700}
  .vid .t small{font-weight:600;color:var(--dim);font-size:11.5px;white-space:nowrap}
  .vid .t .tb{display:flex;gap:6px;margin-left:auto;flex-shrink:0}
  .pill{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap}
  .pill.대기{background:var(--card2);color:var(--dim)}
  .pill.검수중{background:#3A3210;color:var(--wait)}
  .pill.수정요청{background:#3B0C16;color:var(--warn)}
  .pill.게시완료{background:#0C3B1E;color:var(--ok)}

  /* ⚠ 드라이브 조작판(재생·시간·설정 줄)이 **그림 위를 덮는다** — 자막이 가려진다.
       상자를 9:16 보다 조금 더 길게 잡으면 영상은 폭에 맞춰 들어앉고 조작판은
       아래 검은 자리에 앉는다. 실측(2026-09-01): +120px 이면 그림을 완전히 비켜난다.
     ⚠ aspect-ratio 대신 padding 으로 잡는다 — 「비율 + 고정 px」를 같이 줘야 해서다.
       177.78% = 16/9. max-height 는 주면 안 된다(padding 은 안 깎이고 iframe 만 잘린다). */
  .player{margin-top:10px;border-radius:11px;overflow:hidden;background:#000;
          width:100%;height:0;padding-bottom:calc(177.78% + var(--gutter,120px))}
  /* ⚠ 아이폰에서 드라이브가 띄우는 조작판은 **250px 쯤을 덮는다** — 데스크탑 판(40px)과 딴판이다
       (2026-09-01 실측). 검은 자리를 250px 두는 건 흉하다.
     그래서 **틀 안쪽을 두 배로 잡고 절반으로 줄여 그린다.**
       · 드라이브는 넓은 화면으로 알고 조작판을 작게(또는 데스크탑 판으로) 그린다 → 화면에선 절반 크기
       · 덤으로 안쪽이 넓어져 드라이브가 더 좋은 화질을 내려준다
     ⚠ 눌리는 자리는 브라우저가 알아서 맞춰 준다. 다만 단추도 같이 작아지니 너무 줄이지 말 것. */
  .player iframe{position:absolute;top:0;left:0;
    width:calc(100% / var(--zoom,1));height:calc(100% / var(--zoom,1));
    transform:scale(var(--zoom,1));transform-origin:0 0;
    border:0;display:block;background:#000}
  /* 「원본 크게」 — 전에는 영상 위에 겹쳐 뒀는데, 이제 영상이 그대로 재생되니
     재생 단추와 조작 막대를 가린다. 제목 줄로 옮겼다. 최고 화질로 볼 때 쓴다. */
  .player{position:relative}
  .opendrive{
    display:inline-flex; align-items:center; gap:5px;
    background:var(--card2); color:var(--sub); text-decoration:none;
    font-size:11.5px; font-weight:700; letter-spacing:-.02em;
    padding:5px 10px; border-radius:999px; white-space:nowrap;
  }
  .opendrive:active{ opacity:.6 }
  /* 영상은 폰에서 647px 을 먹는다. 문안을 읽을 때는 접어 두면 점검표와 초안이 한 화면에 들어온다. */
  /* 같은 영상을 두 벌 올린 경우 목록에서 빼려고 쓴다. 드라이브 원본은 그대로다. */
  .vid .hide{background:var(--card2);color:var(--dim);border:0;border-radius:999px;
    padding:5px 10px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .vid .fold{background:var(--card2);color:var(--sub);border:0;border-radius:999px;
    padding:5px 10px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .vid.folded .player{display:none}
  .vid .fb{width:100%;margin-top:9px;background:#0F0F11;color:var(--ink);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font:inherit;font-size:13px;line-height:1.65;resize:vertical;min-height:88px;
    white-space:pre-wrap;overflow:hidden}
  /* ── 기준 점검표 · 제안 피드백 ──────────────────────
     승아님 1주 차 때 짚은 잣대를 매 회차 똑같이 들이댄다. 찍으면 서버가 그 판정대로 문안을 쓴다.
     ⚠ 문안 만들기는 구글 서버에서 돈다 — 맥이 꺼져 있어도 만들어진다. */
  .judge{margin-top:9px;background:#0F0F11;border:1px solid var(--line);border-radius:10px}
  .judge>summary{list-style:none;cursor:pointer;padding:9px 12px;font-size:12.5px;font-weight:800;
    letter-spacing:-.02em;display:flex;gap:7px;align-items:baseline}
  .judge>summary::-webkit-details-marker{display:none}
  .judge>summary small{font-weight:500;color:var(--dim);letter-spacing:-.01em}
  .jgrid{padding:0 12px}
  /* ⚠ 좁은 화면에서 이름과 버튼을 한 줄에 두면 「15~20초 안에 / 시작되나」처럼 눌려 깨진다.
       세로로 쌓고 버튼은 폭을 3등분한다 — 손가락으로 누르기도 쉽다. */
  .jrow{padding:9px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
  .jh{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
  .jrow b{font-size:12.5px;letter-spacing:-.02em;white-space:nowrap}
  .jrow small{color:var(--dim);font-size:11px;letter-spacing:-.01em;word-break:keep-all}
  .jbtn{display:flex;gap:5px}
  .jbtn button{flex:1;background:var(--card2);color:var(--dim);border:1px solid var(--line);
    border-radius:7px;padding:7px 4px;font:inherit;font-size:11.5px;font-weight:700;
    cursor:pointer;white-space:nowrap}
  .jbtn button.on[data-v=ok]{background:#0C3B1E;color:var(--ok);border-color:transparent}
  .jbtn button.on[data-v=need]{background:#3B0C16;color:var(--warn);border-color:transparent}
  .jbtn button.on[data-v=na]{background:#26262A;color:var(--ink);border-color:transparent}
  .jm{width:100%;box-sizing:border-box;background:#151517;color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:6px 9px;font:inherit;font-size:11.5px;letter-spacing:-.01em}
  .jm:placeholder-shown{opacity:.75}
  .jmemo{width:calc(100% - 24px);box-sizing:border-box;margin:8px 12px 0;background:#151517;color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:12px;
    line-height:1.6;min-height:54px;resize:vertical}
  .mk{margin:8px 12px 12px;background:#fff;color:#000;border:0;border-radius:9px;
    padding:9px 14px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
  .mk:disabled{opacity:.5}
  .mksaid{font-size:11.5px;color:var(--dim)}
  .draft{margin-top:9px;border:1px solid #1E3A2A;background:#0B1710;border-radius:10px;overflow:hidden}
  .dh{display:flex;gap:4px 8px;align-items:center;padding:9px 11px;background:#0E1F15;flex-wrap:wrap}
  .dh b{font-size:12.5px;letter-spacing:-.02em;color:var(--ok)}
  .dh small{font-size:11px;color:var(--dim);flex:1;min-width:120px;white-space:nowrap}
  .dh .use,.dh .cp{background:var(--ok);color:#04240F;border:0;border-radius:8px;padding:6px 11px;
    font:inherit;font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap}
  .dh .cp{background:#1E3A2A;color:#9FD9BA}
  /* ⚠ max-height 를 주면 상자 안에 또 스크롤이 생겨 한 번에 안 보인다(사용자 지적, 2026-09-01).
       전부 펼쳐 둔다 — 스크롤은 페이지 하나로 끝나야 한다. */
  .dtxt{margin:0;padding:11px 13px;font:inherit;font-size:12.5px;line-height:1.62;
    white-space:pre-wrap;word-break:keep-all;color:#CFE6D8}
  .row2{display:flex;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .row2 select,.row2 button{background:var(--card2);color:var(--ink);border:0;border-radius:9px;
    padding:8px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
  .row2 button.save{background:#fff;color:#000}
  .row2 .said{font-size:12px;color:var(--ok)}
  .none{color:var(--dim);font-size:13px;padding:14px 16px}

  /* ── 사람·주차 접기 (2026-08-24) ── */
  details.person{background:var(--card);border-radius:16px;overflow:hidden}
  details.person>summary{list-style:none;cursor:pointer;padding:15px 16px 13px}
  details.person>summary::-webkit-details-marker{display:none}
  details.person>summary:hover{background:rgba(255,255,255,.035)}
  .tgl{margin-left:10px;font-size:12px;font-weight:800;color:#fff;
       background:#34343B;border:1px solid #47474F;border-radius:99px;padding:6px 13px;
       white-space:nowrap}
  .tgl::after{content:'영상 펼치기 ▾'}
  details.person[open] .tgl{background:#fff;color:#000;border-color:#fff}
  details.person[open] .tgl::after{content:'접기 ▴'}
  .psum .arr{width:22px;height:22px;display:grid;place-items:center;background:#2C2C31;
             border-radius:99px;font-size:10px}
  .psum{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800}
  .psum .arr{color:var(--dim);font-size:11px;transition:transform .18s}
  details.person[open]>summary .arr{transform:rotate(90deg)}
  .psum .r{margin-left:auto;font-weight:600;color:var(--dim);font-size:12px}
  .nbadge{font-size:10px;font-weight:800;background:var(--warn);color:#fff;
          border-radius:99px;padding:2px 8px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .chip{font-size:11px;font-weight:700;color:var(--sub);background:var(--card2);
        border-radius:99px;padding:3px 10px}
  .chip b{color:var(--ink)}
  .chip.new{background:#3B0C16;color:#FF375F}
  .chip.new b{color:#FF375F}

  details.week{box-shadow:inset 0 .5px 0 rgba(255,255,255,.07)}
  details.week>summary{list-style:none;cursor:pointer;padding:12px 16px;font-size:13px;
    font-weight:700;display:flex;align-items:center;gap:9px}
  details.week>summary::-webkit-details-marker{display:none}
  details.week>summary:hover{background:rgba(255,255,255,.035)}
  details.week>summary .arr{width:18px;height:18px;display:grid;place-items:center;
    background:#2C2C31;border-radius:99px}
  details.week>summary .arr{color:var(--dim);font-size:10px;transition:transform .18s}
  details.week[open]>summary .arr{transform:rotate(90deg)}
  details.week>summary small{color:var(--dim);font-weight:600;font-size:11.5px}
  details.week>summary .r{margin-left:auto;color:var(--dim);font-weight:600;font-size:12px}

  /* 영상 한 줄 — 오른쪽으로 스크롤 */
  .vrow{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 16px;
        scroll-snap-type:x proximity;scrollbar-width:thin}
  .vrow .vid{flex:0 0 340px;width:340px;padding:0;box-shadow:none;scroll-snap-align:start}

  .warnbox{background:var(--card);border-radius:14px;border-left:3px solid var(--warn);
           padding:13px 16px;font-size:13px;color:var(--sub);line-height:1.55}
  .warnbox b{color:var(--ink)}
  footer{color:var(--dim);font-size:12px;padding-top:4px;line-height:1.7}
  @media (max-width:560px){
    body{padding:calc(18px + env(safe-area-inset-top)) 13px calc(70px + env(safe-area-inset-bottom))}
    h1{font-size:20px}
    /* ⚠ iOS 는 글자 16px 미만 입력칸에 초점이 가면 화면을 확대해버린다 */
    .vid .fb{font-size:16px}
    .row2 select,.row2 button{font-size:16px;padding:10px 14px}
    /* ⚠ 가로로 늘어놓으면 390px 화면에서 영상이 250px 밖에 안 된다(2026-09-01 실측).
         릴스는 세로 영상이라 폭이 곧 화질이다 — 폰에서는 세로로 펴고 화면 폭을 다 쓴다.
         높이는 9:16 이 정하게 두고 자르지 않는다. */
    .vrow{display:block;overflow-x:visible;padding:2px 0 6px;scroll-snap-type:none}
    .vrow .vid{flex:none;width:auto;padding:0 0 20px}
    .vrow .vid + .vid{border-top:1px solid var(--line);padding-top:18px}
    /* 폰에서만 절반으로 줄여 그린다 — 데스크탑은 원래도 조작판이 얇다.
       조작판 자리도 조금 더 준다: 아이폰 판은 줄여도 데스크탑 판보다 크다. */
    .player{--zoom:.5;--gutter:150px}

    /* ⚠ iOS 는 글자 16px 미만 입력칸에 초점이 가면 화면을 통째로 확대해버린다.
         점검표 칸·메모 칸도 입력칸이다 — 빠뜨리면 찍을 때마다 화면이 튄다. */
    .jm,.jmemo{font-size:16px}
    /* ⚠ 손가락은 44px 이 필요하다(애플 기준). 데스크탑 크기 그대로 두면 26~29px 밖에 안 된다. */
    .jbtn button{padding:12px 6px;font-size:13px}
    .mk{padding:13px 18px;font-size:13.5px}
    .dh .cp,.dh .use{padding:13px 14px;font-size:13px}
    .vid .fold,.vid .hide,.opendrive{padding:13px 13px;font-size:13px}
    .row2 select,.row2 button{padding:12px 15px}
    .judge>summary{padding:13px 12px}
  }

  /* ── 마감 일정표 — 사람마다 한 줄. 칸 = 약정 한 편(2주), 점 = 수업, 세로선 = 오늘 ── */
  .plan{padding:4px 16px 16px;display:flex;flex-direction:column;gap:18px}
  .tl-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}

<script>
const FEED = 'https://script.google.com/macros/s/AKfycbxWKkz5rS112O8ePWYgFqEl9S5Cb-gZjLcxS3eTpnhzloGA2dtr3rN00rOso-0Mwo0/exec';
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ⚠ 비밀번호 없이 연다(2026-08-23 지시). adminmonitor 와 같은 방식이다.
   주소를 아는 사람은 누구나 열고 **피드백도 고칠 수 있다.** 주소를 아무 데나 적지 말 것.
   ⚠ 그래서 앰버서더 연락처는 이 화면에 내려보내지 않는다 — 남의 개인정보다.
     번호는 계약서 폴더(~/Documents/FVA/20260822_앰버서더/)에 있다. */
const feed = q => `${FEED}?${q}`;
/* 저장은 POST 로 보낸다 — 피드백이 쌓이면 한글이 주소에서 9배로 부풀어 GET 은 구글이 400 을 뱉는다
   (2026-09-30 주환님 2편에서 18KB 로 막힘). text/plain 이라 사전요청(CORS preflight)이 없다. */
const 저장보내기 = (who, 사람) => fetch(FEED, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
  body: JSON.stringify({ amb: 'save', who, data: JSON.stringify(사람) }) }).then(r => r.json());

const 상태들 = ['대기', '검수중', '수정요청', '게시완료'];

/* 승아님 1주 차 피드백에서 실제로 짚었던 항목들이다. 매 회차 같은 잣대로 본다.
   ⚠ 이 표는 서버(Code.gs AMB_기준)에도 같은 내용이 있다. 한쪽만 고치지 말 것. */
const 기준표 = [
  ['brand',  'FVA 등장 시점',  '15~20초 안에 시작되나'],
  ['title',  '첫 타이틀·커버', '그린 포인트 + 커버 지정'],
  ['sign',   '간판·외관',      'FVA 간판이 화면 중심인가'],
  ['merit',  '수업 장점',      '느낀 점이 직접 드러나나'],
  ['ending', '마무리 문구',    'FVA와 연결되나'],
  ['shots',  '화면 구성',      '앵글이 다양한가'],
  ['tone',   '솔직한 톤',      '광고처럼 안 느껴지나'],
  ['tempo',  '길이·템포',      '늘어지는 구간 없나'],
];


/* ── 마감 일정표 (2026-09-28) ──────────────────────────────────────────
   계약: 수업 12주 + 1주(마무리·게시). 2주에 1편 → 편수 칸. 마지막 칸 마감 = 활동 종료일.
   칸 채우기는 **순서대로** 센다: 게시완료된 편을 날짜순으로 1편·2편…에 앉히고,
   그 뒤에 올라와 아직 안 끝난 영상이 있으면 다음 칸을 「검수·수정 중」으로 칠한다.
   (아래 주차 묶음은 올린 날짜 기준이라 늦게 낸 편이 다음 주차로 넘어가 보일 수 있다 — 일정표가 기준.) */
const DAY = 864e5;
const 날 = s => new Date(String(s).slice(0, 10) + 'T00:00:00');
const 더하기 = (d, n) => new Date(d.getTime() + n * DAY);
const 요일 = '일월화수목금토';
const 짧게 = d => `${d.getMonth() + 1}/${d.getDate()}(${요일[d.getDay()]})`;
/* 사람별 예외 — 계약 특약·합의된 일정. 이름·연락처는 넣지 않는다(저장소 공개). */
const 일정예외 = {
  /* 2026-09-28 일정 조정 — 남은 기간(~계약 종료)으로 다시 쪼갬. [칸 시작, 칸 끝, 마감(칸 끝과 다를 때)] */
  a2: { 메모: '일정 변경 — 2편 수정본과 3편을 10/9(금)까지 함께 올려주세요', 칸: [['2026-08-22', '2026-09-04'],
        ['2026-09-05', '2026-09-25', '2026-10-09'], ['2026-09-26', '2026-10-09'],
        ['2026-10-10', '2026-10-23'], ['2026-10-24', '2026-11-06'], ['2026-11-07', '2026-11-14']] },

    const b = new Date(a); b.setDate(b.getDate() + 주 - 1);
    const 꼴 = t => `${t.getMonth() + 1}/${t.getDate()}`;
    return `${꼴(a)}~${꼴(b)}`;
  };

  $('list').innerHTML = 보임.map((p, pi) => {
    const 머리 = (pi === 0 || 묶음키(보임[pi - 1]) !== 묶음키(p)) ? `<h2 class="grp">${esc(묶음키(p))} <small>계약서 서명 ${보임.filter(q => 묶음키(q) === 묶음키(p) && 서명본(q).서명).length} / ${보임.filter(q => 묶음키(q) === 묶음키(p)).length}</small></h2>` : '';
    /* ⚠ 같은 영상을 두 벌 올리는 일이 있다(배속본/원본). 화면이 지저분해지니 숨길 수 있게 한다.
         **드라이브 원본은 건드리지 않는다** — 목록에서만 뺀다. 되살리려면 서버에서 숨김을 지운다. */
    const 숨김 = p.숨김 || {};
    const files = (p.파일 || []).filter(f => !숨김[f.id]);
    const 피드백 = p.피드백 || {};
    /* ⚠ 칸 하나 = **약정 한 편**이지 파일 하나가 아니다.
         「원본 + 수정 1차」는 같은 한 편인데 전에는 파일 수로 세서 2칸이 칠해졌다
         (2026-09-02 사용자 지적). **주차로 묶어서** 센다.
         한 주차 안에 게시완료가 하나라도 있으면 그 주는 끝난 것으로 본다. */
    const 주차의 = f => 주차잡기(p.개강, f.올린날, 주기(p)).n;
    const 주모음 = {};
    for (const f of files) {
      const n = 주차의(f);
      const 났 = (피드백[f.id] || {}).상태 === '게시완료';
      주모음[n] = 주모음[n] || { 끝: false };
      if (났) 주모음[n].끝 = true;
    }
    /* 영상 말고 다른 방식으로 낸 회차(블로그 등). 드라이브에 파일이 없어 따로 적어 둔다.
       p.외부 = { "2": { 방식:'블로그', 상태:'게시완료', 메모, 링크 } } — 2026-09-24 승아님 2주차가 처음. */
    const 외부 = p.외부 || {};
    for (const n of Object.keys(외부)) {
      주모음[n] = 주모음[n] || { 끝: false };
      if (외부[n].상태 === '게시완료') 주모음[n].끝 = true;
    }
    const 주들번호 = Object.keys(주모음);
    const 끝난것 = 주들번호.filter(n => 주모음[n].끝).length;
    const 진행중 = 주들번호.length - 끝난것;
    const 낸편수 = 주들번호.length;
    const bar = Array.from({ length: p.편수 || 6 }, (_, i) =>
      `<i class="${i < 끝난것 ? 'done' : i < 낸편수 ? 'now' : ''}"
          title="${i < 끝난것 ? '게시완료' : i < 낸편수 ? '검수 중' : '아직 안 들어옴'}"></i>`).join('');
    const 셈 = `<span class="cnt">` +
      `<b class="c-done">게시완료 ${끝난것}</b>` +
      (진행중 ? `<b class="c-now">검수 중 ${진행중}</b>` : '') +
      `<b class="c-left">남은 ${Math.max(0, (p.편수 || 6) - 낸편수)}</b></span>`;

    /* 주차별로 묶는다 */
    const 묶음 = {};
    for (const f of files) {
      const { n } = 주차잡기(p.개강, f.올린날, 주기(p));
      (묶음[n] = 묶음[n] || []).push(f);
    }
    const 새거 = f => !본것[f.id];
    const 새수 = files.filter(새거).length;

    const 주차목록 = [...new Set([...Object.keys(묶음), ...Object.keys(외부)])].sort((a, b) => a - b);
    const 칩 = 주차목록.map(n => {
      if (!묶음[n]) return `<span class="chip">${n}주차 <b>${esc(외부[n].방식 || '기타')}</b> · ${esc(외부[n].상태 || '')}</span>`;
      const 새 = 묶음[n].filter(새거).length;
      return `<span class="chip${새 ? ' new' : ''}">${n}주차 <b>${묶음[n].length}편</b>${새 ? ' · 새 ' + 새 : ''}</span>`;
    }).join('') || '<span class="chip">아직 영상 없음</span>';

    const 주들 = 주차목록.map(n => {
      if (!묶음[n]) {
        const x = 외부[n];
        return `<details class="week"><summary><span class="arr">▶</span>
            ${n}주차 <small>${주기간(p.개강, +n, 주기(p))}</small>
            <span class="r">${esc(x.방식 || '기타')}</span></summary>
          <div class="none"><span class="pill ${esc(x.상태 || '')}">${esc(x.상태 || '')}</span>
            ${esc(x.방식 || '')}로 완료 — 드라이브 영상 없음${x.메모 ? ' · ' + esc(x.메모) : ''}
            ${x.링크 ? `<a href="${esc(x.링크)}" target="_blank" rel="noopener" style="color:var(--acc)">열기</a>` : ''}</div></details>`;
      }
      const 새 = 묶음[n].filter(새거).length;
      const vids = 묶음[n].map(f => {
        const fb = 피드백[f.id] || {};
        const st = fb.상태 || '검수중';
        return `<div class="vid" data-p="${esc(p.id)}" data-f="${esc(f.id)}">
          <div class="t"><span class="pill ${esc(st)}">${esc(st)}</span>
            <span class="nm"><b>${esc(f.이름)}</b>
              <small>${esc(f.올린날)} · ${esc(f.크기)}</small></span>
            <span class="tb"><button type="button" class="fold">영상 접기</button>
              <button type="button" class="hide">숨기기</button>
              <a class="opendrive" href="https://drive.google.com/file/d/${esc(f.id)}/view"
                 target="_blank" rel="noopener">원본 크게</a></span></div>
          <div class="player">
            <!-- ⚠ 원본 파일을 <video> 로 직접 트는 것은 **포기했다**(2026-09-01).
                 · 크롬은 ORB 로 끊는다 — 드라이브의 모든 주소가 application/octet-stream 이다
                   (uc?export=view · usercontent/download · docs/uc 전부 확인).
                 · 사파리에서만 시도하게 해 봤더니 **아이폰에서 재생이 아예 안 됐다**(사용자 확인).
                 확실히 도는 드라이브 미리보기 틀 하나만 쓴다. 최고 화질은 「원본 크게」로 연다. -->
            <iframe data-src="https://drive.google.com/file/d/${esc(f.id)}/preview"
            allow="autoplay" loading="lazy"></iframe>
            <!-- 영상이 로그인 없이는 안 보이던 문제 — 앰버서더 본인 소유 파일이라 「비공개」였고,
                 아이폰은 iframe 안의 남의 쿠키를 막아서(ITP) 틀 안에서는 영영 로그인이 안 됐다.
                 2026-09-01 에 상위 폴더를 「링크가 있는 모든 사용자 · 보기」로 바꿔 풀었다.
                 앞으로 올라오는 영상도 폴더 권한을 물려받아 바로 재생된다.
                 ⚠ 그래서 이 주소를 아는 사람은 누구나 영상을 볼 수 있다. 아무 데나 적지 말 것.
                 「브라우저에서 열기」는 큰 화면으로 볼 때 쓰라고 남겨 둔다. -->
          </div>
          <details class="judge"><summary>기준 점검표 <small>보고 찍으면 그대로 문안이 됩니다</small></summary>
            <div class="jgrid">${기준표.map(([k, 이름, 잣대]) => `
              <div class="jrow" data-k="${k}">
                <div class="jh"><b>${이름}</b><small>${잣대}</small></div>
                <div class="jbtn"><button type="button" data-v="ok">좋음</button><button
                  type="button" data-v="need">보완</button><button
                  type="button" data-v="na">해당없음</button></div>
                <input class="jm" placeholder="타임코드·한마디 (예: 17~18초 간판에 카페 간판이 같이 잡힘)"></div>`).join('')}
            </div>
            <textarea class="jmemo" placeholder="그 밖에 본 것 — 흐름, 자막, 특이사항. 적을수록 문안이 정확해집니다"></textarea>
            <button type="button" class="mk">✨ 제안 피드백 만들기</button>
            <span class="mksaid"></span>
          </details>
          ${(p.초안 || {})[f.id] ? `<div class="draft"><div class="dh">
              <b>제안 피드백</b><small>${esc((p.초안[f.id].때 || ''))}${
                p.초안[f.id].본것 ? ' · 점검표 반영' : ' · 영상 확인 전 초안'}</small>
              <button type="button" class="cp">복사</button>
              <button type="button" class="use">채우기</button></div>
            <pre class="dtxt">${esc(p.초안[f.id].글 || '')}</pre></div>` : ''}
          <textarea class="fb" placeholder="피드백을 적어 두면 여기 남습니다">${esc(fb.메모 || '')}</textarea>
          <div class="row2">
            <select class="st">${상태들.map(x =>
              `<option${x === st ? ' selected' : ''}>${x}</option>`).join('')}</select>
            <button type="button" class="save">저장</button>
            <button type="button" class="cpfb">복사</button>
            <span class="said"></span>
          </div></div>`;
      }).join('');
      return `<details class="week"><summary><span class="arr">▶</span>
          ${n}주차 <small>${주기간(p.개강, +n, 주기(p))}</small>
          ${새 ? `<span class="nbadge">NEW ${새}</span>` : ''}
          <span class="r">${묶음[n].length}편</span></summary>
        <div class="vrow">${vids}</div></details>`;
    }).join('') || `<div class="none">아직 올라온 영상이 없습니다.
        <a href="${esc(p.드라이브)}" target="_blank" rel="noopener"
           style="color:var(--acc)">드라이브 열기</a></div>`;

    return 머리 + `<details class="person" data-ids="${esc(files.map(f => f.id).join(','))}">
      <summary><div class="psum"><span class="arr">▶</span>${esc(p.이름)}
          ${새수 ? `<span class="nbadge">NEW ${새수}</span>` : ''}
          <span class="r">${끝난것} / ${p.편수}편</span><span class="tgl"></span></div>
        <div class="meta" style="padding:4px 0 0">
          <a href="https://instagram.com/${esc(p.인스타)}" target="_blank" rel="noopener">@${esc(p.인스타)}</a>
          · <span class="nw">${esc(p.요일)}</span> · <span class="nw">${esc(String(p.개강).slice(5).replace('-', '/').replace(/^0/, ''))} ~ ${esc(String(p.종료).slice(5).replace('-', '/').replace(/^0/, ''))}</span>
          <span class="sp">특약 — ${esc(p.특약)}</span></div>
        ${바로가기(p)}
        <div class="prog" style="padding:10px 0 2px">${bar}</div>
        ${셈}
        <div class="chips">${칩}</div></summary>
      ${주들}</details><div style="height:14px"></div>`;
  }).join('');

  /* 영상 접기 — 어느 카드를 접어 뒀는지 기기에 기억해 둔다 */
  let 접은것 = {}; try { 접은것 = JSON.parse(localStorage.getItem('amb_fold') || '{}'); } catch (e) {}
  document.querySelectorAll('.vid').forEach(box => {
    const b = box.querySelector('.fold'); if (!b) return;
    const 칠하기 = () => { b.textContent = box.classList.contains('folded') ? '영상 펼치기' : '영상 접기'; };
    if (접은것[box.dataset.f]) box.classList.add('folded');
    칠하기();
    b.onclick = () => {
      box.classList.toggle('folded');
      접은것[box.dataset.f] = box.classList.contains('folded') ? 1 : 0;
      try { localStorage.setItem('amb_fold', JSON.stringify(접은것)); } catch (e) {}
      칠하기();
    };
  });

  /* 주차를 펼칠 때에만 영상을 붙인다 — 접힌 iframe 수십 개가 한꺼번에 안 불리게 */
  document.querySelectorAll('details.week').forEach(w => {
    w.addEventListener('toggle', () => {
      if (!w.open) return;
      w.querySelectorAll('iframe[data-src]').forEach(fr => {
        fr.src = fr.dataset.src; fr.removeAttribute('data-src');
      });
      w.querySelectorAll('.fb').forEach(ta => {
        ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 4) + 'px';
      });
    });
  });

  /* 사람을 펼치면 그 사람 영상은 「본 것」으로 기록 — 다음에 열 때 NEW 가 사라진다 */
  document.querySelectorAll('details.person').forEach(pe => {
    pe.addEventListener('toggle', () => {
      if (!pe.open) return;
      /* 10/6: 펼치면 가장 최근 주차 하나만 열어 영상 하나가 한눈에 — 나머지 주차는 접어 둠(눌러서 열기) */
      const 주 = [...pe.querySelectorAll('details.week')]; 주.forEach((w, i) => { w.open = i === 주.length - 1; });
      주.forEach(w => { const vs = [...w.querySelectorAll('.vid')]; if (vs.length < 2 || w.dataset.all) return;
        vs.forEach((v, i) => { v.style.display = i === vs.length - 1 ? '' : 'none'; });
        if (!w.querySelector('.morev')) { const b = document.createElement('button'); b.type = 'button'; b.className = 'morev'; b.textContent = `이전 영상 ${vs.length - 1}개 보기`;
          b.onclick = () => { w.dataset.all = 1; vs.forEach(v => { v.style.display = ''; }); b.remove(); }; vs[vs.length - 1].before(b); } });
      (pe.dataset.ids || '').split(',').filter(Boolean).forEach(id => { 본것[id] = 1; });
      try { localStorage.setItem('amb_seen', JSON.stringify(본것)); } catch (e) {}
    });
  });

  /* ⚠ 피드백이 길면 칸 안에 갇혀 안 보인다. 내용만큼 늘려 준다. */
  const 늘리기 = ta => { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 4) + 'px'; };
  document.querySelectorAll('.vid .fb').forEach(ta => {
    늘리기(ta); ta.addEventListener('input', () => 늘리기(ta));
  });

  /* 숨기기 — 목록에서만 뺀다. 드라이브 원본은 그대로 둔다. */
  document.querySelectorAll('.vid .hide').forEach(b => b.onclick = async () => {
    const box = b.closest('.vid');
    const 사람 = (d.사람 || []).find(x => x.id === box.dataset.p);
    if (!confirm('이 영상을 목록에서 숨길까요?\n(드라이브 파일은 그대로 있습니다)')) return;
    사람.숨김 = 사람.숨김 || {}; 사람.숨김[box.dataset.f] = 1;
    const 보낼것 = { ...사람 }; for (const k of ['파일', '계약파일', '기타파일', '폴더id']) delete 보낼것[k];
    b.disabled = true; b.textContent = '숨기는 중';
    try {
      await 저장보내기(box.dataset.p, 보낼것);
      box.remove();
    } catch { b.textContent = '실패'; b.disabled = false; }
  });

  /* 복사 — 앰버서더에게는 이 글을 그대로 카톡으로 보낸다. 그래서 붙여넣기가 본 쓰임이다.
     ⚠ clipboard 는 https 에서만 된다. fva.co.kr 은 https 라 괜찮다.
       그래도 막히는 자리(오래된 웹뷰)가 있어 execCommand 로 한 번 더 받아 준다. */
  async function 복사하기(btn, 글) {
    const 되돌리기 = btn.textContent;
    try { await navigator.clipboard.writeText(글); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = 글; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e2) { btn.textContent = '복사 안 됨'; }
      ta.remove();
    }
    if (btn.textContent === 되돌리기) btn.textContent = '복사됨';
    setTimeout(() => { btn.textContent = 되돌리기; }, 1800);
  }
  const 복사붙이기 = b => {
    b.onclick = () => 복사하기(b, b.classList.contains('cpfb')
      ? b.closest('.vid').querySelector('.fb').value
      : b.closest('.draft').querySelector('.dtxt').textContent);
  };
  document.querySelectorAll('.dh .cp, .row2 .cpfb').forEach(복사붙이기);

  /* 기준 점검표 — 세 칸 중 하나만 켜진다 */
  document.querySelectorAll('.jbtn button').forEach(b => b.onclick = () => {
    const 켜짐 = b.classList.contains('on');
    b.parentNode.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    if (!켜짐) b.classList.add('on');
  });

  /* 제안 피드백 만들기 — 구글 서버가 쓴다. 맥이 꺼져 있어도 돈다.
     ⚠ 절대 피드백 칸을 덮지 않는다. 초안은 따로 보여 주고 「채우기」를 눌러야 옮겨진다. */
  document.querySelectorAll('.vid .mk').forEach(b => b.onclick = async () => {
    const box = b.closest('.vid'), said = box.querySelector('.mksaid');
    const 판정 = {};
    box.querySelectorAll('.jrow').forEach(r => {
      const on = r.querySelector('.jbtn button.on');
      if (on) 판정[r.dataset.k] = on.dataset.v;
      const m = r.querySelector('.jm').value.trim();
      if (m) 판정[r.dataset.k + '_m'] = m;
    });
    b.disabled = true; said.textContent = '쓰는 중… (20초쯤 걸립니다)';
    try {
      const r = await (await fetch(FEED, {
        method: 'POST', headers: { 'content-type': 'text/plain' },
        body: JSON.stringify({ amb: 'draft', who: box.dataset.p, fid: box.dataset.f,
                               판정: 판정, 메모: box.querySelector('.jmemo').value }),
      })).json();
      if (!r.ok) { said.textContent = r.오류 || '실패'; b.disabled = false; return; }
      said.textContent = '';
      const 사람 = (d.사람 || []).find(x => x.id === box.dataset.p);
      사람.초안 = 사람.초안 || {}; 사람.초안[box.dataset.f] = r.초안;
      그리기(box, r.초안);
    } catch (e) { said.textContent = '실패 — 잠시 뒤 다시'; }
    b.disabled = false;
  });

  /* 초안 자리를 만들거나 갈아 끼운다 */
  function 그리기(box, 초안) {
    let d2 = box.querySelector('.draft');
    if (!d2) {
      d2 = document.createElement('div'); d2.className = 'draft';
      box.insertBefore(d2, box.querySelector('.fb'));
    }
    d2.innerHTML = '<div class="dh"><b>제안 피드백</b><small></small>' +
                   '<button type="button" class="cp">복사</button>' +
                   '<button type="button" class="use">채우기</button></div>' +
                   '<pre class="dtxt"></pre>';
    d2.querySelector('small').textContent =
      (초안.때 || '') + (초안.본것 ? ' · 점검표 반영' : ' · 영상 확인 전 초안');
    d2.querySelector('.dtxt').textContent = 초안.글 || '';
    붙이기(d2.querySelector('.use'));
    복사붙이기(d2.querySelector('.cp'));
  }

  /* 「이 내용으로 채우기」 — 이미 쓴 게 있으면 먼저 묻는다 */
  function 붙이기(btn) {
    btn.onclick = () => {
      const box = btn.closest('.vid'), ta = box.querySelector('.fb');
      const 글 = box.querySelector('.dtxt').textContent;
      if (ta.value.trim() && !confirm('이미 적어 두신 피드백이 있습니다. 덮어쓸까요?')) return;
      ta.value = 글; 늘리기(ta); ta.focus();
      btn.textContent = '채웠습니다 · 저장을 눌러 주세요';
      setTimeout(() => { btn.textContent = '이 내용으로 채우기'; }, 4000);
    };
  }
  document.querySelectorAll('.draft .use').forEach(붙이기);

  /* 저장 */
  document.querySelectorAll('.vid .save').forEach(b => b.onclick = async () => {
    const box = b.closest('.vid');
    const pid = box.dataset.p, fid = box.dataset.f;
    const said = box.querySelector('.said');
    const person = (d.사람 || []).find(x => x.id === pid);
    person.피드백 = person.피드백 || {};
    person.피드백[fid] = { 상태: box.querySelector('.st').value,
                          메모: box.querySelector('.fb').value };
    const 보낼것 = { ...person }; for (const k of ['파일', '계약파일', '기타파일', '폴더id']) delete 보낼것[k];   // 파일은 드라이브가 준다. 저장할 필요 없다.
    b.disabled = true; said.textContent = '저장 중';
    try {
      const r = await 저장보내기(pid, 보낼것);
      said.textContent = r.ok ? '저장됨' : (r.오류 || '실패');
      box.querySelector('.pill').textContent = person.피드백[fid].상태;
      box.querySelector('.pill').className = 'pill ' + person.피드백[fid].상태;
    } catch { said.textContent = '실패'; }
    b.disabled = false;
    setTimeout(() => { said.textContent = ''; }, 3000);
  });

  $('foot').innerHTML = '드라이브는 30분마다 새로 읽습니다 · ' +
    '피드백은 이 화면에만 저장되며 앰버서더에게 자동으로 가지 않습니다';
}

/* ⚠ 드라이브를 30분마다 새로 읽는 차례에 걸리면 서버 응답이 1분 넘게 걸리고 가끔 끊긴다
     (2026-09-28 실측 70초 → 「연결 실패」). 두 번까지 자동으로 다시 부르고, 그래도 안 되면 버튼을 준다. */
async function 불러오기(n = 0) {
  $('alarm').innerHTML = ''; $('date').textContent = n ? `다시 불러오는 중… (${n + 1}번째)` : '불러오는 중…';
  const 늦음 = setTimeout(() => { $('date').textContent = '드라이브 읽는 중 · 1분쯤 걸려요'; }, 8000);
  try { const r = await fetch(feed('amb=1')); clearTimeout(늦음); render(await r.json()); }
  catch (e) {
    clearTimeout(늦음);
    if (n < 2) return setTimeout(() => 불러오기(n + 1), 3000);
    $('alarm').innerHTML = `<div class="warnbox"><b>연결하지 못했습니다.</b> 잠시 뒤
      <button type="button" onclick="불러오기()" style="margin-left:6px;padding:6px 12px;border-radius:8px;border:0;font-weight:700">다시 시도</button></div>`;
    $('date').textContent = '연결 실패';
  }
}
불러오기();
</script>
<script>
/* ── 새 판이 바로 뜨게 ────────────────────────────────
   ⚠ GitHub Pages 가 HTML 에 `cache-control: max-age=600` 을 박는다. 서버 헤더는 못 바꾼다.
     그래서 배포하고 10분간 폰이 옛 화면을 썼다. sw.js 가 문서를 no-store 로 받아 그걸 건너뛴다.
   ⚠ 탈출구 — 말썽이면 주소 뒤에 ?nosw=1 을 붙여 열면 지워진다. (2026-08-28) */
(function () {
  if (!("serviceWorker" in navigator)) return;
  if (/[?&]nosw=1/.test(location.search)) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      rs.forEach(function (r) { r.unregister(); });
    }).catch(function () {});
    return;
  }
  navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" }).then(function (reg) {
    var 확인 = function () { try { reg.update(); } catch (e) {} };
    document.addEventListener("visibilitychange", function () { if (!document.hidden) 확인(); });
    window.addEventListener("pageshow", 확인);
  }).catch(function () {});
})();
</script>
