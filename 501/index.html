<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>오공일501 입실 안내</title>
<link rel="icon" href="/favicon.ico">
<meta name="theme-color" content="#0B0B0C">
<style>
  /* 손님이 보는 화면이다. 스페이스클라우드 공간 소개에 fva.co.kr/501 을 적어두면,
     예약번호와 휴대폰 뒤 4자리로 본인 확인을 하고 입실 안내를 꺼내 본다.
     감독님 번호를 노출하지 않고, 문자를 보내지 않아도 된다.

     ⚠ 검색에 뜨면 안 된다(noindex). 주소를 아는 사람만 들어온다.
     ⚠ 폰에서 한 손으로 쓰는 화면이다. 입력칸과 버튼을 크게 잡았다.
     ⚠ 숫자 키패드가 바로 뜨도록 inputmode=numeric. type=number 는 쓰지 않는다 —
       앞의 0 이 사라지고 화살표가 붙는다. */
  :root{
    --bg:#0B0B0C; --card:#17171A; --line:#26262B;
    --ink:#F5F5F7; --sub:#9A9AA2; --dim:#6A6A72;
    --gold:#E8C766;          /* 극장 조명 — 이 화면의 단 하나뿐인 강조색 */
    --bad:#FF6B7E;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--ink); min-height:100dvh;
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',Pretendard,system-ui,sans-serif;
    font-size:16px; line-height:1.6;
    padding:max(28px,env(safe-area-inset-top)) 18px calc(48px + env(safe-area-inset-bottom));
    display:flex; justify-content:center;
  }
  .wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:20px}

  header{text-align:center;padding:14px 0 2px}
  .mark{font-size:12px;letter-spacing:.34em;color:var(--gold);font-weight:700}
  h1{font-size:23px;font-weight:800;letter-spacing:-.03em;margin-top:9px}
  header p{color:var(--sub);font-size:14px;margin-top:7px}

  form{background:var(--card);border:1px solid var(--line);border-radius:18px;
       padding:20px 18px;display:flex;flex-direction:column;gap:14px}
  label{display:flex;flex-direction:column;gap:7px}
  label span{font-size:13px;font-weight:700;color:var(--sub)}
  input{
    width:100%; background:#0F0F11; color:var(--ink);
    border:1px solid var(--line); border-radius:12px;
    padding:14px 15px; font:inherit; font-size:18px; font-weight:700;
    letter-spacing:.06em; font-variant-numeric:tabular-nums;
  }
  input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
  input::placeholder{color:#4A4A52;font-weight:500;letter-spacing:0}
  button{
    background:var(--gold); color:#1A1508; border:0; border-radius:12px;
    padding:15px; font:inherit; font-size:16.5px; font-weight:800; cursor:pointer;
    transition:opacity .15s;
  }
  button:disabled{opacity:.5;cursor:default}
  button:active{opacity:.82}
  .hint{font-size:12.5px;color:var(--dim);line-height:1.55}

  .msg{border-radius:12px;padding:13px 15px;font-size:14px;line-height:1.55;display:none}
  .msg.on{display:block}
  .msg.bad{background:#2A1218;color:var(--bad)}

  /* 결과 */
  #out{display:none;flex-direction:column;gap:16px}
  #out.on{display:flex}
  .who{font-size:14px;color:var(--sub);text-align:center}
  .code{
    background:var(--card);border:1px solid var(--gold);border-radius:18px;
    padding:22px 18px;text-align:center;
  }
  .code .lb{font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--gold)}
  .code .vl{font-size:48px;font-weight:800;letter-spacing:.14em;margin-top:6px;
            font-variant-numeric:tabular-nums}
  .code .sub{font-size:13px;color:var(--sub);margin-top:8px}
  .guide{background:var(--card);border:1px solid var(--line);border-radius:18px;
         padding:18px;white-space:pre-wrap;word-break:keep-all;font-size:14.5px;line-height:1.75}
  .again{background:none;color:var(--sub);border:1px solid var(--line);font-weight:600}

  footer{text-align:center;color:var(--dim);font-size:12.5px;line-height:1.7}
  footer a{color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">501</div>
    <h1>입실 안내</h1>
    <p>예약번호로 출입문 비밀번호와 이용 안내를 확인하실 수 있습니다.</p>
  </header>

  <form id="f" autocomplete="off">
    <label><span>예약번호</span>
      <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="10475226" required></label>
    <label><span>휴대폰 뒤 4자리</span>
      <input id="tail" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" required></label>
    <button id="go" type="submit">안내 보기</button>
    <p class="hint">예약번호는 스페이스클라우드 예약 내역에서 확인하실 수 있습니다.
      이용일 <b>하루 전부터</b> 열립니다.</p>
  </form>

  <div class="msg bad" id="err"></div>

  <div id="out">
    <div class="who" id="who"></div>
    <div class="code">
      <div class="lb">출입문 비밀번호</div>
      <div class="vl" id="pw">— — — —</div>
      <div class="sub">들어오신 뒤 잠금장치 버튼을 눌러 문을 잠가주세요.</div>
    </div>
    <div class="guide" id="guide"></div>
    <button class="again" type="button" id="again">다른 예약 확인하기</button>
  </div>

  <footer>
    합정 프라이빗 영화관 <b>오공일501</b><br>
    문의는 스페이스클라우드 채팅으로 남겨주세요.
  </footer>
</div>

<script>
const FEED = 'https://script.google.com/macros/s/AKfycbxWKkz5rS112O8ePWYgFqEl9S5Cb-gZjLcxS3eTpnhzloGA2dtr3rN00rOso-0Mwo0/exec';
const $ = id => document.getElementById(id);

/* 안내문 안에서 「비밀번호 : 3530」 줄을 찾아 큰 숫자로 따로 띄운다.
   손님이 실제로 찾는 건 이 네 자리 하나다. 나머지는 그 아래에 그대로 둔다. */
function pickCode(text) {
  const m = text.match(/비밀번호\s*:\s*([0-9]{3,8})/);
  return m ? m[1] : '';
}

$('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const code = $('code').value.replace(/\D/g, '');
  const tail = $('tail').value.replace(/\D/g, '');
  $('err').classList.remove('on');
  $('out').classList.remove('on');
  $('go').disabled = true; $('go').textContent = '확인하는 중…';

  try {
    const r = await fetch(`${FEED}?code=${code}&tail=${tail}`);
    const d = await r.json();
    if (!d.ok) {
      $('err').textContent = (d.오류 || '확인하지 못했습니다.') + (d.날짜 ? ` (예약: ${d.날짜})` : '');
      $('err').classList.add('on');
    } else {
      $('who').textContent = `${d.이름}님 · ${d.날짜}`;
      $('pw').textContent = pickCode(d.안내) || '안내문 확인';
      $('guide').textContent = d.안내;
      $('out').classList.add('on');
      $('f').style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  } catch {
    $('err').textContent = '연결하지 못했습니다. 잠시 뒤 다시 시도해주세요.';
    $('err').classList.add('on');
  }
  $('go').disabled = false; $('go').textContent = '안내 보기';
});

$('again').addEventListener('click', () => {
  $('out').classList.remove('on');
  $('f').style.display = '';
  $('code').value = ''; $('tail').value = ''; $('code').focus();
});
</script>
</body></html>
